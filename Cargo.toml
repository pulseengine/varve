[workspace]
resolver = "2"
members = ["crates/varve", "crates/varve-core", "crates/varve-producer"]

[workspace.package]
version = "0.29.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/varve"
authors = ["PulseEngine"]

[workspace.dependencies]
# The `version` is what makes `cargo publish` possible at all: a path-only
# dependency cannot be published (REQ-BOOTSTRAP-001). It must be bumped in
# lockstep with workspace.package.version above — `publish-crates.yml`
# asserts they agree before it publishes anything.
varve-core = { path = "crates/varve-core", version = "0.29.0" }
