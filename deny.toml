# cargo-deny — dependency vulnerability + license + source audit
# (SSDF PW/RV, IEC 62443-4-1 SI/DM). A supply-chain tool must scan its own
# supply chain.
[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 — Marvin attack, `rsa` 0.9.x, reached through
# `pgp` (rPGP), which varve-producer uses to verify detached OpenPGP
# signatures over upstream digest lists (REQ-SIGNEDSUMS-001). There is no
# patched release: the advisory's `patched` list is empty.
#
# WHY THIS IS ACCEPTABLE HERE, and the condition under which it stops being.
# The advisory is a timing side-channel in RSA PRIVATE-KEY operations. varve
# holds no OpenPGP private key and performs no RSA decryption or signing; it
# verifies signatures made elsewhere, using public keys, over bytes that are
# already public. There is no secret in this process for a timing channel to
# leak.
#
# That reasoning fails the day varve SIGNS with RSA. It does not today —
# realm signing is ed25519 (`varve keygen`, `sign-layer-manifest`) and this
# module is verification-only — and if that changes, this entry must go and
# the dependency must be re-argued rather than inherited.
#
# Reviewed against the alternative: `sequoia-openpgp` avoids `rsa` but is
# LGPL-2.0-or-later (not on the allow-list below) and links the C library
# Nettle, which a statically linked musl binary cannot take. Dropping PGP
# support entirely would remove the only proof-carrying path to upstream Rust
# and force either an in-org compiler build or unvouched bytes (DD-034).
ignore = [
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0387 — constant-time (timing side-channel) branches in
  # `crypto-bigint` 0.5.x (subtraction, zero counting, division, Montgomery
  # multiplication, UintRef equality, BoxedMontyForm::invert), reached through
  # `elliptic-curve` 0.13.x, which `pgp` 0.21.0 (rPGP, varve-producer) and
  # `wsc` 0.11.0 (varve-core) both depend on. No reachable patched release:
  # pgp 0.21.0 and wsc 0.11.0 are the latest published versions and are tied
  # to the elliptic-curve 0.13.x line; elliptic-curve 0.14.x (which uses
  # crypto-bigint 0.7.x) is not yet a dependency of either, so
  # `cargo update -p crypto-bigint` cannot move it.
  #
  # WHY THIS IS ACCEPTABLE HERE: the advisory is a timing side-channel in
  # elliptic-curve arithmetic. varve performs no ECDSA/ECDH private-key
  # operations through these crates — it verifies detached OpenPGP signatures
  # made elsewhere, using public keys, over bytes that are already public
  # (same posture as the RUSTSEC-2023-0071 entry above). varve's own signing
  # is ed25519 (`varve keygen`, `sign-layer-manifest`), which does not go
  # through crypto-bigint. There is no secret in this process for a timing
  # channel to leak.
  #
  # That reasoning fails the day varve SIGNS with ECDSA/ECDH through these
  # crates. It does not today. Drop this entry as soon as pgp/wsc ship against
  # elliptic-curve 0.14.x, and re-argue rather than inherit if the posture
  # changes.
  "RUSTSEC-2026-0387",
]

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "Unicode-3.0", "ISC", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
