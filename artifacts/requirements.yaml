artifacts:
  # ─────────────────────────────────────────────────────────────────────
  # The invariants. These are not features — they are the properties that
  # make a pin trustworthy. Every one of them is meant to be mechanically
  # checked, per oracle-gate-a-change; none may be discharged by prose.
  #
  # Release plan (rivet release status <v> is the readiness query):
  #   v0.1.0  resolution + the core, purely local
  #   v0.2.0  verified install from a registry
  #   v0.3.0  the offline core / archive
  #   v0.4.0  deposit (CI) + provenance stamping
  #   v0.5.0  known-problems / support-window metadata + self-verification
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-PIN-001
    type: requirement
    title: A pinned layer resolves exactly, or the command fails
    status: verified
    release: v0.1.0
    description: >
      varve shall resolve the pinned layer by walking up from the working
      directory, and shall fail with the corrective install command when the
      pin is missing, unresolvable, or incompletely installed. It shall never
      fall back to another layer or to binaries already on PATH.

      Rationale: silent fallback reintroduces the exact failure this project
      exists to remove — an artifact produced by an unpinned toolchain that
      looks fine. A consumer frozen on a qualified layer must stay frozen.
    tags: [core, safety]
    links:
      - type: satisfies
        target: SC-003
    fields:
      priority: must
      category: functional

  - id: REQ-VERIFY-001
    type: requirement
    title: Verification is independent of where the bytes came from
    status: verified
    release: v0.2.0
    description: >
      varve shall verify the layer manifest signature and every artifact digest
      against the PulseEngine trust root on every path — anonymous registry
      pull, authenticated pull, or archived core — before any byte is used.

      Kill-criterion: running the same layer through two different sources
      yields different accept/reject verdicts. If a source can influence
      acceptance, it has joined the trusted base and the design is broken.
    tags: [core, security]
    links:
      - type: satisfies
        target: SC-002
    fields:
      priority: must
      category: non-functional

  - id: REQ-COEXIST-001
    type: requirement
    title: Layers coexist; switching is by directory
    status: verified
    release: v0.1.0
    description: >
      varve shall keep layers in a content-addressed core keyed by manifest
      digest, so that several layers are installed simultaneously and selecting
      one costs no download. Driving case: relay and jess on the August layer
      while wohl remains on July, on one machine, the same day.
    tags: [core, ergonomics]
    fields:
      priority: must
      category: functional

  - id: REQ-OFFLINE-001
    type: requirement
    title: An archived core installs with no registry and no network
    status: verified
    release: v0.3.0
    description: >
      varve shall export a layer as a directory-shaped oci-layout archive, and
      shall install from that archive with no registry reachable, with
      verification unchanged.

      Rationale: a registry is a cache, not an archive. A qualified line must
      remain reconstructible after retention policies have forgotten it — this
      is the artifact of record for the safety case.
    tags: [core, safety]
    fields:
      priority: must
      category: functional

  - id: REQ-NOUPDATE-001
    type: requirement
    title: varve never moves a project between layers on its own
    status: verified
    release: v0.1.0
    description: >
      varve shall not contain any mechanism that changes the layer a project
      resolves to without an edit to a checked-in file. No background update,
      no implicit upgrade on install, no "latest" resolution for a qualified
      channel.

      Rationale: consumers freeze because re-qualification costs money. Moving
      them silently destroys evidence they paid for. A background updater in
      this tool is a defect, not a feature.
    tags: [core, safety]
    fields:
      priority: must
      category: constraint

  - id: REQ-PROV-001
    type: requirement
    title: Build outputs record the layer that produced them
    status: verified
    release: v0.5.0
    description: >
      varve shall stamp the layer identity (name and manifest digest) into the
      provenance an artifact carries, so that "which toolchain produced this?"
      is answerable from the artifact alone, offline, with no lookup.
      Implemented as an addition to the existing wsc-attestation ToolInfo, so
      individual tools need no awareness of layers. The cross-repo ToolInfo
      extension is tracked as a sigil issue so it can land upstream on its own
      cadence before v0.4.0 needs it.
    tags: [traceability]
    links:
      - type: satisfies
        target: SC-004
    fields:
      priority: should
      category: functional

  - id: REQ-SCOPE-001
    type: requirement
    title: varve selects and verifies; it never transforms code
    status: verified
    release: v0.1.0
    description: >
      varve shall not compile, fuse, optimise, instrument or otherwise
      transform any user artifact. Its qualification scope is limited to
      selecting a layer, verifying it, and dispatching to the tools within it.

      Rationale: this boundary is what keeps varve's qualification scope small
      and separable from the qualified toolchain it delivers — and it is why
      varve is not part of the layer it installs.
    tags: [core, qualification]
    fields:
      priority: must
      category: constraint

  # ─────────────────────────────────────────────────────────────────────
  # Formerly open — both decided 2026-08-07 after a research pass over
  # criticalup/Ferrocene, TUF, Uptane, SUIT (RFC 9019), DO-330 and the
  # qualified-tool vendor practice (AdaCore, IAR, Wind River). See DD-004,
  # DD-005 and the research artifacts (CA-*, AR-*) they cite.
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-ROLLBACK-001
    type: requirement
    title: A stale but validly-signed layer cannot be passed off as current
    status: verified
    release: v0.2.0
    description: >
      varve shall reject a layer whose release counter is lower than the
      highest counter it has accepted for that release line, and shall surface
      a staleness warning when a layer's signed issued-at timestamp exceeds a
      configurable age. The counter and issued-at live inside the signed layer
      metadata (never in mutable tag state); the client persists a high-water
      mark per line. Decided per DD-005 — the SUIT/Uptane monotonic-counter
      model; tuf-on-ci is the recorded upgrade path should a connected
      freshness channel be needed.
    tags: [security]
    links:
      - type: satisfies
        target: SC-001
      - type: traces-to
        target: DD-005
    fields:
      priority: must
      category: non-functional

  - id: REQ-PATCH-001
    type: requirement
    title: A frozen line can receive a patch without moving the consumer off it
    status: verified
    release: v0.1.0
    description: >
      The layer identifier shall be three-part from the first deposit —
      YYYY.MM.P, with .0 for the initial deposit of a line (2026.07.0). A
      patch (2026.07.1) stays inside the frozen line and carries a signed
      qualification-delta attestation referencing its baseline, scoped to what
      changed. Decided per DD-004 — the identifier grammar freezes with
      manifest-version 1, so it lands in v0.1.0 even though the first patch
      deposit is far away.
    tags: [qualification]
    links:
      - type: traces-to
        target: DD-004
    fields:
      priority: must
      category: functional

  # ─────────────────────────────────────────────────────────────────────
  # v0.5.0 — the criticalup gaps worth owning (see CA-CRITICALUP):
  # metadata that their v2 schema designed but never shipped, and the
  # self-verification story their CLI only recently gained.
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-KP-001
    type: requirement
    title: Known-problems, support-window and yank metadata ship and are surfaced
    status: verified
    release: v0.5.0
    description: >
      A layer shall be able to carry signed known-problems entries
      (description, scope, workaround, detection, mitigation, affected
      releases), a stated support window, and a yanked marker — attached as
      OCI referrers so they can be added after deposit without changing the
      layer digest. varve status shall surface them for the pinned layer
      ("2026.07.0: 3 known problems, 2 with workarounds; supported until
      2028-07"). A yanked layer warns loudly but remains installable — the
      consumer owns the freeze decision.

      Rationale: the industry's default answer to a defect in a frozen line is
      a known-problems list, not a forced move (Ferrocene, AdaCore, IAR).
      criticalup designed exactly this metadata in its v2 schema and never
      shipped it.
    tags: [qualification, differentiator]
    fields:
      priority: must
      category: functional

  - id: REQ-SELF-001
    type: requirement
    title: varve verifies its own releases the way it verifies layers
    status: verified
    release: v0.5.0
    description: >
      varve's own release artifacts shall be cosign-signed and varve shall be
      able to verify a candidate varve binary/archive against the PulseEngine
      trust root before it replaces itself or is first trusted — failing
      closed. The tool that gates the toolchain must clear its own gate.

      Rationale: varve sits outside the layer it installs (DD-002), so nothing
      else verifies it. Dogfooding the attestation chain on ourselves is the
      strongest end-to-end test of the supply-chain story we can run.
    tags: [security, differentiator]
    links:
      - type: traces-to
        target: DD-002
    fields:
      priority: must
      category: non-functional

  - id: REQ-DEPOSIT-001
    type: requirement
    title: A layer is assembled, signed and published by CI in one auditable step
    status: verified
    release: v0.4.0
    description: >
      varve deposit shall assemble a layer manifest (OCI image index) from the
      pinned per-tool release artifacts, embed the release counter and
      issued-at, sign it by digest via sigil, attach referrers, and publish —
      producing the same bundle whether it lands on a registry or in an
      oci-layout archive. Deposit is the only way a layer comes into being;
      hand-edited layer manifests do not exist.
    tags: [core, ci]
    fields:
      priority: must
      category: functional

  # ─────────────────────────────────────────────────────────────────────
  # Decisions. DD-001..003 were taken in the pulseengine.eu#157 thread;
  # DD-004..007 were taken 2026-08-07 with the research artifacts as
  # evidence. All approved.
  # ─────────────────────────────────────────────────────────────────────

  - id: DD-001
    type: design-decision
    title: Distribute layers as OCI image indexes rather than a bespoke format
    status: accepted
    release: v0.1.0
    description: >
      An OCI image index gives content-addressed digests (pinning is native),
      one-index-to-N-artifacts (the bundle shape), per-platform selection
      (no substitution language to invent), referrers for attestations and
      qualification evidence, registry authentication as the access-control
      seam, and oci-layout export for the offline core.

      Precedent in-house: relay already publishes cosign-signed OCI artifacts
      with the Component Model media type; sigil already carries the OCI
      container, cosign, digest and referrer machinery.
    links:
      - type: satisfies
        target: REQ-OFFLINE-001
      - type: satisfies
        target: REQ-VERIFY-001
      - type: satisfies
        target: REQ-COEXIST-001
      - type: satisfies
        target: REQ-DEPOSIT-001
    fields:
      rationale: >
        Content-addressed digests make pinning native; one index to N artifacts
        is the bundle shape; per-platform selection is the index's own mechanism;
        referrers carry attestations and qualification evidence; registry
        authentication becomes the access seam with no service to write; and
        oci-layout export yields the offline core. A bespoke format would have to
        reinvent every one of those, and relay + sigil already run this stack.
    tags: [architecture]

  - id: DD-002
    type: design-decision
    title: varve is a separate tool, outside the layer it installs
    status: accepted
    release: v0.1.0
    description: >
      sigil is a member of the toolchain bundle. A tool that installs a set
      containing sigil cannot itself be sigil — it must be obtainable before
      any layer exists. varve also has a different audience and lifecycle from
      the toolchain, and a qualification scope statement that must stand alone
      ("selects and verifies; does not transform code").

      Same reasoning Ferrocene applies in keeping criticalup outside the
      Ferrocene toolchain.
    links:
      - type: satisfies
        target: REQ-SCOPE-001
      - type: satisfies
        target: REQ-NOUPDATE-001
    fields:
      rationale: >
        sigil is a member of the layer varve installs, so varve cannot be sigil
        without a bootstrap loop — it must exist before any layer does. Its
        audience and lifecycle differ from the toolchain's, and its qualification
        scope statement must stand alone rather than being folded into a tool
        that is itself qualified. Ferrocene keeps criticalup outside the Ferrocene
        toolchain for the same reason.
    tags: [architecture]

  - id: DD-003
    type: design-decision
    title: Access is pluggable; acceptance is not
    status: accepted
    release: v0.2.0
    description: >
      Fetch goes through a source abstraction from the first commit, with a
      public-registry implementation as the only one shipped. An entitlement
      plug-in — should a non-public layer ever exist — is registry
      authentication, not a service we write.

      Verification is wired to the trust root, never to the source. See
      REQ-VERIFY-001 for the kill-criterion that enforces this.
    links:
      - type: satisfies
        target: REQ-VERIFY-001
    fields:
      rationale: >
        Access and acceptance are different questions. A registry may decide
        whether bytes are obtainable; it must never influence whether they are
        accepted, or it has joined the trusted base. Shipping the source
        abstraction from the first commit keeps a future entitlement plug-in from
        requiring a redesign, while the single public implementation keeps today
        simple.
    tags: [architecture, security]

  - id: DD-004
    type: design-decision
    title: "Layer identifiers are three-part from day one: YYYY.MM.P, frozen-line patch model"
    status: accepted
    release: v0.1.0
    description: >
      A layer is always YYYY.MM.P — 2026.07.0 is the initial deposit of the
      July line, 2026.07.1 a patch inside it. Patches stay minimal (critical
      fixes only) and carry a signed qualification-delta attestation
      referencing the baseline (the DO-330 change-impact-analysis mechanism).
      Known-problems entries attach as signed referrers per REQ-KP-001, so the
      no-patch mitigation path is tooling, not folklore. The identifier
      grammar is part of manifest-version 1 and never migrates.
    links:
      - type: satisfies
        target: REQ-PATCH-001
    fields:
      rationale: >
        Ferrocene reserves exactly this shape (YY.MM.patch) for its qualified
        line; AdaCore sustained branches, IAR frozen service packs and Wind
        River legacy branches all patch frozen lines rather than forcing a
        jump; DO-330 sanctions qualification reuse via change impact analysis.
        A two-part identifier becomes ambiguous the day the first patch
        exists — exactly the resolution ambiguity a qualified pin must not
        have. Deciding now is cheap; migrating a manifest format consumers
        have frozen against is not.
    tags: [architecture, qualification]

  - id: DD-005
    type: design-decision
    title: "Anti-rollback: monotonic per-line release counters in signed metadata; tuf-on-ci as upgrade path"
    status: accepted
    release: v0.2.0
    description: >
      Every layer manifest carries a release counter (monotonic per release
      line) and an issued-at timestamp inside the signed payload. The client
      persists a high-water mark per line and hard-rejects any layer below it;
      issued-at drives staleness warnings with a configurable threshold. Tags
      are discovery-only — trust lives in digest + signature + counter.
      Counters are scoped per line, so a consumer frozen on 2026.07 gets
      rollback protection within the line without ever being pressured toward
      2026.08. If a connected freshness channel is ever needed, tuf-on-ci
      (static-file TUF, KMS-signed timestamp/snapshot on CI) is the recorded
      upgrade path; full TUF is not stood up before varve has users.
    links:
      - type: satisfies
        target: REQ-ROLLBACK-001
    fields:
      rationale: >
        The SUIT manifest (RFC 9019 family) makes a monotonic sequence number
        a REQUIRED, MUST-reject field for offline/constrained verifiers;
        Uptane's release counters deliver rollback protection that survives
        compromise of the online half because they sit in offline-signed
        metadata plus persisted client state. Both are designed for exactly
        varve's constraints: static hosting, air-gap, no server. Sigstore
        machinery proves authenticity at time of signing, never currency, so
        counters close a gap signatures cannot. criticalup has no rollback or
        freshness protection at all — this is a differentiator we own.
        Regulations (UNECE R156, IEC 62443-4-2, RFC 9019) require downgrade
        control and version identification but mandate no specific framework;
        a documented signed-counter scheme satisfies them without TUF's
        re-signing treadmill.
    tags: [architecture, security]

  - id: DD-006
    type: design-decision
    title: Resolution is walk-up discovery plus shims that exec, never fall back
    status: accepted
    release: v0.1.0
    description: >
      The pin (varve.toml) is discovered by walking up from the working
      directory, the rust-toolchain.toml reflex. Shims on PATH resolve the pin
      on every invocation and exec the real binary from the content-addressed
      core; a missing or partial layer is a hard error carrying the corrective
      install command. Switching projects is cd. varve which answers "which
      binary would actually run, and why".
    links:
      - type: satisfies
        target: REQ-PIN-001
      - type: satisfies
        target: REQ-COEXIST-001
    fields:
      rationale: >
        rustup and criticalup both converge on per-project manifest + shims —
        the mechanism developers already trust. Resolving on every invocation
        makes the drift check free (the shim knows pin and resolution), and
        exec keeps varve out of the data path per REQ-SCOPE-001. The
        fail-closed rule is load-bearing: silent fallback would contaminate an
        output rather than waste an afternoon.
    tags: [architecture, ergonomics]

  - id: DD-007
    type: design-decision
    title: Provenance stamping extends wsc-attestation ToolInfo, not the tools
    status: accepted
    release: v0.4.0
    description: >
      The layer identity (name + manifest digest) enters build provenance via
      two optional fields on wsc-attestation's ToolInfo (toolchain,
      toolchain-manifest-digest), populated at dispatch time from what the
      shim already knows. Individual tools stay layer-unaware. The field
      addition lives in the sigil repo and is filed there now so it lands
      upstream before varve v0.4.0 consumes it.
    links:
      - type: satisfies
        target: REQ-PROV-001
    fields:
      rationale: >
        wsc-attestation already records per-transformation ToolInfo inside the
        signed artifact (custom sections are covered by the signature), so one
        field addition makes every meld/loom/synth hop carry the qualified-set
        identity — catching the mixed-toolchain hazard a qualification review
        must exclude. Stamping at the shim keeps the change in one place
        instead of ten tools.
    tags: [architecture, traceability]

  - id: DD-008
    type: design-decision
    title: Line-status documents — signed, updatable evidence beside immutable layers
    status: accepted
    release: v0.5.0
    description: >
      Known-problems entries, the support window, and yank markers for a
      release line live in ONE per-line "line status" document — a DSSE
      envelope (payload type …varve.line-status.v1+json) signed with the
      PulseEngine root, carrying its own monotonic counter + issued-at so
      freshness is checkable with the same high-water-mark machinery as
      layers. It is distributed beside layers (a blob in archives, a
      referrer on registries) precisely because it must be updatable after
      deposit without changing any layer digest. varve caches the newest
      verified document per line at install and `varve status` reports from
      the cache offline. A yanked layer warns loudly but remains
      installable — the consumer owns the freeze decision.
    links:
      - type: satisfies
        target: REQ-KP-001
    fields:
      rationale: >
        The Ferrocene known-problems schema (description, scope, workaround,
        detection, mitigation, affected releases) is the audit-accepted
        no-patch mitigation path; criticalup designed support-expiry and
        yank metadata in its v2 schema and never shipped it. Making the
        document per-line and separately signed keeps layers immutable
        (their digest IS their identity) while evidence stays current —
        the referrer property (see the OCI distribution decision), applied to advisories.
    tags: [architecture, qualification]

  - id: DD-009
    type: design-decision
    title: Self-verification dogfoods the varve trust root, not cosign-in-library
    status: accepted
    release: v0.5.0
    description: >
      varve's own releases gain a varve-native signature: a DSSE envelope
      over SHA256SUMS.txt (payload type …varve.release-sums.v1+json) signed
      with the same root key deposit already requires in CI. `varve
      self-verify` checks a candidate archive against the envelope + sums
      with the pinned root, fully offline — failing closed, including when
      the envelope asset is absent. cosign/SLSA signing remains (Track A);
      this is additive. Production signing of the release asset activates
      when the root ceremony provisions the key (v1.0 gate); the machinery,
      tests, and workflow wiring land now.
    links:
      - type: satisfies
        target: REQ-SELF-001
    fields:
      rationale: >
        sigil's wsc cannot verify Sigstore bundles in-library today
        (sigil#219) and shelling out to a cosign binary would put an
        unpinned external tool in varve's own trust path. The root key is
        already a CI secret by REQ-DEPOSIT-001's design, so signing the sums
        adds no new trust exposure — and varve verifying varve with varve's
        own machinery is the strongest end-to-end exercise of the DSSE chain
        we can run (the dogfooding argument from pulseengine.eu#157).
    tags: [architecture, security]

  # ─────────────────────────────────────────────────────────────────────
  # v0.6.0 — the adoption arc: shims, the platform dimension, and the
  # public-registry source. Scoped 2026-08-07 after the v0.1..v0.5 plan
  # completed; the driving act is the first real deposit (dogfood).
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-SHIM-001
    type: requirement
    title: Shims on PATH resolve the pin per invocation and exec, never fall back
    status: verified
    release: v0.6.0
    description: >
      varve shim install shall write, into a dedicated shim directory, one
      executable per tool of the pinned layer; each shim resolves the pin by
      walking up from the invocation's working directory, execs the resolved
      binary with the provenance environment set, and fails closed with the
      corrective command when the pin is missing or the layer absent —
      identical semantics to varve run, minus the typing. Switching projects
      is cd. Completes DD-006's ergonomics half.
    tags: [core, ergonomics]
    links:
      - type: traces-to
        target: DD-006
    fields:
      priority: must
      category: functional

  - id: REQ-PLATFORM-001
    type: requirement
    title: Layers carry a platform dimension; resolution is host-filtered
    status: verified
    release: v0.6.0
    description: >
      Deposit shall record a platform annotation (target triple) on every
      manifest entry, and install shall select only entries matching the
      host platform (with an explicit override flag for cross-platform
      workflows). A layer carrying no entry for the host platform fails
      closed at install — never a wrong-architecture binary on disk. The
      index's own per-platform mechanism, per DD-001, not a substitution
      language.
    tags: [core]
    links:
      - type: traces-to
        target: DD-001
    fields:
      priority: must
      category: functional

  - id: REQ-REGISTRY-001
    type: requirement
    title: A layer installs by pin from a public OCI registry, verification unchanged
    status: verified
    release: v0.6.0
    description: >
      varve shall install a pinned layer from an anonymous public OCI
      registry (GHCR) through the LayerSource seam: manifest and blobs
      fetched over the OCI distribution API, then the same pipeline — DSSE
      signature against the trust root, digest checks, anti-rollback —
      decides acceptance. The kill-criterion extends to this path: identical
      bytes through registry, archive, and directory sources yield identical
      verdicts. Publishing is not client scope: CI pushes the standard
      oci-layout with standard tooling, which never joins the trust path.
    tags: [core, security]
    links:
      - type: satisfies
        target: SC-002
      - type: traces-to
        target: DD-003
    fields:
      priority: must
      category: functional

  - id: REQ-ENV-001
    type: requirement
    title: varve sets up its own environment; users source it, never hand-edit
    status: verified
    release: v0.7.0
    description: >
      varve env shall emit idempotent shell code that puts the shim directory
      on PATH (evaluable via eval "$(varve env)" and written as a sourceable
      $VARVE_ROOT/env file at shim install, the rustup pattern), and varve
      completions <shell> shall emit completion scripts for zsh, bash and
      fish. Setup is one sourced line; instructing users to hand-edit PATH
      is the anti-pattern this requirement retires. Evaluating the
      environment twice must not stack duplicate PATH entries.
    tags: [ergonomics]
    links:
      - type: traces-to
        target: DD-006
    fields:
      priority: should
      category: functional

  - id: REQ-UPDATE-001
    type: requirement
    title: varve updates itself only as an explicit, verified, fail-closed act
    status: verified
    release: v0.8.0
    description: >
      varve self-update shall check the latest release, download the host
      platform's archive plus its varve-native signed sums envelope, verify
      the archive with the RUNNING binary against the pinned trust root
      (old-verifies-new — the update chain), and replace the binary
      atomically, reporting old -> new. Any verification failure refuses,
      never warns. varve self-update --check reports without changing
      anything. No passive network calls ever: varve makes no request the
      user did not explicitly command (no phone-home staleness beacon); the
      explicit --check is the staleness answer. Until the root ceremony,
      release sums are signed with the PROVISIONAL rolling key, explicitly
      labeled; the ceremony release will be dual-signed so the
      old-verifies-new chain migrates without a flag day.
    tags: [security, ergonomics]
    links:
      - type: traces-to
        target: DD-009
    fields:
      priority: should
      category: non-functional

  - id: REQ-BAZEL-001
    type: requirement
    title: Bazel checksum registries compile from signed layers, never from TOFU
    status: verified
    release: v0.9.0
    description: >
      Deposits shall record, inside the signed payload, each tool's source
      provenance — upstream repo, release tag, asset name, and the sha256 of
      the asset AS DOWNLOADED (the bytes Bazel will hash) — and varve
      export-bazel shall compile, from a verified layer, the
      rules_wasm_component checksum-registry JSON (tool/version/platform ->
      url_suffix + sha256, their platform-key vocabulary). Bazel's fetch
      path stays pure sha256-pinned download; what changes is who authors
      the hashes: transcribed from a signed, counter-protected manifest
      instead of hashed off whatever a release page served. Tools without
      source provenance are skipped loudly, never silently. The consuming
      CI gate lives in rules_wasm_component and is tracked there.
    tags: [security, integration]
    links:
      - type: satisfies
        target: SC-002
      - type: traces-to
        target: DD-001
    fields:
      priority: should
      category: functional

  - id: REQ-REALM-001
    type: requirement
    title: A pin names its trust universe; realms are isolated by construction
    status: verified
    release: v0.10.0
    description: >
      varve.toml may name a realm; a committed varve-realms.toml (discovered
      by the same walk-up as the pin, so trust travels with the code) defines
      each realm's registry and trust root (inline hex key or a file relative
      to the realms file). When a realm is named it is AUTHORITATIVE — the
      ambient environment cannot substitute a different trust root — and all
      per-realm state (core, high-water marks, status cache) lives under an
      effective root namespaced by the trust-root fingerprint, so two realms
      cannot cross-talk even with identical layer names and counters. One
      shim directory serves every realm: resolution is per-invocation, so cd
      between projects of different realms switches tool universes. A pin
      naming an undefined realm fails closed with the corrective guidance.
    tags: [core, security]
    links:
      - type: satisfies
        target: SC-002
      - type: traces-to
        target: DD-003
    fields:
      priority: should
      category: functional

  - id: REQ-RUNNER-001
    type: requirement
    title: Portable wasm entries execute through a runner from the same layer
    status: verified
    release: v0.11.0
    description: >
      A layer entry whose platform is a wasm32 target is PORTABLE — it
      matches every host — and may carry, inside the signed payload, a
      runner contract: the name of another tool in the same layer that
      executes it, prefix arguments, and an optional per-argument flag
      (kilnd's --wasi-arg shape). varve run and the shims dispatch such
      entries through their runner, resolved from the same verified layer —
      never from PATH. A runnered entry whose runner is absent from the
      layer fails closed. This is how wasm-only tools (scry, once kiln#480
      resolves) join layers with zero per-platform gaps.
    tags: [core]
    links:
      - type: traces-to
        target: DD-006
    fields:
      priority: should
      category: functional

  # ─────────────────────────────────────────────────────────────────────
  # v0.12.0 debt payment: the eight decisions v0.6..v0.11 shipped without
  # DD artifacts, reconstructed from their actual in-session rationale.
  # ─────────────────────────────────────────────────────────────────────

  - id: DD-010
    type: design-decision
    title: Shims are per-invocation dispatchers generated from the pinned layer
    status: accepted
    release: v0.12.0
    description: >
      A shim is a two-line exec wrapper around `varve run` written into one
      global shim directory; every invocation re-resolves the pin (and its
      realm) from the working directory. Names are entry points only —
      resolution decides reality — so one directory serves every project
      and every realm, and stale shims cannot pin stale layers.
    links:
      - type: satisfies
        target: REQ-SHIM-001
    fields:
      rationale: >
        rustup and criticalup both converge on shims; generating them from
        the resolved layer keeps varve out of the dispatch path (exec, not
        wrap), and per-invocation resolution makes cd the universe switch —
        no activation state to forget or leak between projects.
    tags: [architecture, ergonomics]

  - id: DD-011
    type: design-decision
    title: Platform is a per-entry annotation filtered at install, not a store dimension
    status: accepted
    release: v0.12.0
    description: >
      Entries carry a target triple; install filters BEFORE any blob fetch;
      unstamped entries are platform-independent for backward compatibility;
      a fully-stamped layer with nothing for the host fails closed. The
      store stays single-platform per machine — the manifest, not the
      store, is multi-platform.
    links:
      - type: satisfies
        target: REQ-PLATFORM-001
      - type: traces-to
        target: DD-001
    fields:
      rationale: >
        The OCI index's own per-platform mechanism (DD-001) extended to
        varve entries: filtering at install keeps foreign binaries from
        ever landing (wrong-arch cannot look installed), while unstamped
        compatibility avoided a flag-day for layers deposited before the
        dimension existed.
    tags: [architecture]

  - id: DD-012
    type: design-decision
    title: Registry client is pull-only, native, and out of the publish path
    status: accepted
    release: v0.12.0
    description: >
      A minimal OCI-distribution client (anonymous token dance, manifest by
      tag, blobs by digest, transport-level digest fail-fast) implements
      LayerSource; publishing uses standard tooling (oras) in CI only. Tags
      are discovery; trust remains digest + signature + counter.
    links:
      - type: satisfies
        target: REQ-REGISTRY-001
    fields:
      rationale: >
        Pull-only keeps the client's trusted base small and auditable; the
        publish side never joins the client trust path, so its tooling can
        be swapped freely. The kill-criterion extends across transports,
        which is the property that matters — not the HTTP library.
    tags: [architecture, security]

  - id: DD-013
    type: design-decision
    title: Environment setup is emitted by varve and sourced, never hand-edited
    status: accepted
    release: v0.12.0
    description: >
      varve env emits idempotent shell code; shim install writes a
      sourceable env file (rustup pattern); completions ship from the tool.
      Double evaluation cannot stack PATH entries.
    links:
      - type: satisfies
        target: REQ-ENV-001
    fields:
      rationale: >
        Instructing users to edit PATH is ambient state by another name —
        the class of manual step varve exists to remove. One sourced line
        is reviewable, idempotent, and uninstallable.
    tags: [ergonomics]

  - id: DD-014
    type: design-decision
    title: Self-update rides the old-verifies-new chain under the deposit root
    status: accepted
    release: v0.12.0
    description: >
      The running binary verifies its successor against the pinned trust
      root before an atomic replace; unsigned, impostor-signed, and
      unparseable candidates refuse and leave the current binary untouched.
      No passive network calls — --check is the staleness answer. Release
      sums are signed with the provisional rolling key until the ceremony;
      the ceremony release will be dual-signed.
    links:
      - type: satisfies
        target: REQ-UPDATE-001
    fields:
      rationale: >
        The TUF-rotation shape without TUF's re-signing treadmill: the only
        TOFU moment is the first install, established out-of-band via
        cosign + provenance. Reusing the deposit signing key adds no new
        trust exposure — the secret already lives in CI by REQ-DEPOSIT-001's
        design.
    tags: [architecture, security]

  - id: DD-015
    type: design-decision
    title: Bazel consumes varve; registries compile from signed layers as fallback
    status: accepted
    release: v0.12.0
    description: >
      Primary: a module extension bootstraps a sha256-pinned varve and lets
      it verify-and-install the pinned layer into a hermetic repo-local
      root (rules_wasm_component#606). Fallback for consumers without
      varve: export-bazel compiles checksum registries from a verified
      layer, anchoring every hash in the signature chain. Deposits record
      source-asset provenance inside the signed payload to make that
      compilation possible.
    links:
      - type: satisfies
        target: REQ-BAZEL-001
    fields:
      rationale: >
        Neither system reimplements the other: Bazel contributes
        hermeticity, caching and toolchain wiring; varve remains the single
        verifier. The extension can change availability, never acceptance.
        The one TOFU root (the varve binary pin) is transcribed from
        cosign-verified sums and lives in one reviewed file.
    tags: [architecture, integration]

  - id: DD-016
    type: design-decision
    title: Realms bind trust universes to names; isolation is by root fingerprint
    status: accepted
    release: v0.12.0
    description: >
      A committed varve-realms.toml maps realm names to (registry, trust
      root); the pin names the realm; per-realm state lives under
      realms/<trust-root-fingerprint>/. A named realm is authoritative over
      ambient environment. Realmless pins keep the legacy layout.
    links:
      - type: satisfies
        target: REQ-REALM-001
    fields:
      rationale: >
        Namespacing by the trust root's own fingerprint makes cross-realm
        collision impossible by construction rather than by convention, and
        committing realm definitions means trust travels with the code —
        the same reasoning as the pin itself.
    tags: [architecture, security]

  - id: DD-017
    type: design-decision
    title: Wasm entries are portable and execute via signed runner contracts
    status: accepted
    release: v0.12.0
    description: >
      wasm32-platform entries match every host; a runner contract in the
      signed payload (tool from the same layer, prefix args, optional
      per-argument flag) tells dispatch how to execute them. A runnered
      entry without its runner fails closed. First payload: scry via kilnd,
      pending kiln#480.
    links:
      - type: satisfies
        target: REQ-RUNNER-001
    fields:
      rationale: >
        Portability eliminates the per-platform gap class entirely for
        wasm tools; putting the invocation contract inside the signed
        payload keeps "how this tool runs" as tamper-evident as "what this
        tool is"; requiring the runner from the same layer keeps PATH out
        of the dispatch trust path.
    tags: [architecture]

  # ─────────────────────────────────────────────────────────────────────
  # v0.12.0 / v0.13.0 — the hardening plan from the 2026-08-08 audit:
  # bring varve's proof surface to the org bar (relay/witness/rivet/sigil
  # practice), technique by technique.
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-VGATE-001
    type: requirement
    title: The requirement-to-test graph is closed and mechanically audited
    status: verified
    release: v0.12.0
    description: >
      Every requirement shall carry a verification artifact with a
      `verifies` link naming its concrete test functions, and CI shall run
      `rivet check verification-evidence` so a renamed or deleted test goes
      red instead of leaving a requirement silently "verified". Source
      markers remain the per-test map; the graph is what release gates and
      dashboards count.
    tags: [process]
    fields:
      priority: must
      category: non-functional

  - id: REQ-MUTATE-001
    type: requirement
    title: Mutation testing is a reproducible gate, not a session anecdote
    status: verified
    release: v0.12.0
    description: >
      cargo-mutants shall run as a per-PR gate over the trust-critical
      modules (verify, rollback, layer, pin, platform, realm) with zero
      surviving mutants, and nightly over the full workspace (advisory,
      org template). Every "mutation-checked" claim in the docs must be
      reproducible from these runs.
    tags: [process, security]
    fields:
      priority: must
      category: non-functional

  - id: REQ-CLAIM-001
    type: requirement
    title: Load-bearing documentation claims are gated against evidence
    status: verified
    release: v0.12.0
    description: >
      A committed claims file shall bind each load-bearing claim in the
      README/CHANGELOG ("fail-closed", "mutation-checked", "cryptographically
      impossible", "old-verifies-new") to checkable evidence (named tests,
      config files, workflow steps), and CI shall fail when a claim's
      evidence disappears — the witness claim-check discipline.
    tags: [process]
    fields:
      priority: should
      category: non-functional

  - id: REQ-FUZZ-001
    type: requirement
    title: Untrusted-input parsers are fuzzed continuously
    status: verified
    release: v0.13.0
    description: >
      cargo-fuzz targets shall cover the DSSE envelope path, layer-manifest
      JSON, layer-identifier grammar, oci-layout index handling, and
      pin/realms TOML parsing — a PR smoke pass and a nightly campaign,
      following sigil's target list for the shared input classes.
    tags: [security]
    fields:
      priority: must
      category: non-functional

  - id: REQ-PROP-001
    type: requirement
    title: Core invariants hold under property-based and model-checked exploration
    status: verified
    release: v0.13.0
    description: >
      proptest properties shall cover grammar round-trips, rollback verdict
      monotonicity (accept iff counter >= mark), advance-never-lowers, and
      platform-match totality — the laws that must hold across the whole
      input space, not just chosen examples. (Machine-checked Kani proofs of
      the same laws are tracked separately as REQ-KANI-001.)
    tags: [security]
    fields:
      priority: should
      category: non-functional

  - id: REQ-MATRIX-001
    type: requirement
    title: Tests run where releases run
    status: verified
    release: v0.13.0
    description: >
      The CI test matrix shall cover linux and macos (the released
      platforms), pin an MSRV job, and publish coverage evidence
      (cargo-llvm-cov, advisory) — varve releases four platforms and must
      not test only one.
    tags: [process]
    fields:
      priority: must
      category: non-functional

  - id: DD-018
    type: design-decision
    title: Adopt the org verification stack — graph, mutation, claims
    status: accepted
    release: v0.12.0
    description: >
      varve adopts the three org-signature verification disciplines it
      lacked (2026-08-08 audit): relay/witness-style verification artifacts
      with `verifies` links audited by `rivet check verification-evidence`;
      rivet's cargo-mutants two-tier profile (per-PR zero-survivor gate on
      the six trust-critical modules, nightly full-workspace advisory);
      witness-style claim-check binding load-bearing doc claims to
      checkable evidence. Fuzzing/proptest/Kani follow in v0.13.0.
    links:
      - type: satisfies
        target: REQ-VGATE-001
      - type: satisfies
        target: REQ-MUTATE-001
      - type: satisfies
        target: REQ-CLAIM-001
    fields:
      rationale: >
        The audit's decisive finding: varve's REQ-to-test link was prose
        and its "mutation-checked" claims were session anecdotes. The very
        first gated mutation run proved the point — 31 surviving mutants
        in modules claimed mutation-checked, including the entire
        civil-date arithmetic of the staleness check. All killed; the gate
        keeps it that way.
    tags: [process]

  # ═════════════════════════════════════════════════════════════════════
  # The full forward roadmap (planned 2026-08-08 from the two independent
  # audits + backlog). "Plan for all we can do, as independent as possible."
  # v0.13 adversarial inputs · v0.14 assessable graph + independence ·
  # v0.15 durable evidence + ops · v1.0 the qualification gate.
  # ═════════════════════════════════════════════════════════════════════

  # ── v0.14.0 — make the graph assessable, and make verification independent
  - id: REQ-INDEP-001
    type: requirement
    title: No requirement is verified on the author's word alone
    status: verified
    release: v0.14.0
    description: >
      A requirement shall not reach `verified` on the authoring agent's
      assertion. Each release's scope shall undergo an INDEPENDENT clean-room
      verification — a fresh-context reviewer with no inherited framing that
      re-derives every claimed verdict from evidence (runs the named tests,
      re-checks the oracles, attempts to refute) — and the reviewer identity,
      date, and outcome shall be recorded on the artifacts (a `review`-method
      verification linked to each requirement) and surfaced in the release
      notes. At v0.x the recorded verdict is advisory: a missing or dissenting
      review is visible but non-blocking — the auditable trail is the
      deliverable, not a hard gate. The refute-and-block release gate (no
      verdict, no tag) is deferred to v1.0, where it lands with the root
      ceremony and dossier. This directly answers the audits' one structural
      finding — self-assigned `verified` status — by making every verdict
      trace to a named independent reviewer, without falsely claiming the
      gate is enforced before it is.
    tags: [process, independence]
    fields:
      priority: must
      category: non-functional

  - id: REQ-ASPICE-001
    type: requirement
    title: The ASPICE V is populated so its trace rules bite non-vacuously
    status: approved
    release: v0.19.0
    description: >
      The enabled aspice schema's V-types shall carry real artifacts —
      system requirements deriving from the STPA-Sec losses, software
      requirements deriving from them, architecture components over the
      actual module structure, and unit/software verification separated by
      level — so the SWE.1↔SWE.6 / SWE.2↔SWE.5 / SWE.3↔SWE.4 rules measure a
      non-empty set instead of passing 0/0 (the vacuous-gate finding).
    tags: [process]
    fields:
      priority: should
      category: non-functional

  - id: REQ-TARA-001
    type: requirement
    title: The threat analysis is a full TARA, not a seed
    status: approved
    release: v0.19.0
    description: >
      The cybersecurity schema shall be enabled and populated: assets,
      threat-scenarios with attack-vector and attack-feasibility, risk
      assessments with explicit risk-treatment (incl. the accept decisions
      currently implicit in prose), and cybersecurity goals with CALs. The
      STPA-Sec back-half (control structure, sec-UCAs, loss scenarios) shall
      be completed — the overdue v0.1.0 work item — surfacing SH-005/006 as
      first-class analysis, not retrofitted hazards.
    tags: [security]
    fields:
      priority: should
      category: non-functional

  # ── v0.15.0 — durable evidence and operational integrity
  - id: REQ-ARCHIVE-002
    type: requirement
    title: The archive of record is durable, not a 90-day CI artifact
    status: approved
    release: v0.20.0
    description: >
      A deposited layer's oci-layout archive shall be published to durable,
      verifiable storage kept independently of any registry or CI retention
      policy (SL-002: a qualified line must stay reconstructible for the
      safety-case lifetime). The current retention-90-days workflow artifact
      contradicts varve's own loss and must be replaced.
    tags: [core, safety]
    fields:
      priority: must
      category: functional

  - id: REQ-AUDITLOG-001
    type: requirement
    title: Client-side append-only log of installs, verifications, refusals
    status: approved
    release: v0.20.0
    description: >
      varve shall write an append-only local record of update events —
      installs, re-verifications, refusals, staleness warnings, self-updates
      — so the update history is auditable (R156 record-keeping, IEC 62443
      CR 2.8), not merely the resulting state. Tamper-evidence via a hash
      chain is preferred.
    tags: [security]
    fields:
      priority: should
      category: non-functional

  - id: REQ-FIRSTCONTACT-001
    type: requirement
    title: A fresh consumer cannot be handed an arbitrarily old signed layer
    status: approved
    release: v0.20.0
    description: >
      The first-contact rollback window (empty high-water mark accepts any
      counter) shall be closed: a signed per-line floor (carried in the
      line-status document, which already has counters and the right
      distribution channel) shall establish a minimum acceptable counter for
      a consumer with no prior mark, so SH-001 does not depend on the
      consumer having pinned a digest.
    tags: [security]
    links:
      - type: satisfies
        target: SC-001
    fields:
      priority: should
      category: functional

  # ── v1.0.0 — the qualification gate
  - id: REQ-CEREMONY-001
    type: requirement
    title: A real trust-root ceremony replaces the provisional key
    status: approved
    release: v1.0.0
    description: >
      The qualified-channel root shall be generated in a documented ceremony
      with custody, rotation, revocation, and expiry defined (discharging
      SH-005/SC-005); one release shall be dual-signed to migrate the
      old-verifies-new chain without a flag day; and a transparency
      mechanism (e.g. Rekor-logging the DSSE envelopes, or tuf-on-ci) shall
      make key compromise detectable.
    tags: [security]
    links:
      - type: satisfies
        target: SC-005
    fields:
      priority: must
      category: security

  - id: REQ-DOSSIER-001
    type: requirement
    title: The ISO 26262-8 §11 qualification dossier exists
    status: approved
    release: v1.0.0
    description: >
      A tool classification analysis (use cases, malfunction catalogue from
      SH-*, TI/TD determination, TCL statement), a tool qualification plan,
      a safety/user manual with numbered usage constraints, and a validation
      report executed across all released platforms shall be authored — the
      documents the audits found absent behind otherwise-present technical
      substance. varve shall also run its own known-problems line-status for
      its releases (dogfooding REQ-KP-001).
    tags: [qualification]
    fields:
      priority: must
      category: non-functional

  - id: DD-019
    type: design-decision
    title: Independence via adversarial clean-room review, recorded per release
    status: accepted
    release: v0.14.0
    description: >
      Since a second human is not always available, independence is supplied
      by an adversarial clean-room reviewer (a fresh-context agent, no
      inherited framing) that re-derives every claimed verdict from evidence
      and tries to refute it, per release scope. Its verdict — reviewer id,
      date, outcome, evidence — is recorded as a `review`-method verification
      linked to the reviewed requirements and surfaced in the release notes.
      At v0.x the record is advisory (a dissent is visible, not blocking); the
      refute-and-block gate is deferred to v1.0. Recording first, then gating,
      keeps the claim honest at each stage: "independent review is recorded"
      now, "independence is enforced" at v1.0. Automation is the independent
      party the single author cannot be.
    links:
      - type: satisfies
        target: REQ-INDEP-001
    fields:
      rationale: >
        The audits' one finding no gate closes is self-assigned `verified`
        status. The mutation gate already proved automation can be the
        independent party — it killed 33 survivors behind a human's
        "mutation-checked" claim, and blocked its own installing PR until a
        security fix was complete. A clean-room reviewer generalizes that:
        the reviewer inherits none of the author's assumptions, so its
        agreement is evidence, not an echo. Recorded verdicts make the
        independence auditable now; the v1.0 gate will make it non-optional.
        Fork resolved 2026-08-11: recorded/advisory at v0.x over an immediate
        hard gate, so the mechanism ships and proves itself before it blocks.
    tags: [process, independence]

  - id: REQ-KANI-001
    type: requirement
    title: Core trust invariants are machine-checked by bounded model checking
    status: approved
    release: v1.0.0
    description: >
      Kani harnesses shall prove, over the bounded input space, the
      invariants proptest exercises by sampling: the high-water mark never
      decreases across advance, the rollback verdict is Accept iff the
      presented counter is >= the mark, and the layer grammar rejects every
      two-part identifier. Advisory when introduced, a required gate at the
      v1.0 qualification (the scry pattern: proofs advisory pre-1.0).
    tags: [security]
    fields:
      priority: should
      category: non-functional

  - id: REQ-ONBOARD-001
    type: requirement
    title: A cold-start consumer can reach a verified install from the tarball alone
    status: verified
    release: v0.13.1
    description: >
      A new consumer with only a release binary shall be able to get to a
      verified install: the trust root (rolling.pub) and the canonical
      varve-realms.toml ship as release assets and are documented in a README
      Getting-started section; the no-trust-root error names the zero-config
      realm path and where the key is published (not just "set the env var");
      and `varve install` auto-caches a line-status carried in the installed
      layout so `varve status` works with no extra step. Found by an external
      cold-start (pulseengine/varve#34): the error steered to the weaker
      mechanism and the strong one was documented nowhere user-facing.
    tags: [ergonomics]
    links:
      - type: satisfies
        target: REQ-REALM-001
    fields:
      priority: must
      category: non-functional

  - id: REQ-STATUS-DIST-001
    type: requirement
    title: Line-status is distributed with the layer over the registry
    status: verified
    release: v0.14.0
    description: >
      The deposit pipeline shall sign and attach a baseline line-status to
      each layer, and the registry source shall fetch it, so `varve status`
      works for a registry (oci://) install without a local layout — closing
      the second half of pulseengine/varve#34 (v0.13.1 auto-caches only a
      locally-carried layout's status).
    tags: [core]
    links:
      - type: satisfies
        target: REQ-KP-001
      - type: traces-to
        target: DD-020
    fields:
      priority: should
      category: functional

  - id: DD-020
    type: design-decision
    title: The baseline line-status rides beside the layer, never inside its signed payload
    status: accepted
    release: v0.14.0
    description: >
      A layer's signed payload is its immutable identity — the digest a pin
      freezes against. Line-status is updatable evidence with its own
      monotonic counter and its own DSSE envelope. So the baseline distributed
      with a layer is attached as a SEPARATE role-annotated artifact: a
      `line-status` referrer in the oci-layout index (offline path,
      `OciLayoutSource`) and a `eu.pulseengine.varve.role: line-status` layer
      in the registry artifact manifest (`RegistrySource`). It is fetched by a
      new `LayerSource::fetch_line_status`, re-verified against the trust root,
      and cached monotonically at install — the source is never trusted to
      have checked it. Putting the baseline inside the signed payload was
      rejected: it would couple mutable status to immutable identity and change
      the layer digest whenever an advisory changed.
    links:
      - type: satisfies
        target: REQ-STATUS-DIST-001
    fields:
      rationale: >
        The install pipeline already re-verifies every fetched byte against
        the root (DD-003); line-status reuses that seam rather than inventing a
        second trust path. The baseline's counter tracks the deposit counter so
        re-installs cache cleanly and later advisories (higher counters) always
        win.
    tags: [core, security]

  # ─────────────────────────────────────────────────────────────────────
  # v0.15.0+ — varve as a general VERIFIED-ARTIFACT distributor. A tool
  # binary is just bytes with an exec bit; source-shaped artifacts (crates,
  # WIT, Zephyr modules, SDKs, wasm components) are also just bytes. The
  # signed store already distributes any bytes; the work is per-consumer
  # export adapters that wire the VERIFIED store path into each build
  # system's native mechanism. No git server (mutable, unsigned) — the
  # content-addressed, signed, anti-rollback path is the feature.
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-KIND-001
    type: requirement
    title: A layer entry declares its payload kind; verification is unchanged
    status: verified
    release: v0.15.0
    description: >
      Each layer entry shall carry a payload `kind`
      (`tool | crate | wit | zephyr-module | sdk | wasm-component`) in its
      signed annotations, defaulting to `tool` when unstamped (back-compat
      with pre-kind layers, as the platform stamp does). The kind selects
      which export adapter and store layout apply; it shall NOT change how
      bytes are verified — every kind is a signed digest over bytes, checked
      against the trust root exactly as a tool binary is. An UNKNOWN kind is
      refused at the boundaries that act on kind — authoring (`deposit`) and
      each kind-consuming export — so varve never mis-handles a payload it
      does not understand. Install is deliberately kind-AGNOSTIC: it lays down
      the (signed) bytes uniformly without interpreting kind, so an older varve
      still installs the entries it can handle from a layer that also carries a
      future kind (forward-compat). Resolution and `which` filter by kind.
    tags: [core, distribution]
    fields:
      priority: must
      category: functional

  - id: REQ-CRATE-001
    type: requirement
    title: A verified crate builds offline through Cargo with no git server
    status: verified
    release: v0.15.0
    description: >
      varve shall distribute Rust crates as `crate`-kind entries carrying the
      `.crate` tarball, and `varve export-cargo` shall materialise a Cargo
      LOCAL REGISTRY (the `.crate` files plus an index) from the verified
      store and emit a `.cargo/config.toml` source-replacement
      (`[source.crates-io] replace-with`), so a consumer builds fully offline
      (`--offline`) against crates whose bytes varve signed. The out-of-band
      trust anchor is varve's existing DSSE over the layer manifest (a
      `.crate` is signed like any blob); Cargo's own checksum-vs-`Cargo.lock`
      is the second integrity check. `[patch]` is explicitly NOT used — it
      changes the dependency graph; source replacement is transparent.
    tags: [core, distribution]
    links:
      - type: traces-to
        target: REQ-KIND-001
    fields:
      priority: must
      category: functional

  - id: REQ-RELVER-001
    type: requirement
    title: A released binary reports the version it is tagged as
    status: verified
    release: v0.15.0
    description: >
      The release pipeline shall refuse to build unless the git tag matches
      the workspace `Cargo.toml` version. v0.14.0 shipped binaries reporting
      0.13.1 because the version bump was a manual step that was missed; a
      released artifact that lies about its own version is exactly the failure
      varve exists to prevent. The guard makes the agreement mechanical: tag
      != version → the release fails before any binary is built.
    tags: [release, integrity]
    fields:
      priority: must
      category: non-functional

  - id: REQ-CORROSION-001
    type: requirement
    title: A varve-exported crate builds under Corrosion (CMake -> Cargo)
    status: verified
    release: v0.16.0
    description: >
      The Cargo local-registry export (REQ-CRATE-001) shall build offline under
      Corrosion with NO new export: since Corrosion 0.3.0 the cargo invocation
      runs from the manifest directory specifically so `.cargo/config.toml` in
      the source tree is discovered, so varve's source-replacement is honoured.
      This shall be proven by a real Corrosion/CMake build against an exported
      registry (built with `FROZEN` / `CARGO_NET_OFFLINE=true`), not asserted.
      This is the Zephyr-Rust path; a Zephyr spike is a follow-up.
    tags: [distribution]
    links:
      - type: traces-to
        target: REQ-CRATE-001
    fields:
      priority: should
      category: functional

  - id: REQ-VENDOR-001
    type: requirement
    title: A verified crate is exported as a cargo-vendor tree, consumed offline by Cargo and Corrosion
    status: verified
    release: v0.16.0
    description: >
      varve shall add `export-crates-vendor`, emitting a `cargo vendor`-shaped
      directory (unpacked crate trees + a `.cargo-checksum.json` whose `package`
      field is the sha256 of the `.crate` — the digest varve already signs —
      with `files: {}`) plus the `[source.vendored-sources]` config. This tree
      shall build fully offline under bare Cargo AND under Corrosion (CMake ->
      Cargo, the Zephyr-Rust path), proven by real builds. NOTE (Bazel spike,
      2026-08-12): rules_rust's `crate.from_cargo` splice requires a registry
      INDEX, and fails ("Failed to get crate index config") against a vendored
      directory source — so the vendor tree ALONE is not consumable by
      rules_rust. Full rules_rust support needs varve to also emit
      crates_vendor-style BUILD files; that is REQ-VENDOR-002 (v0.17.0). This
      requirement is scoped to what the spike PROVED: Cargo + Corrosion.
    tags: [distribution]
    links:
      - type: traces-to
        target: REQ-KIND-001
    fields:
      priority: should
      category: functional

  - id: REQ-VENDOR-002
    type: requirement
    title: varve emits the verified Bazel distdir that is rules_rust's offline byte source
    status: verified
    release: v0.17.0
    description: >
      Two spikes established the recipe. v0.16.0: `crate.from_cargo` fails on a
      bare vendored directory ("Failed to get crate index config"). v0.17.0:
      `crates_vendor(mode=local)` also fails offline reading the crates.io
      SPARSE-INDEX cache — so the vendored source is never sufficient; the
      crate INDEX metadata is needed independently. The working air-gap path is
      Bazel's `--distdir`: crate_universe generates `http_archive(url,sha256)`
      per crate, and `--distdir=<dir>` resolves each from a local file whose
      sha256 matches, with NO network and NO URL rewrite. Because varve's signed
      `.crate` digest IS the crate_universe pin (== the crates.io checksum),
      varve emits a distdir of its verified `.crate` tarballs and a consumer that
      pre-generates its crate_universe output once (so no build-time repin/index
      lookup) builds fully offline with `bazel build --distdir=<varve distdir>`.
      varve emits the bytes (`export-bazel-distdir`); the join key is the sha256.
      A `from_specs` MODULE.bazel snippet is a secondary, SCORE-aligned interop
      path (but networked, like the org's own repos). varve does NOT reimplement
      crate_universe's BUILD-file generation; it relocates the byte source to
      its verified store while preserving the exact pins.

      VERIFICATION SCOPE (honest): the distdir artifact — the verified `.crate`
      bytes with sha256 == the crate_universe pin — is UNIT-verified, and a real
      `crate_universe` build consuming a varve distdir via `--distdir` was
      MANUALLY confirmed to succeed (2026-08-12). An AIRTIGHT automated
      zero-network oracle proved impractical and is NOT claimed: Bazel's action
      cache makes "toolchain-present-but-crate-absent" hard to force locally,
      and `crate_universe`'s repin reads the crates.io sparse index over its OWN
      HTTP (not Bazel's downloader, so `--downloader_config block *` doesn't stop
      it) — so the offline property rests on Bazel's documented `--distdir`
      behavior plus the unit-proven byte/sha256 correctness, not a varve-run
      network-isolated build. An automated gated CI proof (Linux `unshare -n` +
      a pre-generated crate_universe output) is a tracked follow-up.
    tags: [distribution]
    links:
      - type: traces-to
        target: REQ-VENDOR-001
    fields:
      priority: should
      category: functional

  - id: REQ-UPDATE-002
    type: requirement
    title: Self-update converges on artifact identity, not self-reported version
    status: verified
    release: v0.15.1
    description: >
      `varve self-update` (and `--check`) shall decide whether an update is
      needed by comparing the VERIFIED latest binary's bytes against what is
      already on disk, not by self-reported version strings alone. A binary
      that mis-reports its own version (as v0.14.0 did — reporting 0.13.1) must
      NOT loop forever: version-string comparison stays "newer" and every run
      re-installs identical bytes (varve#38). Deciding on digest identity makes
      a stale version string degrade to a no-op. `--check` fetches and verifies
      the candidate (needing the trust root) so it reports a genuinely-verified
      update, not a phantom one.
    tags: [core, integrity]
    links:
      - type: traces-to
        target: REQ-UPDATE-001
    fields:
      priority: must
      category: functional

  # ─────────────────────────────────────────────────────────────────────
  # Research-driven (2026-08-12 competitive sweep, see the campaign memory;
  # framing corrected 2026-08-13). Offline verification against a pinned
  # root is necessary but NOT a differentiator — Zarf embeds a Sigstore
  # trusted root, Iron Bank runs cosign with the transparency log ignored,
  # Guix ships authenticated channels, criticalup compiles its root into
  # the binary. varve's defensible ground is what those do not do:
  # per-line client-enforced anti-rollback, qualification evidence carried
  # as data, and heterogeneous artifact kinds (tools/crates/WIT/Zephyr/
  # SDK/wasm) behind one verifier — for regulated domains where a live
  # transparency log is unavailable (the space warg vacated when it
  # archived for OCI+cosign+Rekor). These three close the gaps that sweep
  # surfaced.
  # ─────────────────────────────────────────────────────────────────────

  - id: REQ-BRIDGE-001
    type: requirement
    title: Export adapters preserve upstream provenance, they do not clobber it
    status: verified
    release: v0.16.0
    description: >
      When varve re-distributes an artifact, its export adapters shall PRESERVE
      the artifact's own upstream integrity anchor rather than discard it. For a
      `.crate`, that anchor is the tarball sha256 — which is BOTH the crates.io
      registry cksum AND the digest varve signs — so the vendored tree's
      `.cargo-checksum.json` `package` field carries it forward unchanged: a
      consumer verifies both varve's pinned-root signature and Cargo's own
      checksum against the same value. SCOPE (v0.16.0): this is proven for the
      `.crate` sha256 anchor. Richer upstream provenance is carried when
      present; verifying those fuller chains is future work, tracked with the
      referrer-carried attestations of REQ-ATTEST-001. Status of the sources
      (checked 2026-08-13): BCR in-toto attestation bundles exist today but
      their attestation URLs assume github.com is reachable — carrying them
      across the mirror boundary is exactly varve's job. crates.io signing has
      NOT landed: RFC 3724 is still open with no accepted design, TUF TAP-16
      (a Version-0 draft untouched since 2021) has been abandoned for it, and
      the 2026 crates.io scope narrowed to verifiable mirroring; the accepted
      multi-repository bridging primitive to study is TAP-4, not TAP-16.
    tags: [distribution, integrity]
    links:
      - type: traces-to
        target: REQ-CRATE-001
    fields:
      priority: should
      category: functional

  - id: REQ-INDEXAUTH-001
    type: requirement
    title: The realm authenticates the line index, not only each artifact
    status: approved
    release: v0.26.0
    description: >
      varve signs individual layer manifests and realms, but the LISTING of
      which layers exist for a line (the index a consumer enumerates) must
      itself be authenticated by the realm's trust root — otherwise a
      compromised registry/index host could hide or omit a layer (a freshness
      /availability attack) even though each artifact it does serve verifies.
      Guix authenticates its index git-history via signed commits; varve shall
      have the equivalent: the per-line index is signed, and the anti-rollback
      high-water mark holds even if the index host is compromised (the Uptane
      insight — rollback protection must survive a Director/registry
      compromise, not just artifact tampering).
    tags: [core, security]
    links:
      - type: traces-to
        target: REQ-ROLLBACK-001
    fields:
      priority: must
      category: non-functional

  - id: REQ-ATTEST-001
    type: requirement
    title: An attestation is bound to its layer and its bytes, without being re-attested
    status: verified
    release: v0.22.0
    description: >
      SCOPE NOTE, written after clean-room review caught the earlier text
      claiming more than shipped: this requirement covers BINDING only. The
      transport half — carrying attestations as OCI referrer artifacts and
      having `varve verify` report them — is REQ-ATTEST-002, targeted at
      v0.23.0. The original text asserted both and was marked verified with
      half of it unimplemented, which is precisely the defect varve's
      claim-check discipline exists to prevent.
      A layer's bytes are authentic and current; varve's signature and counter
      say so. They say nothing about whether the code was reviewed, how it was
      built, or what it contains. Others produce those claims — cargo-vet /
      cargo-crev audits, SLSA in-toto provenance, CycloneDX SBOMs, VEX, and
      vendor attestations (AdaCore has shipped DSSE-signed in-toto provenance
      since wave 26.1).
      varve shall NOT re-attest any of it. Re-signing another party's judgement
      under this root would launder it into ours, and an assessor reading the
      chain could no longer tell who asserted what. varve shall instead sign a
      STATEMENT ABOUT the attestation — this digest, of this kind, from this
      producer, accompanies this layer — and carry the bytes verbatim, so a
      consumer verifies two separable things: varve's vouching for the
      association and the bytes' integrity, offline against the pinned root;
      and, with the producer's own key, whatever the producer claimed. That
      split is what lets a disconnected site check a vendor attestation whose
      issuer it cannot reach — the case AdaCore's own online signature service
      does not serve.
      Fail-closed rules, each of which shall hold: an unknown attestation kind
      is refused, never guessed; bytes that do not hash to the signed digest
      are not the attested bytes; a statement naming ANOTHER layer is refused
      as evidence about this one (the confused-deputy case); a statement whose
      own two identities — layer name and layer digest — disagree is refused,
      the same rule `resolve` applies to pins; the statement carries its own
      DSSE payload type so a signed layer manifest or line-status cannot pose
      as one; and the checking command shall RE-VERIFY THE LAYER, not merely
      the statement, since the installed layer's name and digest are local
      labels until its retained envelope is re-checked.
    tags: [distribution, traceability, security]
    fields:
      priority: must
      category: functional

  - id: REQ-ATTEST-002
    type: requirement
    title: A layer transports its attestations as OCI referrers, and verify reports them
    status: approved
    release: v0.26.0
    description: >
      The transport half split out of REQ-ATTEST-001 when review found that
      requirement marked verified while this half was unimplemented. Binding
      shipped in v0.22.0 (`sign-attestation` / `check-attestation`); what has
      NOT shipped is carriage: attestations attached to a deposit layout and an
      OCI registry as referrer artifacts, travelling with the layer through
      `archive` and an offline install, and `varve verify` reporting which
      attestations a layer carries and whether each still binds.
      This is the half that closes the mirror-boundary gap the research
      identified: registries do publish this evidence, and mirroring tools drop
      it — bandersnatch and Verdaccio carry no attestations, and every BCR
      attestation URL points at github.com — so an air-gapped consumer receives
      bytes without the evidence about them. Reuse the line-status referrer
      machinery (REQ-STATUS-DIST-001) rather than inventing a second shape.
    tags: [distribution, traceability]
    fields:
      priority: should
      category: functional

  - id: DD-021
    type: design-decision
    title: varve signs a statement ABOUT an attestation, never a restatement OF it
    status: accepted
    release: v0.22.0
    description: >
      When varve carries someone else's attestation, it could re-sign the
      content under its own root — making one signature the consumer checks.
      It deliberately does not. Re-signing another party's judgement collapses
      two different assertions into one: an assessor reading the chain could no
      longer tell whether varve merely transported a cargo-vet audit or endorsed
      its conclusion, and varve has no basis for the latter. It would also make
      varve's root a laundering point — the strongest reason a regulated
      consumer would refuse to pin it.
      So the signed object is a STATEMENT ABOUT the bytes: {layer,
      layer_manifest_digest, kind, digest, producer}. varve asserts association
      and integrity, which it can actually check; `producer` is copied verbatim
      and never interpreted. The carried document is untouched, so the
      producer's own signature over it still verifies with the producer's key.
      Consequence, accepted knowingly: a consumer must perform TWO
      verifications, and varve's `check-attestation` says so in its output
      rather than implying one verdict covers both. The alternative — one
      signature, ambiguous meaning — is worse for exactly the assessors varve
      is built for.
    links:
      - type: satisfies
        target: REQ-ATTEST-001
    fields:
      rationale: >
        One signature with an ambiguous meaning is worse than two signatures
        with clear ones. Collapsing "varve transported this" and "the producer
        asserts this" into a single varve signature would leave an assessor
        unable to tell which varve actually vouched for, and would make varve's
        root a laundering point for third-party judgements it cannot check —
        the strongest reason a regulated consumer would refuse to pin it. The
        cost, two verification steps for the consumer, is paid once and is
        stated in the tool's own output.

  - id: REQ-TRACEPACK-001
    type: requirement
    title: A release carries its rivet traceability as queryable, assessor-importable evidence
    status: verified
    release: v0.17.0
    description: >
      A varve release already ships the supply-chain layer (signed sums, SLSA
      provenance, SBOM, trust root, realms). It shall ALSO carry its safety-case
      traceability as first-class release assets, so a consumer or assessor can
      query it directly from the release — offline, with no repo checkout:
        - a ReqIF export (`rivet export --format reqif`), the OMG interchange
          format assessor tools (DOORS/Polarion/…) import directly;
        - a browsable HTML report (`rivet export --format html --offline`) —
          artifacts, coverage matrix, trace graph;
        - the rivet source artifacts themselves, so `rivet trace-results`,
          `rivet coverage`, and `rivet docs --grep --format json` run against
          the packed evidence.
      The traceability assets shall be covered by the same signed
      `SHA256SUMS.txt` as the binaries (the cosign signature transitively
      covers them), so the safety case is as tamper-evident as the code. This
      makes rivet's embedded, queryable-docs model the release's own: the
      release IS a queryable safety case. Composes with REQ-ATTEST-001 and the
      Eclipse-SCORE release-manifest shape.
    tags: [release, traceability]
    links:
      - type: traces-to
        target: REQ-CLAIM-001
    fields:
      priority: should
      category: functional

  - id: REQ-DOCS-001
    type: requirement
    title: Documentation is embedded, queryable, and a checked invariant
    status: verified
    release: v0.17.1
    description: >
      varve shall ship its own documentation EMBEDDED in the binary (no files,
      no network — works air-gapped) and queryable, modelled on `rivet docs`:
      `varve docs` lists topics, `varve docs <topic>` shows one, `--grep`
      searches, `--format json` is machine-readable. Crucially, coverage is a
      MECHANICAL INVARIANT, not review discipline: `varve docs check --coverage`
      enumerates the CLI's top-level subcommands and reports any one lacking a
      documented topic; `--strict` exits non-zero (a CI gate like review-check /
      claim-check), so a new subcommand cannot ship undocumented. Topics cover
      every CLI subcommand plus the core concepts (pins, realms, layers, trust
      roots, payload kinds, air-gap). Documentation-as-invariant is the same
      "mechanical, not prose" spine as the rest of varve.
    tags: [docs, ergonomics]
    fields:
      priority: should
      category: functional

  - id: REQ-EXPORT-SYNC-001
    type: requirement
    title: Exports are pinned to their producing layer; verify fails loud on drift
    status: verified
    release: v0.18.0
    description: >
      The export adapters (export-cargo, export-crates-vendor,
      export-bazel-distdir) materialise offline byte sources from a verified
      layer. A consumer commits that vendored directory and builds against it —
      but when the project's pin later moves to a new layer, the committed
      export silently keeps serving the OLD crates, and toolchain-vs-source-set
      diverge with nothing said. That is exactly the "stale silently" failure
      varve exists to make loud, applied to exported artifacts instead of the
      toolchain binaries. varve shall close it three ways: (1) the export
      commands DEFAULT `--layer` to the resolved project pin (like install /
      verify), so re-exporting after a bump naturally produces the new layer's
      crates; (2) every export writes a `.varve-export.json` stamp into its
      output directory recording {layer, manifest_digest, kind}, binding those
      bytes to the layer that produced them (manifest_digest is the sha256 of
      the DSSE-signed layer manifest — the same join key everything else uses);
      (3) `varve verify --export <DIR>` (repeatable) re-derives the current
      pin's manifest digest and HARD-FAILS (non-zero exit) when a stamped
      export's manifest_digest diverges from it — a mechanical CI gate, not a
      warning. An absent stamp in a named export dir is itself a failure (an
      unstamped or hand-assembled tree is not a verified export); a malformed
      stamp is a failure. Verify without --export is unchanged (backward
      compatible). This makes an out-of-sync export impossible to miss: the same
      command that proves the pinned layer intact also proves the exports still
      belong to it.
    tags: [distribution]
    fields:
      priority: should
      category: functional

  - id: REQ-CRATENAME-001
    type: requirement
    title: An unrepresentable crate name fails closed, never panics or corrupts the index
    status: verified
    release: v0.18.1
    description: >
      `index_path` matched on `chars().count()` and then sliced BYTES, so any
      non-ASCII crate name panicked mid-codepoint — a client CRASH on the
      offline-vendoring path, in a tool whose contract is to fail closed with an
      error that carries its fix. Reproduced for `café-utils`, `日本語`, `ααα`.
      Separately, `index_line` interpolates the name and version into the index
      JSON with no escaping, so a name containing a quote or backslash would
      emit a corrupt registry line. Both stem from trusting an unvalidated,
      depositor-controlled annotation. varve shall (a) refuse a crate name or
      version outside Cargo's own alphabet (name: ASCII alphanumeric, `-`, `_`;
      version: alphanumeric, `.`, `-`, `+`) at EVERY export adapter, before any
      bytes are written, and (b) keep `index_path` total by construction —
      character-based slicing — so a layout helper can never crash a client even
      if called directly. Fail closed, with the reason named.
    tags: [distribution, security]
    fields:
      priority: must
      category: functional

  - id: REQ-SHIM-002
    type: requirement
    title: The shim is varve itself, not a shell script
    status: verified
    release: v0.19.0
    description: >
      `varve shim install` wrote a `/bin/sh` script per tool
      (`exec "<varve>" run -- <tool> "$@"`). Three defects follow. (1) TRUST: an
      unverified shell interpreter sits on the dispatch path of every tool
      invocation, in a tool whose premise is a short verified path from pin to
      binary — and the shell is the one component varve neither signs nor
      checks. (2) INJECTION: the tool name was interpolated UNQUOTED, and the
      varve path was interpolated inside sh double quotes where `"`, `$` and
      backticks remain live; a name or install path carrying a shell
      metacharacter breaks or injects. (3) COST: the extra process costs ~2.4 ms
      per dispatch (measured), on the interactive hot path of every compiler
      invocation, and the design is Unix-only.
      varve shall instead dispatch on `argv[0]`, the rustup pattern: a shim is a
      symlink to the varve binary (a copy on Windows), and varve invoked under
      any name other than its own resolves the pin and execs that tool. This
      deletes the shell, removes the injection class BY CONSTRUCTION (no string
      ever reaches a parser), halves the process spawns, and makes Windows a
      copy rather than a special case, and arguments pass through as raw bytes
      (a unix argument is an arbitrary byte string; rewriting one lossily would
      corrupt data silently). Two consequences shall be documented rather than
      implied: the binary must be named `varve` to offer the CLI, and a Windows
      shim is a copy, so it does not follow `self-update` until reinstalled.
      The name derived from `argv[0]` is caller-controlled, so it shall be
      validated (no path separators, no `..`, non-empty) and may only ever
      select among tools the pinned layer already exposes — fail closed, as
      everywhere else.
    tags: [core, security, ergonomics]
    fields:
      priority: must
      category: functional

  - id: REQ-PERF-001
    type: requirement
    title: Dispatch cost is measured and budgeted, not folklore
    status: verified
    release: v0.19.0
    description: >
      varve had no benchmarks at all, while shim dispatch — the only genuinely
      hot path it has, on every `cargo`/`rivet`/`synth` invocation — was
      unmeasured. Measurement (2026-08-13, release build) found ~6.4 ms of varve
      overhead per dispatch, of which ~2.4 ms was a `/bin/sh` process that
      REQ-SHIM-002 removes outright, and a resolve cost that grows LINEARLY with
      installed layers for a NAME-ONLY pin (3.8 ms at 3 layers, 8.6 ms at 201)
      because `Store::list` parses every installed `layer.json` to recover its
      identity. A pin carrying `digest` is already O(1) (`Store::get` reads one
      entry), and layers coexist by design (REQ-COEXIST-001), so the linear case
      is the one a long-lived machine lands in.
      varve shall carry a criterion benchmark for resolve/dispatch so this cost
      is a tracked number rather than folklore, and shall DOCUMENT the
      complexity honestly: digest-pinned resolve is constant-time, name-only
      resolve is linear in installed layers. Making the name-only path constant
      needs a store-side identity index with its own invalidation and trust
      questions; it is deliberately NOT claimed here, and is tracked separately.
      The trust property this protects: a verified dispatch path must not be so
      slow that users are tempted to bypass it — and its cost must be visible
      before it regresses, not after a user complains.
    tags: [core, ergonomics]
    fields:
      priority: should
      category: performance

  - id: REQ-PIN-002
    type: requirement
    title: A pinned tool name is a name, never a path out of the layer
    status: verified
    release: v0.19.0
    description: >
      A pin may restrict itself to a subset of the layer's tools
      (`tools = ["rivet"]`). That name is joined onto the verified layer's
      `bin/` directory — and `Path::join` with an ABSOLUTE path REPLACES the
      base, while `..` walks out of it. So `tools = ["/usr/bin/id"]` resolved
      and ran a binary from outside the verified layer, directly contradicting
      the guarantee varve documents and sells: "varve never falls back to
      another layer or to binaries on PATH — a pin resolves exactly or the
      command fails." Found by clean-room review of v0.19.0 (pre-existing, not
      introduced by the shim change, and not reachable through a shim because an
      argv[0]-derived name cannot contain a separator). varve shall refuse, at
      pin-parse time, any tool name that is not a plain name — empty, `.`, `..`,
      or containing `/`, `\`, or NUL — with an error naming the offending entry.
      Fail closed at the boundary, rather than trusting a checked-in file.
    tags: [core, security]
    fields:
      priority: must
      category: functional

  - id: REQ-PROOF-001
    type: requirement
    title: Trust obligations are discharged by certificate, and the gate proves it can go red
    status: verified
    release: v0.20.0
    description: >
      varve's anti-rollback decisions were checked only by example tests and by
      proptest SAMPLING a bounded range. That gap is not theoretical: on
      2026-08-08 cargo-mutants left three survivors in `epoch_days`, all
      "replace || with && " in the Gregorian leap predicate — an arm proptest
      never generated. varve shall carry SMT obligations, discharged by ordeal
      (the certificate-checked QF_BV solver varve itself distributes), so the
      statements hold over the whole input space rather than over samples. An
      `unsat` from ordeal is returned only after its checker has validated an
      LRAT certificate, so the artifact is evidence a third party can re-check,
      not an exit code.
      Crucially, every proof file declares the verdict it expects, and the suite
      MUST contain negative controls — the same obligation against a
      deliberately wrong predicate, which must still be refutable. A suite in
      which everything is expected-unsat cannot distinguish "proved" from "the
      solver stopped deciding anything"; `tools/proof-check.py` fails if no
      negative control is present. A gate nobody has watched go red is not a
      gate.
      Where a solver finds a model, that model is a test case: the leap
      obligation returned y = 8192, which is now the `8192-02-29` regression
      test that kills the surviving mutants.
    tags: [core, security, traceability]
    fields:
      priority: should
      category: functional

  - id: REQ-MUTATE-002
    type: requirement
    title: The mutation gate covers the trust decisions, not a subset of them
    status: verified
    release: v0.20.0
    description: >
      The required mutation gate covered six files (177 mutants) while the
      modules holding the actual trust decisions were EXCLUDED: `resolve.rs`
      (the no-fallback law), `install.rs` (verify -> digest -> lay-down),
      `selfverify.rs` (the self-update trust anchor), `reverify.rs` (`varve
      verify` itself) and `exportstamp.rs`. A mutant deleting a digest check in
      any of them merged green. varve shall include them in the required gate.
      Adding them immediately paid: two survivors were found and killed, the
      same defect in both — a `NotFound` match guard that could be replaced with
      `true`, collapsing "this file cannot be read" into "this file is absent".
      In `reverify.rs` that meant a permissions fault on a retained envelope
      would be reported as "no retained envelope"; in `exportstamp.rs` it told
      the user to re-run an export that was not the problem. A verification tool
      must name the fault it actually hit.
    tags: [core, security]
    fields:
      priority: should
      category: functional

  - id: REQ-SBOM-001
    type: requirement
    title: The SBOM is a transcription of the signed manifest, not a scan
    status: verified
    release: v0.21.0
    description: >
      varve carried no SBOM at all, while holding — inside the DSSE-signed layer
      manifest — precisely the data an SBOM answers with: every component's
      name, version, sha256 digest, payload kind and upstream source
      provenance. varve shall emit a CycloneDX 1.6 document for a VERIFIED
      layer, transcribed from that signed manifest rather than scanned from a
      filesystem or a lockfile. The distinction is the point: a scanner reports
      what it believes it found and can miss a component or invent one, while a
      transcription is exactly as trustworthy as the layer — a question
      `varve verify` already decides. An SBOM for a layer that cannot be
      verified is worse than none, because it looks authoritative; the command
      shall therefore fail closed, as the export adapters do.
      The document shall be DETERMINISTIC — components ordered by digest, a
      serial number derived from the manifest digest, and the layer's own
      issued-at rather than the wall clock — so re-emitting a layer is
      byte-identical and any diff means the layer changed. It shall BIND ITSELF
      to what it describes by recording the manifest digest, channel and
      anti-rollback counter in its metadata, so a document can be checked
      against the artifact it claims to cover. Per-platform entries shall carry
      their platform, since a layer holds one distinct binary per platform and
      they would otherwise read as duplicates.
      Regulatory context, not the justification: EU CRA Article 13(5) requires
      due diligence over third-party components, Article 14 reporting bites
      2026-09-11 with a 24-hour clock that presumes you can say which
      components are in a shipped product, and Annex I Part II(1) requires an
      SBOM in a commonly used machine-readable format covering at least
      top-level dependencies.
    tags: [distribution, traceability, security]
    fields:
      priority: must
      category: functional

  - id: REQ-COMPOSE-001
    type: requirement
    title: A layer may compose another layer, so one pin can span two trust universes
    status: verified
    release: v0.23.0
    description: >
      Raised by a consumer (varve#52, relay). A pin names exactly ONE realm and
      ONE layer, so a project cannot draw on two trust universes at once. relay
      needs the PulseEngine tools that CHECK its work (rivet, meld, synth,
      witness) and the upstream BytecodeAlliance tools that BUILD it
      (wasm-tools, cargo-component, wkg, wac) — and today the question "which
      layer produced this artifact" is answerable for the checkers and not for
      the producers. Two defects reached a downstream consumer through exactly
      that unpinned half.
      Putting upstream tools in the same layer would place unqualified releases
      we do not control under a qualification claim that covers tools we do —
      the consumer flagged this and is right. varve shall therefore let a layer
      COMPOSE another: a signed manifest entry of payload kind `layer` whose
      digest is the included layer's manifest digest and whose annotations name
      its realm. The pin stays singular; resolution walks the graph; each layer
      keeps its own realm, trust root, cadence and qualification claim; and
      because the include lives in the signed payload, the composition itself
      is signed.
      Rules, all fail-closed, and holding on BOTH walkers — resolution and
      verification. (Re-verification found verify recursing unbounded and
      stack-overflowing on a self-referencing store entry, which is not what
      "refused" means, least of all in the command whose job is to inspect
      adversarial store state.) An included layer is verified against ITS OWN
      realm's trust root, not the including layer's; a cycle — a layer
      reappearing on its own path — is refused, while a DIAMOND, where two
      layers share a base, is walked once and is legal; depth is bounded at 8;
      and a tool name exposed by more than one
      layer in the graph is an ERROR naming both layers, never a silent choice
      — varve does not pick a winner, exactly as a pin that does not resolve
      uniquely is an error rather than a fallback.
      SCOPE, and what an earlier version of this text got wrong. It claimed
      "EXPRESSES, RESOLVES and VERIFIES" while only resolution existed: deposit
      could not emit an include, install REJECTED one, and verify checked only
      the root layer — so an entirely UNSIGNED included layer dispatched its
      tools while `varve verify` exited 0. Clean-room review found all three.
      They are now built: `deposit` emits includes from `[[include]]` tables in
      a spec file (the flags deliberately do not grow a way to say it), install
      skips layer-kind entries rather than treating them as blobs, and `verify`
      walks the composition, verifying each included layer against its own
      realm's trust root and recursing.
      Still deliberately OUT: transitively FETCHING an included layer that is
      not installed. Resolution and verification both fail naming the missing
      layer and its corrective `varve install`, which is the behaviour a missing
      pinned layer already has.
    tags: [core, distribution]
    fields:
      priority: must
      category: functional

  - id: REQ-LOCKPIN-001
    type: requirement
    title: A pinned crate that is compiled into an artifact is checkable, not merely shippable
    status: verified
    release: v0.23.0
    description: >
      Also from varve#52. varve pins what it DISPATCHES, but a code-generating
      dependency reaches the artifact as a Cargo dependency compiled INTO it —
      `wit-bindgen-rt` is baked into every component relay publishes, and
      supplies `cabi_realloc`, the symbol whose absence shipped a raw core
      module to a downstream consumer. There is no binary to shim, so `varve
      which` has nothing to point at, and the consumer reported running THREE
      versions of one generator at once (0.41.0 in published components, 0.60.0
      at the workspace root, 0.58.0 in our fork) with nothing recording which
      produced a given artifact.
      varve already carries the crate payload kind, so it can DISTRIBUTE such a
      dependency; what is missing is AGREEMENT. varve shall check a project's
      resolved lockfile against the pinned layer's `crate` entries: `varve
      verify --lockfile <FILE>` shall fail when a package the layer pins
      resolves to a different version in the lockfile, or resolves to the same
      version with a different checksum. Packages the layer does not pin are
      not varve's business and are ignored — the layer does not claim to cover
      every dependency, and pretending otherwise would make the check noise.
      THE BOUNDARY, deliberate and to be documented: varve cannot intercept a
      Cargo build and cannot guarantee the compiler used the bytes it pins.
      Provenance for a compiled-in dependency is by ASSERTED AGREEMENT — the
      lockfile and the layer must say the same thing, mechanically, or CI goes
      red — not by dispatch. A consumer is entitled to know that boundary is
      chosen rather than overlooked.
    tags: [distribution, core]
    fields:
      priority: should
      category: functional

  - id: REQ-KEYGEN-001
    type: requirement
    title: varve can mint a signing key and print its public half
    status: verified
    release: v0.24.0
    description: >
      A ten-persona documentation audit (2026-08-14) found the extender path is
      not merely undocumented but CLOSED: nothing in varve emits the public half
      of a signing key, so the 64-hex `trust-root` that varve-realms.toml
      demands is unobtainable. One persona held a working key, signed a layer
      with it, and tried six derivations plus offline DSSE-PAE verification
      across six message encodings; none matched. Four of the five blocked
      personas were blocked by exactly this. Verbatim: "everything needed to run
      a second realm exists in the code except the one function that prints a
      public key."
      Compounding it, the `--key` help text is ACTIVELY WRONG — it says
      "hex-encoded ed25519 root SECRET key" while the tool requires 128 hex
      characters (a 32-byte seed followed by its 32-byte public key) and refuses
      a 32-byte secret. The resulting error, "manifest signature verification
      failed: invalid signing key: Ed25519 signature function error", is wrong
      on all three counts: nothing was verified (the key failed to LOAD), the
      tail is a leaked library string, and it carries no fix.
      varve shall provide `varve keygen`, writing a signing key and its public
      half, and `varve pubkey <keyfile>` printing the public half of an existing
      key in exactly the form `trust-root` accepts. The key error shall name the
      length it got, the length it needs, and the command that mints one. A new
      `signing-keys` topic shall document the format and the key's lifecycle.
      This is the gate on an organisation running its own realm at all, and
      therefore on splitting layer maintenance into per-realm repositories.
    tags: [core, security, ergonomics]
    fields:
      priority: must
      category: functional

  - id: REQ-PRODUCER-001
    type: requirement
    title: The produce side fails closed, like the consume side already does
    status: verified
    release: v0.24.0
    description: >
      The same audit found what it called the deepest inversion in the tool: the
      consumer half is strict while the producer half validates nothing, so
      varve emits permanently-broken signed artifacts and reports success. Each
      of these exited 0 (verified 2026-08-14):
      64 bytes of random entropy accepted as a signing key, producing a layer no
      trust root on earth can verify; `--channel stable` signed into the
      manifest, making the layer un-nameable by any pin, which only accepts
      `qualified` or `rolling`; `--issued-at 2026-10-01` (a flag documented
      `<RFC3339>`) signed verbatim, yielding an invalid CycloneDX
      `metadata.timestamp` in a CRA-facing artifact and uncorrectable after
      signing; `--out oci://ghcr.io/acme/layers` reporting "deposited ... at
      oci://..." while writing a local directory literally named
      `./oci:/ghcr.io/acme/layers`; and `attach-status` binding a line 2099.01
      status to a 2026.08 layout, for the consumer to discover.
      For a project whose thesis is "fail closed, never a fallback", signing an
      artifact that can never be verified and printing OK is the inversion that
      matters most. varve shall validate producer input BEFORE signing: the
      channel against the same enum the pin parser accepts, the issued-at as RFC
      3339, the signing key as a well-formed keypair whose public half matches
      its seed, a registry-shaped `--out` refused with the command that would
      actually publish, and a status document's line against the layout it is
      attached to. `deposit` shall additionally verify the envelope it just
      wrote before returning 0 — the cheapest possible guard against emitting an
      unverifiable release artifact.
    tags: [core, security]
    fields:
      priority: must
      category: functional

  - id: REQ-STORE-001
    type: requirement
    title: Every command finds the layer the project's realm actually installed
    status: verified
    release: v0.24.0
    description: >
      `crates/varve/src/main.rs` builds its store from the top-level core
      (`Store::at(store_root()?)`) while the project path builds it from the
      realm partition (`Store::at(realm.effective_root(base.root()))`). Realms
      partition the core by trust-root fingerprint, so that single divergence
      makes realm-installed layers invisible to every command that takes the
      first path. Three personas reported it as three unrelated bugs:
      `varve list` printing "no layers installed" with exit 0 immediately after
      a successful realm install, contradicted a second later by verify, which,
      run and sbom — and it is the path the README calls the recommended
      zero-config one; `--layer` failing on `export-*` and `sbom` for a
      realm-pinned project with either "no trust root configured" (when it is
      configured) or "layer X is not installed" (when it is), which is the
      README's headline example; and a cross-realm composition reporting an
      installed include as missing, whose corrective advice then hits the
      per-line rollback guard and locks the user out with no documented
      recovery — two errors forming a loop with no exit.
      varve shall resolve the store through the project's realm wherever a
      command operates on the project's layers, so that a layer which `which`
      resolves is a layer `list`, `--layer` and composition can all see.
    tags: [core]
    fields:
      priority: must
      category: functional

  - id: REQ-CHANNEL-001
    type: requirement
    title: The pin's channel is enforced at resolution, not only at install
    status: verified
    release: v0.24.0
    description: >
      Found by the ten-persona audit re-run, independently by two personas, and
      it is the most serious defect the audit has produced. `install` refuses a
      fetched manifest whose channel disagrees with the pin, but NOTHING
      re-checked an already-installed layer. So editing a pin from `rolling` to
      `qualified` — or installing under one pin and later tightening it — left
      `which`, `verify` and `run` resolving the rolling layer and reporting
      success. `varve which` printed "(rolling)" directly beside a pin that said
      qualified, exit 0.
      Qualified-versus-rolling is THE distinction varve exists to make: a
      qualified line carries a support window and qualification evidence, a
      rolling one carries neither and may move. A safety-critical consumer
      pinning `qualified` silently received an unqualified toolchain while
      `verify` reported OK — destroying exactly the evidence the product exists
      to preserve, and directly contradicting what the docs promise ("varve
      never falls back … a pin resolves exactly or the command fails").
      varve shall compare the installed layer's channel against the pin's at
      RESOLUTION, refusing a mismatch with an error naming both channels and
      what each means. A layer with no channel annotation (pre-channel layers)
      is not refused on this ground.
    tags: [core, security]
    fields:
      priority: must
      category: functional

  - id: REQ-DEPLOY-001
    type: requirement
    title: The publish step is documented, and deposit stops claiming to do it
    status: verified
    release: v0.24.0
    description: >
      Two personas — both producer-side — could not finish because NOTHING
      publishes. `deposit --help` said "Assemble, sign and publish a layer"; it
      writes a local OCI layout directory and stops. No push/publish/upload
      command exists, and `docs --grep push|oras|deploy` returned nothing, while
      every realm definition REQUIRES a `registry`. The gap was a false claim
      plus a missing page, not missing code: varve deliberately runs no server
      and pushes nothing (README, "No server of our own"), and registry.rs says
      publishing is `oras push`, which "never joins the client trust path".
      varve shall stop claiming to publish, and shall document the actual
      sequence — the one varve's own release pipeline runs — together with what
      a consumer needs (registry reference + trust root), how they bootstrap
      trust the first time, and the air-gapped alternative where no registry
      exists at all.
    tags: [ergonomics, distribution]
    fields:
      priority: should
      category: functional

  - id: REQ-PRODUCE-002
    type: requirement
    title: Three produce-side paths that failed open
    status: verified
    release: v0.24.0
    description: >
      Three further defects the audit re-run surfaced, each a case where varve
      reported success over a state that could not work.
      (1) `attach-status` accepted a LOWER counter and silently downgraded a
      layout's baseline — the one place monotonicity was not enforced, while
      `status --from-file` and `install` both refuse it. A re-run CI step could
      ship a layout whose fresh consumers cache a pre-yank document and are told
      "not yanked" about a YANKED layer.
      (2) `install` exited 0 on a composition whose includes are not installed,
      so `run` then executed a tool from an unverified layer; and the error the
      user eventually hit named `varve install`, which takes no layer or digest,
      making the advice a no-op loop. install shall refuse, naming every missing
      include and its realm, and shall say how to install each.
      (3) `export-cargo` and `export-crates-vendor` embedded `--out` VERBATIM in
      the `.cargo/config.toml` they generate. That file is meant to be copied
      into a project, so a relative `--out` produced a config resolving against
      the wrong directory and a build that fails — while the tool printed
      instructions saying it would work, and the README calls this path "proven
      end to end". Export directories shall be absolute in generated config.
    tags: [core, distribution]
    fields:
      priority: should
      category: functional
