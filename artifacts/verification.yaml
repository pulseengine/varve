  - id: VER-REVIEW-v0.25.0
    type: verification
    title: v0.25.0 independently reviewed — DISSENT, including a fabricated trust root
    status: verified
    release: v0.25.0
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        Independent clean-room review (fresh context, refute-framed),
        2026-08-14, at HEAD d99529c. VERDICT DISSENT — the eighth consecutive
        review to dissent and the eighth to be right. 9 of 15 shall-clauses
        unsupported. All findings accepted; all fixed.
        FINDING A, the worst, and the reason this review paid for itself:
        `concept-getting-started.md` taught
        `trust-root = "83a6991d…"` LABELLED as "the published rolling.pub", in
        the topic whose first line reads "Every file here is literal — copy
        it". The real published root is 4e771dc6…. A user who copied it got
        "manifest signature verification failed … No valid signatures". The
        same fabricated value appeared under `[realm.pulseengine]` in
        config-reference and realms, alongside the REAL registry URL. Its
        origin: 83a699 is the prefix of the LAYER DIGEST, misused as a key.
        The compounding failure is the important part. An earlier gate had
        caught the elided `trust-root = "83a699…"` as "not 64 hex", and the
        remedy was to PAD THE PLACEHOLDER until the parser accepted it — a
