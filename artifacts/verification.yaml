  - id: VER-REVIEW-v0.25.0
    type: verification
    title: v0.25.0 independently reviewed — DISSENT, including a fabricated trust root
    status: verified
    release: v0.25.0
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        Independent clean-room review (fresh context, refute-framed),
        2026-08-14, at HEAD d99529c. VERDICT DISSENT — the eighth consecutive
        review to dissent and the eighth to be right. 9 of 15 shall-clauses
        unsupported. All findings accepted; all fixed.
        FINDING A, the worst, and the reason this review paid for itself:
        `concept-getting-started.md` taught
        `trust-root = "83a6991d…"` LABELLED as "the published rolling.pub", in
        the topic whose first line reads "Every file here is literal — copy
        it". The real published root is 4e771dc6…. A user who copied it got
        "manifest signature verification failed … No valid signatures". The
        same fabricated value appeared under `[realm.pulseengine]` in
        config-reference and realms, alongside the REAL registry URL. Its
        origin: 83a699 is the prefix of the LAYER DIGEST, misused as a key.
        The compounding failure is the important part. An earlier gate had
        caught the elided `trust-root = "83a699…"` as "not 64 hex", and the
        remedy was to PAD THE PLACEHOLDER until the parser accepted it — a
        shape check certifying a false fact. A published key is a fact, so it
        is now compared against trust-roots/rolling.pub, the file the release
        ships. The full getting-started transcript was then run from the
        topic's literal files against the real registry: install, verify (9
        tools), which, list — all green.
        FINDING 0: all four requirements were `status: verified` with NO
        verification artifact — graph orphans — while `rivet check
        verification-evidence` printed 195 named steps green, vacuously,
        because none belonged to them. This is the identified failure mode in a
        STRONGER form than the four prior releases: previously the cited tests
        tested the wrong function; here nothing was cited at all. VER-DOCS-002,
        -003, -004 and VER-LAYOUT-001 now exist.
        GATE WEAKNESSES, each proven by mutation and each now closed: an EMPTY
        fence satisfied "carries a worked example" (four topics stubbed to a
        title plus ```sh with nothing in it, gate exit 0); `composition` and
        `threat-model` had no content assertion anywhere; the parse gate
        reached 12 of 35 blocks and skipped a varve.toml missing
        `manifest-version` because it keyed on the very field under test; all
        19 shell blocks were unchecked, so `varve frobnicate --nonexistent-flag`
        passed; and both gate functions could be neutered to `return
        Vec::new()` with the whole suite green — the vacuous-gate shape, since
        both tests only ever asserted emptiness.
        DOC DEFECTS: the deploy push sequence fails on a `null` status digest
        because `deposit` attaches no line-status and `attach-status` was an
        unstated prerequisite; README's `varve archive 2026.07 core.tar` was
        wrong on both arguments (a line, not a layer; a tar, not a directory);
        a `sha256 = "…"` elision survived in a copy-pasteable block; CHANGELOG
        was twelve releases stale.
        CONFIRMED by the reviewer against the running binary: REQ-LAYOUT-001's
        "purely additive" claim (byte-identical blob trees and layer digests,
        every index.json reader keys on other fields); the recovery topic's
        three factual claims, reproduced character-for-character; the own-realm
        and composition transcripts end to end; the environment precedence
        rules; the known-problems schema; the arg-prefix dispatch order. No
        regressions found.
        SCOPE STATED, NOT CLOSED: no CI job runs a real OCI client, so
        REQ-LAYOUT-001's "resolves in any OCI client" rests on the annotation
        being the standard one. The reviewer also flagged that the DSSE
        envelope is a sibling index entry rather than referenced from the
        tagged manifest, so a tag-scoped `oras cp` may drop the signature.
        Both are issue #62 — not claimed as verified here.
      steps:
        - run: cargo test -p varve --bin varve a_topic_showing_the_published_realm_shows_the_published_key
        - run: cargo test -p varve --bin varve the_gate_detects_a_broken_topic_set_not_merely_a_healthy_one
        - run: cargo test -p varve --bin varve every_documented_command_is_a_real_command
        - run: cargo test -p varve --bin varve every_documented_file_example_parses_with_the_real_parser
        - run: cargo test -p varve --bin varve the_two_flagship_topics_teach_their_feature_not_just_its_name
    links:
      - type: verifies
        target: REQ-DOCS-002
      - type: verifies
        target: REQ-DOCS-003
      - type: verifies
        target: REQ-DOCS-004
      - type: verifies
