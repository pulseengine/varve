  - id: VER-REVIEW-v0.23.0
    type: verification
    title: v0.23.0 independently reviewed — DISSENT (feature unreachable), fixed forward, re-verified
    status: verified
    release: v0.23.0
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        Independent clean-room review (fresh context, refute-framed), 2026-08-14,
        of REQ-COMPOSE-001 and REQ-LOCKPIN-001 at HEAD 0db9f84. VERDICT DISSENT
        — the sixth consecutive review to dissent and the sixth to be right, and
        the most serious to date. The requirement claimed composition was
        EXPRESSED, RESOLVED and VERIFIED; only resolution existed. `deposit`
        could not emit an include, `install` REJECTED one (every entry required
        eu.pulseengine.tool, so a real composed layer could not be installed at
        all — every shipped test bypassed install via store.lay_down), and
        `verify` checked only the root, so an entirely UNSIGNED included layer
        dispatched its tools while verify exited 0. The realm clause — "verified
        against ITS OWN realm's trust root" — was parsed into an error string
        and otherwise unimplemented. This was the SECOND consecutive release
        marking a requirement `verified` with a shall-clause unbuilt.
        Three further defects: cycle detection used a global seen-set, so a
        DIAMOND (two layers sharing a base — the most ordinary composition
        shape) was refused with a message falsely claiming the layer "includes
        itself"; the lockfile gate mapped EVERY collect_verified_crates error to
        "pins no crates", and since that function does not platform-filter, one
        foreign-platform crate entry silently disabled the gate over a real
        disagreement; and the CLI test named
        `verify_lockfile_fails_when_a_pinned_crate_disagrees` contained no
        disagreement and asserted .success() twice, including that a MALFORMED
        lockfile passes.
        FIXED FORWARD rather than narrowed a third time (user decision). All six
        were then RE-VERIFIED independently and empirically at HEAD a6f42c0: a
        deposited include appears inside the DSSE-signed payload; install
        accepts a composed layer and lays no blob for the include; verify fails
        on an unsigned include and passes on a properly signed one; the realm
        case was constructed BOTH directions (signed by the named realm's key
        passes; re-signed by a third key fails; a missing varve-realms.toml
        names the realm); diamond walks, real cycle refused, chain of 9 refused;
        and the lockfile gate now fails closed on the foreign-platform case that
        previously went green.
        That re-verification found ONE NEW defect, introduced by the fix:
        `verify_composition` recursed with no cycle or depth guard, so
        `varve verify --all` STACK-OVERFLOWED (SIGABRT) on a self-referencing
        store entry — "followed until the process aborts" is not "refused",
        least of all in the command whose job is to inspect adversarial store
        state. Both walkers are now bounded, with a regression test.
    links:
      - type: verifies
        target: REQ-COMPOSE-001
      - type: verifies
        target: REQ-LOCKPIN-001

  - id: VER-KEYGEN-001
    type: verification
    title: An organisation can mint a key, and stand up its own realm with it
    status: verified
    release: v0.24.0
    fields:
      method: automated-test
      baseline: >
        Exercised end to end 2026-08-14: `varve keygen --out acme.key --pub
        acme.pub` printed a realm skeleton carrying the trust-root inline;
        `varve pubkey acme.key` re-printed the identical 64 hex characters;
        a layer deposited under that key installed and VERIFIED against a realm
        pinning it. The key format was confirmed empirically rather than assumed
        — 64-byte secret (128 hex) = 32-byte seed followed by its 32-byte
        public half, and the public half IS secret[32..].
      steps:
        # The route that did not exist: key -> the value trust-root accepts.
        - run: cargo test -p varve-core a_minted_key_yields_the_public_half_a_realm_pins
        # The property that makes keygen more than formatting: a minted key
        # signs a layer that its printed public half verifies.
        - run: cargo test -p varve-core a_minted_key_actually_signs_and_verifies_end_to_end
        - run: cargo test -p varve-core the_wrong_length_says_what_it_wanted
        - run: cargo test -p varve-core non_hex_is_its_own_error_not_a_length_complaint
        # The whole extender path at the CLI, which four of five blocked
        # personas could not complete.
        - run: cargo test -p varve --test cli an_organisation_can_stand_up_its_own_realm
    links:
      - type: verifies
        target: REQ-KEYGEN-001

