  - id: VER-INDEXAUTH-001
    type: verification
    title: The realm's signed line index — a source that hides a layer is caught
    status: verified
    release: v0.26.0
    tags: [security]
    fields:
      method: test
      baseline: >
        Five numbered clauses, each with a test that fails on its own mutation.
        Ten mutations were applied, run and reverted. Two of the tests were
        WRONG when first written and the mutants proved it: the cross-document
        replay test passed because the two structs' deny_unknown_fields shapes
        diverge, so it proved schema divergence while claiming to prove the
        payload-type check; and the counter-regression test called
        refuse_regression DIRECTLY, so deleting that call from `check` — the
        function install goes through — left the suite green. Both are fixed
        and both now fail on their mutant.
        CLAUSE 4 WAS CORRECTED, not merely implemented. It read "the
        anti-rollback high-water mark shall be advanceable from the verified
        index". An integration test through `install` refuted it on the first
        run: raising the ENFORCEMENT mark to the line's newest counter makes a
        deliberately-pinned older layer uninstallable the moment the realm
        publishes a newer one — breaking frozen toolchains, varve's entire
        purpose, to defend against an attack varve's pin-based model does not
        have. Uptane's freshness attack presumes a client that wants the
        latest; a varve consumer names an exact layer. The clause is now
        REPORTING, and `advance_to` was deleted rather than left as dead
        trust-critical code.
        THIS RECORD WAS ITSELF FALSE WHEN FIRST WRITTEN, and an independent
        review caught it. Every step below was a varve-core test calling
        `install()` with a policy the PRODUCT NEVER CONSTRUCTED: the CLI's only
        `InstallPolicy` hardcoded `index: None`, and `fetch_line_index` /
        `served_layers` were implemented by exactly one type — `MemorySource`,
        the in-memory test double. `RegistrySource`, `OciLayoutSource` and
        `DirSource` all inherited the trait defaults returning `Ok(None)`, and
        `realm.signed_index` was parsed and never read. Five clauses were
        marked verified while unreachable from the shipped binary. That is the
        same shape as the two mutant-refuted tests above, one level up:
        evidence that exercises a different entry point than the clause runs
        through. The fix wires the policy from the resolved realm, implements
        both source methods on the registry and the layout, gives clause 2 a
        cache to compare against (it was passed `None`, so the rule could not
        fire on any real machine), and reports the index at install. The steps
        now include tests that DRIVE THE EXECUTABLE, because no test that
        constructs an `InstallPolicy` itself can detect that nothing else does.
        Ten further mutations were applied, run and reverted for this fix; one
        survived and exposed a weak test — the clause-2 install test compared
        error messages, which the cache's own write-time guard produces
        identically AFTER laying the layer down, so it now counts blob fetches
        and asserts the refusal precedes them.
      steps:
        - run: cargo test -p varve-core an_index_verifies_only_against_the_realm_that_signed_it
        - run: cargo test -p varve-core a_signed_line_status_cannot_be_replayed_as_an_index
        - run: cargo test -p varve-core a_source_that_hides_a_layer_the_index_names_is_refused
        - run: cargo test -p varve-core check_refuses_a_stale_index_not_only_refuse_regression_does
        - run: cargo test -p varve-core a_realm_that_promised_an_index_does_not_fall_back_to_an_unsigned_listing
        - run: cargo test -p varve-core a_source_that_cannot_enumerate_is_not_treated_as_hiding_everything
        - run: cargo test -p varve-core a_realm_declares_whether_it_publishes_a_signed_index
        # Through install(), not through the helpers.
        - run: cargo test -p varve-core install_refuses_a_source_that_hides_an_indexed_layer
        - run: cargo test -p varve-core install_raises_the_mark_from_the_index_even_when_the_layer_is_hidden
        - run: cargo test -p varve-core a_replayed_older_index_is_refused_on_the_next_install_not_only_in_theory
        # Through the REAL SOURCES, not the in-memory double: an HTTP registry
        # double serving the index under its own tag and answering /tags/list,
        # and an oci-layout carrying it as a referrer.
        - run: cargo test -p varve-core --test registry_double a_registry_serves_its_realms_signed_index_and_the_consumer_learns_the_line
        - run: cargo test -p varve-core --test registry_double a_registry_that_hides_an_indexed_layer_is_refused_over_the_wire
        - run: cargo test -p varve-core --test registry_double a_registry_cannot_switch_the_check_off_by_answering_404_for_the_index
        - run: cargo test -p varve-core --test registry_double the_index_tag_is_not_reported_as_a_layer_of_the_line
        - run: cargo test -p varve-core an_index_attached_to_a_layout_is_what_an_offline_install_reads_back
        - run: cargo test -p varve-core a_producer_cannot_downgrade_or_misfile_a_published_index
        - run: cargo test -p varve-core the_cache_is_what_gives_clause_two_something_to_compare_against
        - run: cargo test -p varve-core a_registrys_listing_for_a_line_is_that_lines_layers_and_nothing_else
        # THROUGH THE BINARY. These are the decisive ones: they are what the
        # whole-requirement-unreachable defect could not survive.
        - run: cargo test -p varve --test cli the_binary_verifies_the_realms_index_and_reports_what_the_line_holds
        - run: cargo test -p varve --test cli the_binary_refuses_a_declaring_realm_whose_index_is_absent
        - run: cargo test -p varve --test cli a_realm_that_never_promised_an_index_installs_exactly_as_before
    links:
      - type: verifies
        target: REQ-INDEXAUTH-001

  - id: VER-SHADOW-001
    type: verification
    title: varve notices when PATH runs a different binary than the one it pins
    status: verified
    release: v0.26.0
    tags: [ergonomics, security]
    fields:
      method: test
      baseline: >
        Reported from use (varve#66) and reproduced: `varve which rivet`
        printed the store path while the shell ran a different binary, and
        `verify` called the layer perfect — which it was. Every individual
        answer correct, the composite false, against the README's own words for
        the command.
        The first implementation reported EVERY tool on a correctly configured
        machine as shadowed, and its unit test passed: a varve shim is a
        symlink to the VARVE BINARY (argv[0] dispatch since v0.19.0), not to
        the pinned tool, and the test had symlinked to the STORE — testing a
        mechanism varve does not use. Only the end-to-end run caught it.
        `check` now takes the dispatcher path and the test asserts both that a
        real shim agrees AND that omitting the dispatcher reproduces the bug.
        Flagging the correct configuration is worse than not checking, because
        it teaches people to ignore the check.
        The check then found a REAL shadowing on the development machine — a
        cargo-installed ~/.cargo/bin/synth over the fixture's pinned synth —
        which turned three unrelated CLI tests red there and green elsewhere.
        Every command builder in cli.rs now sets a hermetic PATH: a suite whose
        result depends on what the person running it happens to have installed
        is not a suite.
        Four PATH configurations were checked end to end against the release
        binary: shims first (pass), no shims (pass), foreign binary before the
        shims (fail), foreign binary after the shims (pass).
      steps:
        - run: cargo test -p varve-core a_different_binary_earlier_on_path_is_reported_as_shadowing
        - run: cargo test -p varve-core a_real_shim_symlinked_to_varve_itself_agrees
        - run: cargo test -p varve-core a_tool_absent_from_path_is_not_shadowed
        - run: cargo test -p varve-core resolution_follows_path_order_and_the_executable_bit
        - run: cargo test -p varve-core a_name_with_a_separator_is_not_a_path_lookup
        - run: cargo test -p varve --test cli verify_fails_when_path_runs_a_different_binary_than_the_pin
    links:
      - type: verifies
        target: REQ-SHADOW-001

  - id: VER-ATTEST-002
    type: verification
    title: Attestations travel with the layer — layout, store, archive, offline install, registry
    status: verified
    release: v0.26.0
    tags: [supply-chain]
    fields:
      method: test
      baseline: >
        Carriage, proven by a real round trip on the release binary: deposit ->
        attach -> install -> verify -> archive -> install into a BRAND NEW core,
        offline -> verify, with the carried bytes byte-identical to what was
        signed. That last check is not decoration: varve carries another
        party's judgement verbatim and never restates it (DD-021), so a
        round trip that altered the bytes would defeat the purpose.
        Two security defects were found while wiring, both in code written
        earlier in the same release. `read_all` used an index-supplied digest
        as a PATH COMPONENT, so a layout naming `sha256:../../..` escaped the
        layout directory. `persist` named files from the digest the SOURCE
        declared rather than from the bytes, so a hostile source could name a
        file inside the layer root, where layer.json and the retained envelope
        live. Both are refused now, and removing either guard fails a named
        test.
        The registry clause landed last and was the one that mattered most: an
        `oci://` install carried NOTHING, so varve's most-used transport was
        reproducing the exact mirror-boundary loss the requirement exists to
        close. Statements pair with their bytes by the
        `eu.pulseengine.varve.attests` annotation rather than by position, and
        the test serves TWO attestations precisely so a first-match reader
        (the line-status shape) cannot pass it.
        Deliberate and stated: reporting, not refusal. A layer whose own
        signature and digests are good is a good layer, and failing an install
        on a third party's stale audit would make varve's verdict depend on
        someone else's release cadence. An unverified statement's own claims
        are never echoed as fact.
        `cargo mutants` under the CI gate's `--workspace --lib` config:
        install.rs 12 caught / 0 missed; attestcarry.rs 32 caught / 0 missed,
        after two rounds of strengthening — the first found a surviving `&&` in
        the traversal guard, the second found `attach`'s retain predicate
        surviving because counting alone cannot see the index accumulating a
        stale entry per CI re-run.
      steps:
        - run: cargo test -p varve-core an_attestation_travels_with_the_layer_and_still_binds
        - run: cargo test -p varve-core a_statement_whose_evidence_did_not_travel_is_an_error_not_a_skip
        - run: cargo test -p varve-core many_attestations_travel_together_and_reattaching_is_idempotent
        - run: cargo test -p varve-core evidence_survives_the_store_and_can_be_re_emitted
        - run: cargo test -p varve-core a_layout_naming_a_blob_outside_itself_is_refused_before_anything_is_read
        - run: cargo test -p varve-core persist_names_files_after_the_bytes_not_after_what_the_source_declared
        - run: cargo test -p varve-core an_attestation_survives_archive_and_an_offline_install_into_a_fresh_core
        # The registry clause, through the real HTTP double.
        - run: cargo test -p varve-core --test registry_double an_oci_install_carries_the_attestations_the_registry_publishes
        - run: cargo test -p varve --test cli an_attestation_travels_through_deposit_archive_and_an_offline_install
    links:
      - type: verifies
        target: REQ-ATTEST-002

  - id: VER-BOOTSTRAP-001
    type: verification
    title: There is a documented, verified way to obtain varve itself
    status: verified
    release: v0.26.0
    tags: [distribution, ergonomics]
    fields:
      method: test
      baseline: >
        Reported from use: the README's Getting started jumped straight to
        `varve install` with no step 0, there was no install script, and no
        crates.io publish workflow — so `cargo install varve` did not work
        either. A tool for verified toolchain distribution had no documented
        verified path to itself.
        install.sh was run against the REAL v0.25.0 release and installed a
        binary reporting 0.25.0. The negative control is the load-bearing part:
        with sha256sum and shasum shimmed to return a wrong digest it exits 1
        with "The bytes you received are not the bytes this release published"
        and creates nothing — a verifier that cannot fail is not a verifier.
        Refusal to run as root, refusal when no sha256 tool exists, and the
        unsupported-platform path were each exercised the same way.
        Clause 8 — state what the first hop CANNOT prove — shipped as prose
        with no mechanical check, which is the exact shape that let requirement
        text outrun code four releases running, and the honest-limits section
        is the most deletable part of a page whose other job is making
        installation easy. It is gated now: deleting it fails a named test.
        Scope stated rather than implied: install.sh entering SHA256SUMS.txt is
        verified by workflow ORDERING only (staged before the checksum step)
        and becomes true at the first v0.26.0 tag; `cargo package -p varve`
        cannot fully succeed until varve-core is actually published; and no
        Linux binary was executed — the triple mapping was proven with a faked
        `uname`. The release workflow's verify-install-script job closes the
        last of these on the first tag.
      steps:
        - run: cargo test -p varve --bin varve the_bootstrap_topic_states_what_the_first_hop_cannot_prove
        - run: cargo test -p varve --bin varve topics_a_user_must_act_on_show_a_worked_example
        - run: cargo test -p varve --bin varve every_documented_command_is_a_real_command
        - run: cargo test -p varve --bin varve every_cli_subcommand_has_a_documented_topic
    links:
      - type: verifies
        target: REQ-BOOTSTRAP-001

  - id: VER-STORE-002
    type: verification
    title: A layer holds many payloads, including several versions of one name
    status: verified
    release: v0.26.0
    tags: [core, distribution]
    fields:
      method: test
      baseline: >
        varve#69, raised from use: a layer could not hold two versions of one
        crate. `deposit` dedupped on (name, platform), ignoring version and
        kind, so varve could not express its OWN dependency graph as a layer —
        252 packages in its Cargo.lock, 14 names at more than one version,
        getrandom at three — and `export-cargo` could never satisfy a real
        lockfile.
        The second half was the dangerous one. `Store::lay_down` wrote every
        payload to `bin/<name>`, so relaxing the deposit check ALONE would have
        turned a clean error into a SILENT OVERWRITE: the wrong bytes under the
        wrong name, and verification then failing on the OTHER entry with
        nothing explaining why. Identity now follows dispatchability — `tool`
        keeps `bin/<name>` and (name, platform) because it is dispatched by
        name and must resolve uniquely; everything else lands at
        `payloads/<name>/<version>` under (name, version, platform).
        Proven end to end on the release binary rather than asserted: a layer
        holding serde 1.0.200, serde 1.0.210 and a tool deposits, installs,
        verifies, archives, re-installs into a fresh core offline, and exports
        a Cargo registry whose index lists BOTH versions with cksums equal to
        the sha256 of the tarballs actually on disk — each version exporting
        its own bytes, not whichever landed last.
        Two defects were found and fixed that the clauses did not name. A
        signed manifest naming `../../evil` could previously escape the layer
        via `bin.join(name)`; path components are now validated. And
        `lockpin::disagreements` compared every pinned entry against every
        locked package of the same NAME, so the moment a multi-version layer
        existed `verify --lockfile` would have reported 1.0.200 vs 1.0.210 as
        drift and gone red on every real lockfile — a false failure the fix
        itself would have introduced.
        Deliberate behaviour change, stated: crate/wit/sdk payloads no longer
        appear in `bin/`, so `varve which <crate>` no longer resolves them.
        They used to, accidentally; dispatching a `.crate` tarball was never
        meaningful. Backward compatible for existing installs — `entry_path`
        falls back to `bin/<name>`, unambiguous because the old check made a
        second version impossible, and a pre-change core was reconstructed and
        verified, exported and archived unchanged.
        18 hand-applied mutations, all killed, including M1 (every payload back
        to bin/<name> — the original bug) and M7 (held payloads keyed on
        (name, platform) again — varve#69 restored). `cargo mutants` over the
        CI-gated files changed: install.rs and reverify.rs, 28 mutants, 25
        caught, 3 unviable, 0 missed; store.rs 0 missed.
      steps:
        - run: cargo test -p varve-core two_versions_of_one_name_are_two_files_neither_overwriting_the_other
        - run: cargo test -p varve-core two_payloads_claiming_one_path_are_refused_before_anything_is_written
        - run: cargo test -p varve-core a_name_or_version_that_escapes_the_layer_is_refused
        - run: cargo test -p varve-core a_layer_installed_before_this_change_still_resolves_its_crate
        - run: cargo test -p varve-core only_a_tool_is_dispatched_by_name
        - run: cargo test -p varve-core two_versions_of_one_crate_are_a_layer_not_a_duplicate
        - run: cargo test -p varve-core a_tool_may_not_appear_twice_under_one_name_however_its_versions_differ
        - run: cargo test -p varve-core the_signed_digest_does_not_depend_on_the_order_versions_are_listed_in
        - run: cargo test -p varve-core each_version_of_one_name_is_checked_against_its_own_signed_digest
        - run: cargo test -p varve-core a_registry_exported_from_a_layer_offers_every_version_it_pins
        - run: cargo test -p varve-core a_layer_pinning_two_versions_of_one_crate_agrees_with_a_lockfile_holding_both
        - run: cargo test -p varve --test cli a_layer_holding_two_versions_of_one_crate_deposits_installs_verifies_and_exports_both
        - run: cargo test -p varve --test cli two_versions_of_one_tool_are_still_refused_and_the_error_names_both
    links:
      - type: verifies
        target: REQ-STORE-002

  - id: VER-VSIX-001
    type: verification
    title: A VS Code extension is a pinned, verified, non-executable payload `code` installs
    status: verified
    release: v0.26.0
    tags: [distribution, ergonomics]
    fields:
      method: test
      baseline: >
        varve#68: a reproducible environment pins its compiler, its linker and
        its test runner, then installs editor extensions from a marketplace
        with no verification at all. A `.vsix` is one zip file, so it needed no
        tree-shaped store (varve#67) and could ship in this release.
        Clauses 2 and 4 required NO new code. REQ-STORE-002 (06069af) had
        already made identity and layout follow `PayloadKind::is_dispatchable`,
        so adding one non-dispatchable variant gave a `.vsix`
        `payloads/<name>/<version>` at mode 0644 and a (name, version) identity
        for free. That was verified by running, not assumed: mutating
        `is_dispatchable` to include Vsix and mutating store.rs's mode to a
        constant 0o755 each turned the end-to-end CLI test red.
        Implemented: `PayloadKind::Vsix` (`kind = "vsix"`, parsed, round-tripped
        through the SIGNED annotation, not dispatchable); the `export-vsix`
        adapter, which names each file `publisher.name-version.vsix` — the
        marketplace convention, and `code --install-extension` dispatches on the
        `.vsix` suffix, treating anything else as a marketplace id to FETCH;
        the shared `.varve-export.json` stamp, so `varve verify --export`
        catches the pin moving on without the export; and the `export-vsix`
        docs topic, added to TOPICS_NEEDING_EXAMPLES so its worked example is
        gated rather than trusted.
        Fail-closed properties the clauses did not name, all from the
        REQ-STORE-002 lesson: every destination is resolved BEFORE any bytes are
        written, so an unexportable id leaves the directory untouched rather
        than half-populated; two entries that would share a file name are a
        Collision error, not a last-writer-wins overwrite; an id containing `/`
        (a signed name is attributable, not benign) or starting with `-` (which
        `code` would parse as a flag) is refused; and a layer carrying no `vsix`
        entries fails rather than producing an empty directory a consumer would
        install from and believe complete.
        Proven end to end on the RELEASE binary: a layer holding two extensions,
        one of them at two versions, plus a tool — deposited, installed,
        verified (4 payloads against their own signed digests), and exported.
        Store listing showed `bin/synth` at 0755 and
        `payloads/rust-lang.rust-analyzer/{0.3.2260,0.3.2300}` plus
        `payloads/vadimcn.vscode-lldb/1.11.4` at 0644; the export directory
        showed three `.vsix` files at 0644 with the stamp; `verify --export`
        read fresh; `varve which rust-lang.rust-analyzer` was refused while
        `varve which synth` resolved.
        13 hand-applied mutations, all killed — including is_dispatchable
        returning true for Vsix, the signed wire string changing to
        `vsix-package`, store.rs handing every payload 0o755, the `.vsix`
        suffix being dropped from the exported name, the export setting 0o755,
        validation moving from the plan to the write loop, the stamp not being
        written, and the topic shipping with empty fences.
      steps:
        - run: cargo test -p varve-core only_a_tool_is_dispatched_by_name
        - run: cargo test -p varve-core every_kind_round_trips_through_its_wire_string
        - run: cargo test -p varve-core the_kind_list_the_other_tests_iterate_holds_every_variant
        - run: cargo test -p varve-core extensions_deposit_as_vsix_entries_at_several_versions
        - run: cargo test -p varve-core the_file_name_is_the_one_code_and_a_human_both_read
        - run: cargo test -p varve-core an_id_that_could_escape_or_look_like_a_flag_is_refused
        - run: cargo test -p varve-core nothing_is_written_when_one_entry_is_unexportable
        - run: cargo test -p varve-core two_entries_that_would_share_a_file_are_refused_not_overwritten
        - run: cargo test -p varve-core every_extension_lands_with_its_own_bytes_and_no_execute_bit
        - run: cargo test -p varve-core a_tool_keeps_bin_and_a_held_payload_never_borrows_it
        - run: cargo test -p varve --test cli vsix_extensions_deposit_install_verify_and_export_for_code
        - run: cargo test -p varve --test cli export_vsix_refuses_a_layer_with_no_extensions_rather_than_writing_an_empty_directory
        - run: cargo run -p varve -- docs check --coverage --strict
    links:
      - type: verifies
        target: REQ-VSIX-001
