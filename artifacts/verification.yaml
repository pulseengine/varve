  - id: VER-REVIEW-v0.20.0
    type: verification
    title: v0.20.0 independently reviewed (retroactive) — DISSENT on a tautological proof
    status: verified
    release: v0.20.0
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        Retroactive independent clean-room review, 2026-08-13. VERDICT DISSENT,
        and it was right twice — both times against claims varve itself made.
        REQ-MUTATE-002 CONFIRMED outright: the five trust-decision modules are
        in the gate, and the reviewer re-ran cargo-mutants over reverify.rs +
        exportstamp.rs to get 15 caught / 2 unviable / 0 missed, confirming the
        two NotFound-guard tests genuinely kill their mutants. The proof gate's
        MECHANICS were confirmed by experiment: removing both negative controls
        makes proof-check exit 1 ("no negative control"), so that requirement is
        real and not decorative.
        DISSENT 1 — TAUTOLOGY. `rollback-verdict-total.smt2` asserted
        `c >= h AND c < h`, a bare contradiction that is unsat whatever
        rollback.rs does. No mutation of `check` could make it sat, and it had
        no negative-control twin. It was theatre inflating the obligation count
        — precisely the hollow-gate failure this suite exists to prevent.
        REPLACED with `rollback-boundary-mutant-is-distinguishable.smt2`, which
        asks where `<` and `<=` disagree; it returns c == h, the re-install
        case, and `an_equal_counter_reinstalls_cleanly` is exactly that test.
        DISSENT 2 — UNSUPPORTED PROVENANCE. The leap proof's comment claimed
        three 2026-08-08 cargo-mutants survivors were `||`->`&&` in the leap
        predicate at rollback.rs:136. The reviewer checked git history: the leap
        predicate has never been at line 136 (it is at 145), and the commit
        introducing it also introduced the 2000-02-29 anchor that already kills
        that mutant; the survivors killed that day were the OTHER `||`s, per
        commit cc08bf1 "kill epoch_days validation-guard mutants". The claim had
        been asserted from a summary rather than verified against history. The
        comment now carries the correction as the record, and states honestly
        that the 8192 case is defence in depth rather than the only killer —
        though the reviewer did confirm mechanically that mutating the predicate
        makes that test fail. Two minor findings adopted: the chmod-000 tests
        would fail (loudly, not silently) as root, and now skip after testing
        their own premise portably; and the cksum gap noted under VER-REVIEW-v0.18.1.
    links:
      - type: verifies
        target: REQ-PROOF-001
      - type: verifies
        target: REQ-MUTATE-002

  - id: VER-ATTEST-001
    type: verification
    title: An attestation binds to its layer and its bytes, or it is refused
    status: verified
    release: v0.22.0
    fields:
      method: automated-test
      steps:
        # The statement names the bytes and the layer, and agrees with both.
        - run: cargo test -p varve-core a_statement_names_the_bytes_and_the_layer
        # The two fail-closed bindings.
        - run: cargo test -p varve-core swapped_bytes_are_refused
        - run: cargo test -p varve-core an_attestation_for_another_layer_is_refused
        # Renamed after review: the old name collided with a test in kind.rs,
        # so this evidence step passed via a homonym and could be deleted
        # without the gate noticing.
        - run: cargo test -p varve-core an_unknown_attestation_kind_is_refused_not_guessed
        # A statement whose own name and digest disagree is refused, the rule
        # `resolve` applies to pins.
        - run: cargo test -p varve-core a_statement_whose_own_two_identities_disagree_is_refused
        # Signature round-trip, and the wrong root cannot vouch.
        - run: cargo test -p varve-core a_statement_round_trips_through_a_signature
        - run: cargo test -p varve-core the_wrong_root_cannot_vouch_for_an_association
        # End to end at the CLI: sbom -> sign-attestation -> check-attestation,
        # with tampered bytes, a wrong root and an unknown kind all refused.
        - run: cargo test -p varve --test cli an_attestation_binds_to_its_layer_and_nothing_else
        # The checker re-verifies the LAYER, not just the statement: review
        # found it reporting OK over a tampered binary and a forged layer.json.
        - run: cargo test -p varve --test cli check_attestation_refuses_a_tampered_layer
    links:
      - type: verifies
        target: REQ-ATTEST-001

  - id: VER-REVIEW-v0.22.0
    type: verification
    title: v0.22.0 independently reviewed — DISSENT on a consumer-side trust hole, then closed
    status: verified
    release: v0.22.0
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        Independent clean-room review (fresh context, refute-framed), 2026-08-13,
        of REQ-ATTEST-001 at HEAD 56c9aa1. VERDICT DISSENT — the fifth
        consecutive review to dissent and the fifth to be right. Confirmed by
        the reviewer: the signed payload asserts nothing about the producer's
        claim and `producer` is copied uninterpreted, so the "statement ABOUT,
        never OF" split is real in what actually gets signed; all four payload
        types are distinct and type confusion was refuted in BOTH directions by
        probe (a layer manifest and a line-status each rejected as a statement,
        and a statement rejected by the layer verifier); the signer is
        trust-first (a tampered tool binary made sign-attestation exit 1).
        DISSENT 1, the serious one: `check-attestation` verified the STATEMENT
        but never the LAYER. The reviewer reproduced "attestation OK", exit 0,
        over both a tampered tool binary and a forged layer.json — states where
        `varve verify` exits 1 — because InstalledLayer.digest is the store
        DIRECTORY NAME and .layer is parsed from the possibly-tampered
        layer.json, neither authenticated until the retained envelope is
        re-checked. Every sibling command routes through export_target; this
        one, the command a disconnected consumer runs, did not. FIXED, with a
        regression test asserting it now reaches the same verdict as `verify`.
        DISSENT 2: REQ-ATTEST-001 was flipped to `verified` with two of its own
        shall-clauses unimplemented — the text still promised OCI referrer
        transport and `varve verify` reporting, neither of which shipped — in
        the very commit that honestly retargeted REQ-INDEXAUTH-001. Exactly the
        overclaim varve's claim-check discipline exists to prevent. FIXED by
        narrowing REQ-ATTEST-001 to the binding half that shipped and splitting
        the transport half into REQ-ATTEST-002 at v0.23.0.
        Three further findings adopted: both commands printed the ATTESTATION
        digest in the slot the codebase reserves for the LAYER manifest digest,
        never showing the actual join key (now both are labelled explicitly);
        `check` never compared the statement's layer NAME against anything
        while the CLI printed it as fact, so a mis-issued statement could make
        varve print a confident, signed-looking, wrong identity (now refused,
        the same rule `resolve` applies to pins); and VER-ATTEST-001's kind step
        was VACUOUS — the test name collided with one in kind.rs, so the
        evidence passed via a homonym and could be deleted without the gate
        noticing (renamed). DD-021 now records the "statement ABOUT, never OF"
        decision, which had existed only in a doc comment.
    links:
      - type: verifies
        target: REQ-ATTEST-001

  - id: VER-COMPOSE-001
    type: verification
    title: One pin resolves a composition; ambiguity, cycles and missing includes fail closed
    status: verified
    release: v0.23.0
    fields:
      method: automated-test
      steps:
        # The consumer's case end to end: one pin, tools from both layers.
        - run: cargo test -p varve --test cli one_pin_resolves_tools_from_a_composed_layer
        # varve refuses to choose between two layers exposing one tool.
        - run: cargo test -p varve --test cli a_tool_in_two_composed_layers_refuses_to_resolve
        # Transitive fetch is out of scope, so a missing include names itself.
        - run: cargo test -p varve --test cli a_composed_layer_that_is_not_installed_names_itself
        # The security clause: install ACCEPTS a composed layer, and verify
        # REFUSES one whose included layer is unsigned. Review demonstrated the
        # old behaviour — unsigned include dispatched, verify exited 0.
        - run: cargo test -p varve --test cli verify_refuses_a_composition_whose_included_layer_is_unsigned
        # A diamond (two layers sharing a base) is walked once, not misreported
        # as a cycle — the most ordinary composition shape there is.
        - run: cargo test -p varve-core a_diamond_is_walked_once_not_refused_as_a_cycle
        # Depth is bounded, so "refused" never means "followed until abort".
        - run: cargo test -p varve-core depth_is_bounded_so_a_long_chain_cannot_exhaust_the_walker
        # UNIT-level guards on composition. The mutation gate kills with
        # `--workspace --lib`, so the CLI tests above cannot protect this code:
        # `compose_tools -> Ok(vec![])` survived until these existed.
        - run: cargo test -p varve-core resolve_returns_the_composed_layers_tools
        - run: cargo test -p varve-core resolve_refuses_a_tool_exposed_by_both_layers
        - run: cargo test -p varve-core a_pin_restricting_tools_also_restricts_the_composition
        # Core: union, ambiguity, cycles, uninstalled includes, and back-compat
        # for every layer that composes nothing.
        - run: cargo test -p varve-core a_composition_exposes_both_layers_tools
        - run: cargo test -p varve-core a_tool_in_two_layers_is_an_error_not_a_silent_choice
        - run: cargo test -p varve-core a_cycle_is_refused_not_followed
        - run: cargo test -p varve-core an_uninstalled_include_is_skipped_for_the_caller_to_report
        - run: cargo test -p varve-core a_layer_without_includes_composes_to_itself
    links:
      - type: verifies
        target: REQ-COMPOSE-001

