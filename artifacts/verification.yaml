        Option and was filter_map'd, so a signed entry with no tool annotation
        (which foreign-platform entries legitimately lack) or with a payload
        kind this build does not recognise was DROPPED SILENTLY — proven with
        three signed entries emitting one component, exit 0. For a document
        sold as "a scanner can miss a component; a transcription cannot", that
        is the defect that matters. FIXED: component() is now infallible —
        whatever is unknown is LABELLED (kind.unrecognised, unnamed+digest
        identity), never dropped — and `map` replaces `filter_map`, with a test
        asserting component count == signed entry count.
        The reviewer also found that a JUSTIFYING COMMENT WAS FALSE: sbom.rs
        said "kind() already refuses it before we are called", and kind.rs
        claimed install refuses unknown kinds. Neither is true — kind() is not
        consulted by install or verify at all. Both comments corrected to state
        reality; the behavioural question is deferred to varve#49 rather than
        changed mid-release. Three further findings adopted: the CLI reported
        the INPUT entry count rather than the emitted component count (it could
        disagree with the file just written); REQ-SBOM-001 said "shall fail
        closed" with no test, now covered at the CLI boundary; and the serial
        number parsed as UUID "version 11", now a conformant RFC 9562 v8. Two
        quality findings adopted for the CRA use the docs invoke: purl is now
        emitted (pkg:github/owner/name@version — what lets a consumer match a
        component to a CVE feed) and externalReferences are now followable URLs
        rather than a bare `owner/name` slug.
    links:
      - type: verifies
        target: REQ-SBOM-001

  - id: VER-REVIEW-v0.18.1
    type: verification
    title: v0.18.1 independently reviewed (retroactive) — pass
    status: verified
    release: v0.18.1
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        Retroactive independent clean-room review, 2026-08-13, commissioned
        because the project's own review-check flagged that v0.18.1 had shipped
