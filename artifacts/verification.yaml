  - id: VER-INDEXAUTH-001
    type: verification
    title: The realm's signed line index — a source that hides a layer is caught
    status: verified
    release: v0.26.0
    tags: [security]
    fields:
      method: test
      baseline: >
        Five numbered clauses, each with a test that fails on its own mutation.
        Ten mutations were applied, run and reverted. Two of the tests were
        WRONG when first written and the mutants proved it: the cross-document
        replay test passed because the two structs' deny_unknown_fields shapes
        diverge, so it proved schema divergence while claiming to prove the
        payload-type check; and the counter-regression test called
        refuse_regression DIRECTLY, so deleting that call from `check` — the
        function install goes through — left the suite green. Both are fixed
        and both now fail on their mutant.
        CLAUSE 4 WAS CORRECTED, not merely implemented. It read "the
        anti-rollback high-water mark shall be advanceable from the verified
        index". An integration test through `install` refuted it on the first
        run: raising the ENFORCEMENT mark to the line's newest counter makes a
        deliberately-pinned older layer uninstallable the moment the realm
        publishes a newer one — breaking frozen toolchains, varve's entire
        purpose, to defend against an attack varve's pin-based model does not
        have. Uptane's freshness attack presumes a client that wants the
        latest; a varve consumer names an exact layer. The clause is now
        REPORTING, and `advance_to` was deleted rather than left as dead
        trust-critical code.
        THIS RECORD WAS ITSELF FALSE WHEN FIRST WRITTEN, and an independent
        review caught it. Every step below was a varve-core test calling
        `install()` with a policy the PRODUCT NEVER CONSTRUCTED: the CLI's only
        `InstallPolicy` hardcoded `index: None`, and `fetch_line_index` /
        `served_layers` were implemented by exactly one type — `MemorySource`,
        the in-memory test double. `RegistrySource`, `OciLayoutSource` and
        `DirSource` all inherited the trait defaults returning `Ok(None)`, and
        `realm.signed_index` was parsed and never read. Five clauses were
        marked verified while unreachable from the shipped binary. That is the
        same shape as the two mutant-refuted tests above, one level up:
        evidence that exercises a different entry point than the clause runs
        through. The fix wires the policy from the resolved realm, implements
        both source methods on the registry and the layout, gives clause 2 a
        cache to compare against (it was passed `None`, so the rule could not
        fire on any real machine), and reports the index at install. The steps
        now include tests that DRIVE THE EXECUTABLE, because no test that
        constructs an `InstallPolicy` itself can detect that nothing else does.
        Ten further mutations were applied, run and reverted for this fix; one
        survived and exposed a weak test — the clause-2 install test compared
        error messages, which the cache's own write-time guard produces
        identically AFTER laying the layer down, so it now counts blob fetches
        and asserts the refusal precedes them.
      steps:
        - run: cargo test -p varve-core an_index_verifies_only_against_the_realm_that_signed_it
        - run: cargo test -p varve-core a_signed_line_status_cannot_be_replayed_as_an_index
        - run: cargo test -p varve-core a_source_that_hides_a_layer_the_index_names_is_refused
        - run: cargo test -p varve-core check_refuses_a_stale_index_not_only_refuse_regression_does
        - run: cargo test -p varve-core a_realm_that_promised_an_index_does_not_fall_back_to_an_unsigned_listing
        - run: cargo test -p varve-core a_source_that_cannot_enumerate_is_not_treated_as_hiding_everything
        - run: cargo test -p varve-core a_realm_declares_whether_it_publishes_a_signed_index
        # Through install(), not through the helpers.
        - run: cargo test -p varve-core install_refuses_a_source_that_hides_an_indexed_layer
        - run: cargo test -p varve-core install_raises_the_mark_from_the_index_even_when_the_layer_is_hidden
        - run: cargo test -p varve-core a_replayed_older_index_is_refused_on_the_next_install_not_only_in_theory
        # Through the REAL SOURCES, not the in-memory double: an HTTP registry
        # double serving the index under its own tag and answering /tags/list,
        # and an oci-layout carrying it as a referrer.
