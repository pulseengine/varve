        - run: cargo test -p varve-core attaching_by_envelope_derives_the_line_from_the_document
        # End-to-end: deposit -> sign -> attach -> install -> status works offline.
        - run: cargo test -p varve an_attached_baseline_makes_status_work_after_an_offline_install
