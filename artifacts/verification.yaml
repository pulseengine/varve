  - id: VER-STORE-002
    type: verification
    title: A layer holds many payloads, including several versions of one name
    status: verified
    release: v0.26.0
    tags: [core, distribution]
    fields:
      method: test
      baseline: >
        varve#69, raised from use: a layer could not hold two versions of one
        crate. `deposit` dedupped on (name, platform), ignoring version and
        kind, so varve could not express its OWN dependency graph as a layer —
        252 packages in its Cargo.lock, 14 names at more than one version,
        getrandom at three — and `export-cargo` could never satisfy a real
        lockfile.
        The second half was the dangerous one. `Store::lay_down` wrote every
        payload to `bin/<name>`, so relaxing the deposit check ALONE would have
        turned a clean error into a SILENT OVERWRITE: the wrong bytes under the
        wrong name, and verification then failing on the OTHER entry with
        nothing explaining why. Identity now follows dispatchability — `tool`
        keeps `bin/<name>` and (name, platform) because it is dispatched by
        name and must resolve uniquely; everything else lands at
        `payloads/<name>/<version>` under (name, version, platform).
        Proven end to end on the release binary rather than asserted: a layer
        holding serde 1.0.200, serde 1.0.210 and a tool deposits, installs,
        verifies, archives, re-installs into a fresh core offline, and exports
        a Cargo registry whose index lists BOTH versions with cksums equal to
        the sha256 of the tarballs actually on disk — each version exporting
        its own bytes, not whichever landed last.
        Two defects were found and fixed that the clauses did not name. A
        signed manifest naming `../../evil` could previously escape the layer
        via `bin.join(name)`; path components are now validated. And
        `lockpin::disagreements` compared every pinned entry against every
        locked package of the same NAME, so the moment a multi-version layer
        existed `verify --lockfile` would have reported 1.0.200 vs 1.0.210 as
        drift and gone red on every real lockfile — a false failure the fix
        itself would have introduced.
        Deliberate behaviour change, stated: crate/wit/sdk payloads no longer
        appear in `bin/`, so `varve which <crate>` no longer resolves them.
        They used to, accidentally; dispatching a `.crate` tarball was never
        meaningful. Backward compatible for existing installs — `entry_path`
        falls back to `bin/<name>`, unambiguous because the old check made a
        second version impossible, and a pre-change core was reconstructed and
        verified, exported and archived unchanged.
        18 hand-applied mutations, all killed, including M1 (every payload back
        to bin/<name> — the original bug) and M7 (held payloads keyed on
        (name, platform) again — varve#69 restored). `cargo mutants` over the
        CI-gated files changed: install.rs and reverify.rs, 28 mutants, 25
        caught, 3 unviable, 0 missed; store.rs 0 missed.
      steps:
        - run: cargo test -p varve-core two_versions_of_one_name_are_two_files_neither_overwriting_the_other
        - run: cargo test -p varve-core two_payloads_claiming_one_path_are_refused_before_anything_is_written
        - run: cargo test -p varve-core a_name_or_version_that_escapes_the_layer_is_refused
        - run: cargo test -p varve-core a_layer_installed_before_this_change_still_resolves_its_crate
        - run: cargo test -p varve-core only_a_tool_is_dispatched_by_name
        - run: cargo test -p varve-core two_versions_of_one_crate_are_a_layer_not_a_duplicate
        - run: cargo test -p varve-core a_tool_may_not_appear_twice_under_one_name_however_its_versions_differ
        - run: cargo test -p varve-core the_signed_digest_does_not_depend_on_the_order_versions_are_listed_in
        - run: cargo test -p varve-core each_version_of_one_name_is_checked_against_its_own_signed_digest
        - run: cargo test -p varve-core a_registry_exported_from_a_layer_offers_every_version_it_pins
        - run: cargo test -p varve-core a_layer_pinning_two_versions_of_one_crate_agrees_with_a_lockfile_holding_both
        - run: cargo test -p varve --test cli a_layer_holding_two_versions_of_one_crate_deposits_installs_verifies_and_exports_both
        - run: cargo test -p varve --test cli two_versions_of_one_tool_are_still_refused_and_the_error_names_both
    links:
      - type: verifies
        target: REQ-STORE-002

  - id: VER-VSIX-001
    type: verification
    title: A VS Code extension is a pinned, verified, non-executable payload `code` installs
    status: verified
    release: v0.26.0
    tags: [distribution, ergonomics]
    fields:
      method: test
      baseline: >
        varve#68: a reproducible environment pins its compiler, its linker and
        its test runner, then installs editor extensions from a marketplace
        with no verification at all. A `.vsix` is one zip file, so it needed no
        tree-shaped store (varve#67) and could ship in this release.
        Clauses 2 and 4 required NO new code. REQ-STORE-002 (06069af) had
        already made identity and layout follow `PayloadKind::is_dispatchable`,
        so adding one non-dispatchable variant gave a `.vsix`
        `payloads/<name>/<version>` at mode 0644 and a (name, version) identity
        for free. That was verified by running, not assumed: mutating
        `is_dispatchable` to include Vsix and mutating store.rs's mode to a
        constant 0o755 each turned the end-to-end CLI test red.
        Implemented: `PayloadKind::Vsix` (`kind = "vsix"`, parsed, round-tripped
        through the SIGNED annotation, not dispatchable); the `export-vsix`
        adapter, which names each file `publisher.name-version.vsix` — the
        marketplace convention, and `code --install-extension` dispatches on the
        `.vsix` suffix, treating anything else as a marketplace id to FETCH;
        the shared `.varve-export.json` stamp, so `varve verify --export`
        catches the pin moving on without the export; and the `export-vsix`
        docs topic, added to TOPICS_NEEDING_EXAMPLES so its worked example is
        gated rather than trusted.
        Fail-closed properties the clauses did not name, all from the
        REQ-STORE-002 lesson: every destination is resolved BEFORE any bytes are
        written, so an unexportable id leaves the directory untouched rather
        than half-populated; two entries that would share a file name are a
        Collision error, not a last-writer-wins overwrite; an id containing `/`
        (a signed name is attributable, not benign) or starting with `-` (which
        `code` would parse as a flag) is refused; and a layer carrying no `vsix`
        entries fails rather than producing an empty directory a consumer would
        install from and believe complete.
        Proven end to end on the RELEASE binary: a layer holding two extensions,
        one of them at two versions, plus a tool — deposited, installed,
        verified (4 payloads against their own signed digests), and exported.
        Store listing showed `bin/synth` at 0755 and
        `payloads/rust-lang.rust-analyzer/{0.3.2260,0.3.2300}` plus
        `payloads/vadimcn.vscode-lldb/1.11.4` at 0644; the export directory
        showed three `.vsix` files at 0644 with the stamp; `verify --export`
        read fresh; `varve which rust-lang.rust-analyzer` was refused while
        `varve which synth` resolved.
        13 hand-applied mutations, all killed — including is_dispatchable
        returning true for Vsix, the signed wire string changing to
        `vsix-package`, store.rs handing every payload 0o755, the `.vsix`
        suffix being dropped from the exported name, the export setting 0o755,
        validation moving from the plan to the write loop, the stamp not being
        written, and the topic shipping with empty fences.
      steps:
        - run: cargo test -p varve-core only_a_tool_is_dispatched_by_name
        - run: cargo test -p varve-core every_kind_round_trips_through_its_wire_string
        - run: cargo test -p varve-core the_kind_list_the_other_tests_iterate_holds_every_variant
        - run: cargo test -p varve-core extensions_deposit_as_vsix_entries_at_several_versions
        - run: cargo test -p varve-core the_file_name_is_the_one_code_and_a_human_both_read
        - run: cargo test -p varve-core an_id_that_could_escape_or_look_like_a_flag_is_refused
        - run: cargo test -p varve-core nothing_is_written_when_one_entry_is_unexportable
        - run: cargo test -p varve-core two_entries_that_would_share_a_file_are_refused_not_overwritten
        - run: cargo test -p varve-core every_extension_lands_with_its_own_bytes_and_no_execute_bit
        - run: cargo test -p varve-core a_tool_keeps_bin_and_a_held_payload_never_borrows_it
        - run: cargo test -p varve --test cli vsix_extensions_deposit_install_verify_and_export_for_code
        - run: cargo test -p varve --test cli export_vsix_refuses_a_layer_with_no_extensions_rather_than_writing_an_empty_directory
        - run: cargo run -p varve -- docs check --coverage --strict
    links:
      - type: verifies
        target: REQ-VSIX-001

  - id: VER-CRATEIDX-001
    type: verification
    title: An exported Cargo registry index describes the crates it contains
    status: verified
    release: v0.27.0
    tags: [distribution]
    fields:
      method: test
      baseline: >
        varve#73. `export-cargo` wrote `"deps":[]` and `"features":{}` for every
        crate while Cargo resolves the dependency graph FROM the index. Measured
        again here on varve's own 250-package lockfile through the real export:
        228 of 250 index entries now declare a dependency or a feature, so the
        stub was wrong for 91% of a real layer.
        Implemented: `read_crate_meta` opens the `Cargo.toml` inside the SIGNED
        `.crate` tarball — the same tarball `export_vendor_dir` already
        unpacks — and transcribes `[dependencies]`, `[dev-dependencies]`,
        `[build-dependencies]`, their `[target."cfg(...)"]` forms, `[features]`,
        `package.links` and `package.rust-version` into the index shape
        crates.io uses: `deps` with `req`/`features`/`optional`/
        `default_features`/`target`/`kind`/`registry`/`package`, and features
        split into `features`/`features2` behind `"v":2` for namespaced (`dep:`)
        and weak (`?/`) values, exactly as Cargo publishes them. The line is
        built by a derived `Serialize`, so key order is fixed at the declaration
        order and nothing is interpolated into JSON by hand.
        Clause 2 (faithful or refuse) is a closed allow-list: a dependency
        carrying `git`, unresolved `workspace = true`, a `registry` ALIAS, a
        `path` with no version, a non-string `version`, a non-boolean flag, or
        ANY key varve does not know how to transcribe is an error naming the
        crate, the dependency and the construct — never a dropped entry.
        `export_local_registry` computes every line BEFORE writing anything, so
        a refusal leaves no half-written registry.
        Clause 3 (a REAL graph): `cargo_offline` no longer passes with one
        dependency-free crate. Its fixture is four packaged crates with
        transitive dependencies, a non-default feature requested OF a
        dependency, `default-features = false`, a RENAMED dependency and TWO
        versions of one name — and the consumer is RUN, not merely built,
        because the worst observed outcome of the stub was a build that exits 0
        with a crate compiled featureless.
        DOGFOOD (the acceptance test): varve's own 250 crates.io packages taken
        from `~/.cargo/registry/cache`, deposited as `kind = "crate"`,
        installed, verified (250 payloads against their signed digests),
        `export-cargo`ed, and then `cargo build --offline --workspace` in an
        ISOLATED, empty `CARGO_HOME` with no crates.io index present at all —
        exit 0, 171 crates unpacked from varve's registry. Negative control:
        the same run with the v0.26.0 stub index restored exits 101 with
        "package `varve` depends on `clap` with feature `derive` but `clap` does
        not have that feature" — the exact failure varve#73 reported.
        Mutations, all applied and reverted: the v0.26.0 stub restored (killed);
        the crate's own feature map dropped while deps are kept (killed);
        `default-features = false` silently dropped — the SILENT class, which
        builds and exits 0 and is caught only by the behavioural assertion,
        17164 vs 11564 (killed); `[target.*]` dependencies dropped (killed);
        `features2` emitted without `"v":2` (killed); the git branch and the
        workspace-inheritance branch deleted (killed, by the message assertion);
        writing before validating (killed).
      steps:
        - run: cargo test -p varve-core an_index_entry_carries_the_crates_real_deps_and_features
        - run: cargo test -p varve-core namespaced_and_weak_features_go_to_features2_behind_v2
        - run: cargo test -p varve-core a_dependency_the_index_cannot_express_is_an_error_naming_the_crate
        - run: cargo test -p varve-core a_feature_the_index_cannot_express_is_an_error_naming_the_crate
        - run: cargo test -p varve-core a_crate_tarball_without_a_cargo_toml_is_refused_not_stubbed
        # Clause 3: the REAL graph, RUN rather than merely built.
        - run: cargo test -p varve-core --test cargo_offline a_varve_exported_registry_resolves_a_real_graph_and_builds_it_correctly
        - run: cargo test -p varve-core --test cargo_offline an_index_entry_varve_wrote_is_the_entry_cargo_reads
        # Full CLI path: deposit crate-kind -> install -> export-cargo, with the
        # deps and features carried through.
        - run: cargo test -p varve --test cli deposit_a_crate_kind_entry_and_export_a_cargo_registry
    links:
      - type: verifies
        target: REQ-CRATEIDX-001

  - id: VER-COMPOSEEXPORT-001
    type: verification
    title: An export follows the composition, or says it did not
    status: verified
    release: v0.27.0
    tags: [distribution, core]
    fields:
      method: test
      baseline: >
        varve#79. `resolve()` unioned composed TOOLS and `verify` checked each
        included layer, but every export adapter read ONE `layer.json` — so an
        extender composing pulseengine's layer ran `export-cargo` and got only
        their own crates, with no error.
        Implemented: `composition_for_export` walks the graph from the export
        target, cycle-guarded on an ancestor PATH (pushed and popped, so a
        DIAMOND is walked once rather than refused as a cycle) and bounded by
        `compose::MAX_DEPTH`, verifying each included layer against the trust
        root of the realm the include NAMES — the including layer's root does
        not speak for another realm. Every adapter now goes through it:
        export-cargo, export-crates-vendor, export-bazel-distdir, export-vsix
        and export-bazel, plus `verify --lockfile`, which was blind in the same
        way.
        Clause 2's rule is stated as its own function, `compose::union_payloads`,
        with its own error type: a name at DIFFERENT versions exports both; the
        same name AND version at the SAME digest exports once (two realms
        AGREEING is the ordinary diamond, not a conflict); the same name and
        version at DIFFERENT digests is an error naming both realms, both
        layers and both digests. It is deliberately NOT `union_tools`: a tool
        name is dispatched and must resolve to one binary, a payload is placed
        in a registry keyed by (name, version) and two versions are what a
        lockfile requires.
        Clause 3: a composed layer that is not installed is an error naming it
        and its corrective install ("this export would silently omit its
        payloads"), and a composed export prints every layer it followed with
        the realm that vouched for it.
        Mutations, all applied and reverted: `composition_for_export` returning
        only the root — varve#79 restored (killed); the verification of a
        composed layer ignored (killed); a missing include silently skipped
        (killed — and this one SURVIVED until the clause-3 test existed, which
        is why it exists); the conflicting-digest arm disabled (killed); the
        conflicting-digest arm made unconditional, so agreement is refused
        (killed); the collision key reduced to the name, so two versions clash
        (killed); the CLI skipping `union_payloads` entirely (killed).
      steps:
        - run: cargo test -p varve-core two_versions_of_one_crate_both_export
        - run: cargo test -p varve-core the_same_name_and_version_with_the_same_bytes_exports_once
        - run: cargo test -p varve-core the_same_name_and_version_with_different_bytes_names_both_realms
        - run: cargo test -p varve --test cli an_export_follows_the_composition
        - run: cargo test -p varve --test cli an_export_refuses_a_composed_layer_it_cannot_vouch_for
        - run: cargo test -p varve --test cli an_export_refuses_two_layers_that_disagree_about_one_crate
        - run: cargo test -p varve --test cli an_export_that_cannot_follow_the_composition_says_so
    links:
      - type: verifies
        target: REQ-COMPOSEEXPORT-001

  - id: VER-REPRO-001
    type: verification
    title: What varve emits is a function of the layer, not of the machine
    status: verified
    release: v0.27.0
    tags: [core, supply-chain]
    fields:
      method: test
      baseline: >
        varve#72: one layer exported twice differed only in
        `.cargo/config.toml`, which embedded an ABSOLUTE path.
        THE EMPIRICAL QUESTION, settled before anything changed, as clause 1
        required. Cargo resolves a relative `local-registry` (and a relative
        `directory`) against the directory that HOLDS `.cargo/` — never against
        the invoking cwd. Demonstrated against cargo 1.97.0 with a real
        registry: config at `<root>/.cargo/config.toml` saying
        `local-registry = "reg"`, build run from `<root>/sub`; with the registry
        at `<root>/reg` the build succeeds and Cargo prints the resolved
        absolute path; with the registry moved to `<root>/sub/reg` (the
        cwd-relative candidate) or to `<root>/.cargo/reg` (beside the config
        itself) it fails with "local registry path is not a directory:
        <root>/reg". Both negative controls ran.
        So clause 1's first branch applies and clause 2 does not: there is no
        machine-specific file to separate out. varve emits the bare
        subdirectory constants `registry` / `vendor`, which are a function of
        the layer alone and keep working when the export is copied, committed
        or relocated.
        CORRECTION TO A SHIPPED TEST. REQ-PRODUCE-002's
        `a_relative_out_still_yields_an_absolute_path_in_the_generated_config`
        asserted the WRONG property. The bug it was written for was real — a
        relative `--out` embedded VERBATIM, and so resolved against whatever cwd
        the build later ran in — but "absolute" was the wrong fix for it. The
        test is now
        `a_relative_out_is_resolved_not_embedded_verbatim`, and it pins both
        halves: the emitted string is not the user's argument, AND it names the
        registry where Cargo resolves it from.
        Clause 3: `every_export_adapter_is_byte_identical_between_two_runs`
        exports one layer twice, to destinations that differ in NAME as well as
        location, and compares the complete file tree — every path, every byte,
        the `.varve-export.json` stamp included — for ALL FIVE adapters
        (export-cargo, export-crates-vendor, export-bazel-distdir, export-vsix,
        export-bazel), over a fixture carrying a source-provenance tool, three
        crates including two versions of one name, and two `.vsix`.
        Clause 4 is unchanged and deliberately so: `varve docs threat-model`
        still says varve signs what its build produced and does not prove the
        build was deterministic. Nothing here makes that sentence false.
        Mutations, all applied and reverted: `export-cargo` embedding the
        destination path in the config — varve#72 exactly (killed);
        `export-crates-vendor` doing the same (killed); the export stamp
        carrying the destination (killed); `cargo_config_toml` made absolute
        again (killed, by the corrected REQ-PRODUCE-002 test).
        One EQUIVALENT mutant, reported rather than hidden: switching
        `export-bazel`'s registry map to a `HashMap` survives, because the map's
        iteration order affects only the order of printed lines — each
        `<tool>.json` file's content is independent of it. The output bytes are
        unchanged, so there is nothing for a test to catch.
      steps:
        - run: cargo test -p varve --test cli every_export_adapter_is_byte_identical_between_two_runs
        - run: cargo test -p varve --test cli a_relative_out_is_resolved_not_embedded_verbatim
        - run: cargo test -p varve-core config_redirects_crates_io_to_the_local_registry
        # The empirical answer, made permanent: the oracle builds from a
        # subdirectory of the export root and asserts that no registry exists
        # at either the cwd-relative or the config-dir-relative candidate.
        - run: cargo test -p varve-core --test cargo_offline a_varve_exported_registry_resolves_a_real_graph_and_builds_it_correctly
        - run: cargo test -p varve-core --test cargo_offline a_varve_vendored_crate_builds_offline_through_cargo
    links:
      - type: verifies
        target: REQ-REPRO-001
  - id: VER-SDK-001
    type: verification
    title: A tree payload is held as its signed archive and relocated only into an export
    status: verified
    release: v0.27.0
    tags: [distribution]
    fields:
      method: test
      baseline: >
        Library-level, on a SYNTHETIC tree rather than a real Yocto SDK: a
        "binary" carrying two NUL-padded path fields, an `environment-setup`
        text file, an SDK-internal absolute symlink, and a directory, packed as
        a gzip tar and also as a plain one.
        Clause 1 is verified in the STORE, where a tree payload is held as the
        single archive its producer signed at `payloads/<name>/<version>` —
        two Yocto releases of one SDK coexist, each resolving from its own
        manifest entry, and neither borrows `bin/`. That clause was CORRECTED
        during implementation: unpacking a tree in the store would leave
        `verify` and `archive` with no single file to hash against the single
        signed digest (contradicting clause 2), and the store path is ~90
        characters before any content, so an SDK could not be relocated into it
        anyway (clause 4's own arithmetic).
        Clause 4 is the constraint everything else follows from, transcribed
        from `relocate_sdk.py` rather than recalled: `len(new_dl_path) >=
        p_filesz` fails. A destination one character longer than the build
        prefix is refused BEFORE the archive is opened, by name, with the
        budget in the message and nothing written; a destination exactly at the
        budget is accepted, because the rule is "no longer", and an off-by-one
        here refuses legitimate destinations. The field-level guard is kept as
        well and fires on a field too small, refusing rather than truncating —
        a truncated interpreter path is a binary that cannot exec with nothing
        to point at.
        Clause 3 covers both halves of the real installer: a binary's field is
        patched IN PLACE and re-padded with NUL so the file length and every
        offset survive; a text file is substituted freely and may change
        length; an SDK-internal absolute symlink is re-pointed into the export.
        Clause 2 is asserted as a difference: the exported bytes are NOT the
        signed bytes, and the archive handed in is byte-identical afterwards —
        nothing on this path writes back into the store or records a
        post-relocation digest.
        Clause 5 is the tree's larger attack surface: every component of every
        member is validated (`../../evil`, `/etc/passwd`, `a/../../evil`, `a//b`,
        `a/./b`, ``, `..` all refused) and the good member does not land either;
        two members claiming one path are a Collision; a symlink to the host, a
        relative symlink climbing out, and — the escape a per-component check
        cannot see — a link out followed by a write THROUGH it are each refused
        with nothing written outside the export. An archive whose member name
        was written into the tar header directly, bypassing tar-rs's own `..`
        check, is refused by varve rather than by the dependency.
        11 hand-applied mutations against these tests, every one killed: the
        destination fit check disabled; the absolute-destination check
        disabled; the NUL re-padding removed; the field guard weakened to `>`;
        every file treated as binary; the symlink left un-repointed; `..`
        accepted as a path component; the write-through-symlink check disabled;
        an absolute escaping link accepted; the member collision check
        disabled; gzip detection disabled; and a hostile archive member
        silently SKIPPED instead of refused.
        THE CLI WIRING, added after the library landed unreachable. Until
        `varve export-sdk` existed, every clause above was verified against a
        library nothing in the product called — the REQ-INDEXAUTH-001 shape,
        where a clause is marked verified while no code path constructs the
        policy. The CLI tests below drive the BINARY, never the library:
        an `sdk` deposited with its signed prefix installs, verifies, exports
        as a relocated tree (no occurrence of the build prefix survives in any
        member, the internal absolute symlink is re-pointed into the export,
        the binary's length is unchanged because its field was patched in
        place), and the store still holds the archive BYTE-IDENTICAL to what
        was deposited — so `verify`, which re-hashes that one file, still
        passes after the export (clauses 1, 2, 3). The stamp is asserted to be
        exactly `sdk`, because a declared `[[export]]` is compared against that
        string and any other spelling reports the declared export as never
        produced. Clause 4 is exercised in both directions at the boundary: a
        destination longer than the build prefix is refused by name with the
        budget in the message and neither stamp nor tree written, and the
        PRODUCING half is refused too — `deposit` rejects an `sdk` with no
        `sdk-prefix` (it would install, verify, and be impossible to export,
        discovered on the far side of an air gap and unfixable without a
        re-deposit) and rejects the field on any other kind, where it would be
        signed, ignored, and believed. Clause 5 is exercised at the CLI: an
        archive whose member name was written into the tar header directly,
        bypassing tar-rs's own `..` check, is refused by varve with nothing
        left behind inside the export or outside it.
        4 mutations against the CLI tests, every one killed: the stamp written
        as `vsix` instead of `sdk`; the relocation prefix taken from the
        destination instead of the signed annotation (which also breaks the
        budget message, so two tests go red); `deposit` accepting an sdk with
        no prefix; and the sdk-prefix-on-a-tool refusal removed.
        Run end to end against the RELEASE binary on 2026-08-19: keygen ->
        deposit (sdk + sdk-prefix) -> install -> `export-sdk` -> declare
        `[[export]]` -> `verify` exit 0 -> `rm -rf` the export -> `verify`
        exit 1 naming the missing directory and the command that regenerates
        it.
        Not verified here: a real multi-gigabyte Yocto SDK, real ELF PT_INTERP
        parsing (the field is located by its NUL-terminated string, not by
        reading program headers), and `--select` against a layer carrying more
        than one `sdk` (the ambiguity refusal is coded and unit-unexercised).
      steps:
        - run: cargo test -p varve-core a_tree_shaped_payload_is_held_by_name_and_version_like_any_other
        - run: cargo test -p varve-core a_destination_longer_than_the_build_prefix_is_refused_before_anything_is_written
        - run: cargo test -p varve-core a_relative_or_prefixless_destination_is_refused
        - run: cargo test -p varve-core a_nul_padded_field_is_patched_in_place_and_the_file_length_is_preserved
        - run: cargo test -p varve-core a_field_too_small_for_the_new_path_is_refused_rather_than_truncated
        - run: cargo test -p varve-core a_text_file_is_substituted_and_may_change_length
        - run: cargo test -p varve-core the_whole_synthetic_tree_lands_relocated_and_the_source_bytes_are_untouched
        - run: cargo test -p varve-core a_member_whose_path_escapes_the_export_is_refused_and_nothing_is_written
        - run: cargo test -p varve-core a_symlink_that_leaves_the_export_is_refused_even_though_every_component_is_safe
        - run: cargo test -p varve-core two_members_claiming_one_path_are_refused_before_anything_is_written
        - run: cargo test -p varve-core a_signed_archive_unpacks_and_relocates_and_the_archive_is_never_modified
        - run: cargo test -p varve-core an_archive_member_that_escapes_is_refused_before_the_tree_is_written
        # THROUGH THE BINARY. Each of these fails if the CLI stops constructing
        # the policy, which no library-level test can detect.
        - run: cargo test -p varve --test cli export_sdk_lays_a_relocated_tree_down_through_the_cli
        - run: cargo test -p varve --test cli export_sdk_refuses_a_destination_the_sdk_cannot_reach_before_writing_anything
        - run: cargo test -p varve --test cli an_sdk_without_the_signed_prefix_cannot_be_deposited_at_all
        - run: cargo test -p varve --test cli export_sdk_refuses_a_hostile_archive_member_at_the_cli_boundary
    links:
      - type: verifies
        target: REQ-SDK-001
  - id: VER-EXPORTDECL-001
    type: verification
    title: Declared exports parse, are checked without being named, and explain a shadowed shim
    status: verified
    release: v0.27.0
    tags: [distribution, ergonomics]
    fields:
      method: test
      baseline: >
        `[[export]]` entries parse out of the pin varve.toml already is, so
        there is no second discovery path: a project declaring a `cargo`
        export, a `vsix` export with a two-name subset, and a sourced `sdk`
        export with its environment round-trips to the adapter, the
        destination, the selection and the environment, and a pin with no
        exports still parses — every varve.toml already in the world has none.
        Refusals, each with the correction in the message: an adapter this
        varve cannot produce (the refusal lists all six, and each wire string
        is asserted equal to the one the adapters already stamp, so a
        declaration and a stamp compare without a translation table); a
        destination that is absolute, climbs out with `..`, or names no
        directory; two entries sharing one destination, which would overwrite
        one stamp and leave `verify` checking one export twice and the other
        never; a subset selection that is a path rather than a payload name; a
        selection present but empty.
        Clause 3 is checked as a set rather than per directory: with nothing
        generated, EVERY declared export reports Missing — a failure, not a
        warning; once generated they read Current; when the pin moves they read
        Stale; a directory stamped by a DIFFERENT adapter is a KindMismatch,
        because freshness there says nothing about the declared export; and an
        unreadable stamp is its own verdict, since "re-run the export" is not
        the fix for a truncated file.
        Clauses 4 and 5 are the SDK half. An `[export.env]` is refused on a
        kind that is pointed at rather than sourced, and refused without a
        declared shim order — the message names both answers AND
        REQ-SHADOW-001, because the reason is the point: undeclared, `verify`
        must either miss a genuine hijack or fire on a legitimate sourced SDK.
        The classification yields three verdicts, not two: a binary inside an
        export declared `before-shims` is Expected; the same binary under an
        `after-shims` declaration ContradictsDeclaration; anything else — a
        distro gcc, or a binary inside a vendor directory that is never sourced
        — is Undeclared.
        The emitted `varve env` ordering is asserted to INVERT the declaration,
        which is why it is computed and not written by hand: sourcing prepends
        to PATH, so `after-shims` is sourced FIRST and `before-shims` LAST.
        12 hand-applied mutations against these tests, every one killed:
        exports dropped from the parse; an unknown adapter guessed as `cargo`;
        `..` accepted in a destination; the duplicate-destination check
        disabled; a path accepted as a selection; the shim order defaulted
        instead of required; `[export.env]` allowed on a pointed-at kind; a
        missing export reported Current; the two shim-order verdicts swapped;
        and the emitted sourcing order un-inverted.
        THE CLI WIRING, added after the library landed unreachable. Until
        this, `verify` never iterated the declarations, `varve env` printed the
        shim fragment alone, and `verify_no_shadowing` never consulted the
        classification — so every clause above was verified against a library
        nothing in the product called. The tests below drive the BINARY.
        Clause 3: a pin declaring TWO exports with neither generated fails
        naming BOTH (a loop that stops at the first fault checks one export and
        certifies the rest), and each fault names the command that produces it
        — `bazel-registry` is produced by `varve export-bazel`, so the obvious
        `format!("export-{kind}")` would print a command that does not exist in
        the one line whose job is to be run. Generating one leaves the other
        still failing; with only the generated one declared, `verify` passes
        and SAYS it looked (a silent pass is indistinguishable from a skipped
        check). Then, on the same directory: a moved pin is STALE, a stamp from
        a different adapter is refused as never-produced, and a deleted
        directory is MISSING — a failure, not a warning.
        Clause 5: with the SDK's own `synth` first on PATH, `verify` PASSES
        under a `before-shims` declaration (and says why), FAILS under an
        `after-shims` one naming the declaration and the script to re-order,
        and still reports the ordinary hijack — with `varve shim install` as
        the fix — for a binary in no declared export. Three verdicts, at the
        boundary, on one machine state.
        Clause 4: `varve env` in a project declaring one sourced export on each
        side of the shims emits them in the INVERTED order, and the emitted
        script is then EVALUATED by `sh` and the resulting PATH inspected —
        `before-shims` ahead of the shims, `after-shims` behind them. Asserting
        the text alone would verify the formatter. `--shell fish` fails rather
        than handing back an environment missing what varve.toml declares,
        since a producer's `environment-setup-*` is POSIX sh.
        4 mutations against the CLI tests, every one killed: `verify` returning
        early from the declared-export loop; `classify_shadowing` replaced by a
        constant `Undeclared`; `varve env` falling back to the shim fragment
        whatever the pin declares; and the shim line left unsubstituted so the
        sourced scripts land around the wrong position.
        Run end to end against the RELEASE binary on 2026-08-19: an sdk export
        declared in `varve.toml`, `verify` exit 0, `rm -rf` the directory,
        `verify` exit 1 naming it.
        STILL NOT REACHABLE, and the reason this VER stays short of its
        requirement: clause 2's `select` — a SUBSET of the layer — parses, is
        validated (a path there is refused, an empty list is refused) and is
        consumed by NOTHING. No adapter reads `ExportDecl::select`, so a
        project that declares `select = ["one-extension"]` gets the whole layer
        exported and `verify` reports it fresh. That is the same
        accepted-ignored-and-believed shape clause 4 of this requirement
        condemns, which is why REQ-EXPORTDECL-001 is NOT moved to verified.
      steps:
        - run: cargo test -p varve-core a_project_declares_its_exports_in_the_pin_it_already_has
        - run: cargo test -p varve-core the_declared_kind_is_one_varve_can_actually_produce
        - run: cargo test -p varve-core a_destination_that_leaves_the_repository_is_refused
        - run: cargo test -p varve-core two_exports_may_not_share_one_directory
        - run: cargo test -p varve-core a_subset_selection_names_payloads_not_paths
        - run: cargo test -p varve-core an_environment_must_say_where_it_sits_relative_to_the_shims
        - run: cargo test -p varve-core only_an_export_that_is_sourced_may_declare_an_environment
        - run: cargo test -p varve-core every_declared_export_is_checked_and_an_absent_one_fails
        - run: cargo test -p varve-core a_declared_sdk_environment_is_not_reported_as_a_hijack
        - run: cargo test -p varve-core one_command_sources_the_whole_environment_in_the_declared_path_order
        # THROUGH THE BINARY.
        - run: cargo test -p varve --test cli verify_checks_every_declared_export_without_being_told_to
        - run: cargo test -p varve --test cli a_declared_sdk_environment_is_not_reported_as_a_hijack_by_verify
        - run: cargo test -p varve --test cli env_enters_every_declared_environment_in_the_order_that_inverts_the_file
    links:
      - type: verifies
        target: REQ-EXPORTDECL-001
  - id: VER-SYSTEST-001
    type: verification
    title: varve self-hosts under test; the OCI transport has a real round-trip gate
    status: verified
    release: v0.27.0
    tags: [system-test, methodology]
    fields:
      method: automated-test
      baseline: >
        REQ-SYSTEST-001, clause by clause. Clause 1 (self-hosting): the
        `systest` workflow deposits varve's OWN Cargo.lock — 250 registry
        packages, 14 names at more than one version — as kind="crate"
        payloads, installs, verifies (including `--lockfile` agreement with
        the real lock), exports, and builds the varve workspace OFFLINE with
        an isolated EMPTY CARGO_HOME, through both adapters claiming a Cargo
        build. A negative control re-runs the offline build without the
        export wiring and requires it to FAIL, so a leak in the isolation
        cannot green the gate. On first contact the gate reproduced varve#73
        immediately: `export-cargo` FAILED at resolution while
        `export-crates-vendor` passed — the defect the one-crate
        cargo_offline fixture could not see by construction, and the reason
        REQ-CRATEIDX-001 exists. That fix landed in this same release.
        .
        The gate then went red for a SECOND reason, found by clean-room
        review: REQ-REPRO-001 made the exported registry/vendor paths
        relative, and selfhost.sh copied only `.cargo/config.toml` into the
        consumer, so both adapters failed on a path that resolved against a
        directory nothing had been carried into. A cross-workstream
        regression — the repro branch invalidated the systest branch's
        script, and the merge never re-ran it. The script now copies the
        whole export.
        .
        Re-run locally 2026-08-19 AFTER both fixes, and this is the first run
        in which clause 1 has actually been demonstrated: BOTH adapters
        PASS end to end, each with its negative control red as required
        (`selfhost[export-crates-vendor]: PASS`,
        `selfhost[export-cargo]: PASS`). The export-cargo job is no longer
        skip-neutral — repo variable VARVE_SYSTEST_EXPORT_CARGO is set, so it
        runs and is the proof the adapter stays fixed. Clause 2 (a system
        gate per transport): the OCI round trip (varve#62) runs a REAL
        registry (sha256-pinned zot) and pushes the deposited layout with a
        STANDARD client (oras, the documented `varve docs deploy` recipe),
        then `varve install --from oci+http://…` into a fresh core, `varve
        verify`, and `varve status` (the baseline line-status travelled).
        Run locally 2026-08-19: PASS, 250 payload blobs round-tripped. The
        Bazel --distdir gate (varve#27) and the ten-persona docs audit are
        clause-2 obligations NOT yet covered here. Clause 3: both
        deliberately-small fixtures now declare in their headers exactly
        what a one-crate graph cannot exercise (dependency resolution,
        feature resolution, multiple versions of one name, build scripts,
        proc macros) and point at the self-hosting gate for the real claim.
        Clause 4 is policy: the machinery exists (a new Cargo adapter is one
        selfhost.sh invocation in systest.yml), but nothing mechanically
        blocks an adapter shipping without one — enforcement stays with
        review.
      steps:
        # Clause 1 — both Cargo adapters are wired into the self-host gate.
        - run: grep -q "selfhost.sh export-crates-vendor" .github/workflows/systest.yml
        - run: grep -q "selfhost.sh export-cargo" .github/workflows/systest.yml
        # The isolation and its negative control are in the script itself.
        - run: grep -q "cargo build --workspace --offline --locked" tools/systest/selfhost.sh
        - run: grep -q "negative control" tools/systest/selfhost.sh
        # The spec generator refuses to regress into a toy fixture.
        - run: grep -q "realistic-scale floor" tools/systest/gen-crate-deposit-spec.py
        # Clause 2 — the OCI round trip is a workflow job, not a recipe.
        - run: grep -q "oci-roundtrip.sh" .github/workflows/systest.yml
        - run: grep -q "oci+http://" tools/systest/oci-roundtrip.sh
        # Clause 3 — the small fixtures declare their scope. cargo_offline.rs
        # no longer carries a "CANNOT exercise" disclaimer because it is no
        # longer a small fixture: v0.27.0 rebuilt it as a REAL GRAPH, so the
        # honest assertion is that it says so. This step cited the deleted
        # disclaimer and was RED while `rivet check verification-evidence`
        # stayed green — that gate resolves cargo-test filters, not greps, so
        # it could not see it (found by clean-room review).
        - run: grep -q "REAL GRAPH" crates/varve-core/tests/cargo_offline.rs
        - run: grep -q "CANNOT exercise" crates/varve-core/tests/corrosion_offline.rs
        # The scripts parse (the jobs run them verbatim).
        - run: bash -n tools/systest/selfhost.sh
        - run: bash -n tools/systest/oci-roundtrip.sh
        - run: bash -n tools/systest/lib.sh
        - run: python3 -m py_compile tools/systest/gen-crate-deposit-spec.py
    links:
      - type: verifies
        target: REQ-SYSTEST-001

  - id: VER-SYSTEST-002
    type: verification
    title: The layer assembler is exercised end to end, without publishing
    status: verified
    release: v0.28.0
    method: test
    fields:
      description: >
        REQ-SYSTEST-002 clause by clause. The producer pipeline — the workflow
        that assembles the official signed layer — previously had NO test and
        was exercised only by dispatching it against the real GHCR registry.
        That is where the 2026.08.3 deposit failed, on a bug a seventeen-check
        CI gate including a twenty-nine-minute mutation run could not have
        caught, because nothing in CI executed that workflow (varve#95).
        .
        Clause 1: the assembler was EXTRACTED from deposit-layer.yml's inline
        run-block into tools/build-deposit-spec.sh, and the workflow now calls
        it. This matters more than it looks: a gate that re-implements the
        logic tests a COPY, which is the same lie as stubbing. The production
        path and the tested path are now the same file.
        .
        Clause 2: the gate covers every shape that has broken or would be
        dangerous — a repo appearing in BOTH lists (the bug that shipped), a
        per-platform vsix set, a portable one, a binary rename, raw
        per-platform binaries, a tool missing an asset for one platform, and
        a repo requested at TWO versions, which must be refused because
        otherwise one release's assets are checked against another release's
        sums.
        .
        Clause 3: the spec is asserted to parse and to deposit; the run stops
        before `oras push`, because publishing is not what needs testing.
        .
        Clause 4 is the reason this record exists. A pre-flight that stubs the
        component under test is not coverage: the dry-run that preceded the
        failed deposit stubbed `verify_release` and `asset_sha` — exactly the
        function that broke — and reported success. Here the seam is the
        external SERVICE (gh, cosign) and not the component: every line of the
        assembler executes against a recorded asset inventory, hermetically,
        with no network and no dependence on a release still existing.
        .
        The gate carries its own mutation: it deletes the idempotence guards
        from a COPY of the assembler and requires red on the real
        "already exists" message, refusing to run at all if the guards move or
        are reworded. A gate nobody watches fail rots into a rubber stamp.
        .
        Declared scope, per REQ-SYSTEST-001 clause 3: the fixture asset BYTES
        are stand-ins, so nothing here claims anything about the shipped
        tools; and the cosign double checks bundle-to-blob binding, identity
        regexp and issuer — the assembler's responsibilities — not sigstore
        signatures, which would need the network the gate must not depend on.
      steps:
        # The gate itself, exactly as CI invokes it.
        - run: bash tools/systest/deposit-layer.sh
        # The assembler is a real file the workflow calls, not a copy.
        - run: grep -q "tools/build-deposit-spec.sh" .github/workflows/deposit-layer.yml
        - run: test -x tools/build-deposit-spec.sh
        # The job is wired in.
        - run: grep -q "deposit-layer.sh" .github/workflows/systest.yml
        # The scripts parse (CI runs them verbatim).
        - run: bash -n tools/build-deposit-spec.sh
        - run: bash -n tools/systest/deposit-layer.sh
        - run: python3 -m py_compile tools/systest/assert-deposit-spec.py
    links:
      - type: verifies
        target: REQ-SYSTEST-002
