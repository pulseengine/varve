  - id: VER-REVIEW-v0.15.0
    type: verification
    title: v0.15.0 scope independently reviewed by a refute-framed clean-room reviewer
    status: verified
    release: v0.15.0
    tags: [independence, review]
    fields:
      method: review
      baseline: >
        VERDICT pass. Reviewer: clean-room agent (general-purpose, fresh
        context, refute-framed), 2026-08-12, over the feat/v0.15.0 tree. It
        re-ran every suite itself (127 lib, 1 cargo_offline, 34 CLI) AND ran an
        independent tamper experiment — an --offline build against a registry
        with a WRONG cksum, which Cargo rejected ("failed to verify the
        checksum") — proving the offline oracle is non-vacuous. All five
        refutations failed: (a) kind stamping leaves tool-layer digests
        byte-identical and install/verify never consult kind; (b) the index
        cksum is the signature-anchored sha256 and export_cargo verifies the
        layer trust-first; (c) the offline build is real; (d) version-guard
        gates the whole release via the needs-chain; (e) the index dedup does
        not false-prefix-match adjacent versions. Two minor gaps were fixed in
        response before release: the "unknown kind refused" claim was narrowed
        to its true scope (deposit + kind-consuming exports; install is
        kind-agnostic for forward-compat), and export_cargo now re-hashes the
        on-disk bytes against the signed digest itself rather than relying on
        Cargo's checksum as the only tie.
    links:
      - type: verifies
        target: REQ-KIND-001
      - type: verifies
        target: REQ-CRATE-001
      - type: verifies
        target: REQ-RELVER-001

  - id: VER-UPDATE-002
    type: verification
    title: A wrong version string degrades to a no-op instead of an update loop
    status: verified
    release: v0.15.1
    fields:
      method: automated-test
      steps:
        # The pure identity anchor.
        - run: cargo test -p varve-core a_wrong_version_string_does_not_force_an_update_when_the_bytes_match
        # The behavioral claim, end-to-end through a release-API double: a
        # mis-reported version resolves to AlreadyCurrent (no loop), differing
        # bytes to Available, and an impostor is refused before being offered.
        - run: cargo test -p varve-core --test selfupdate_double a_mis_reported_version_converges_on_artifact_identity_not_a_loop
