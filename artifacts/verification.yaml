artifacts:
  # ─────────────────────────────────────────────────────────────────────
  # The right side of the V, as GRAPH rather than prose (REQ-VGATE-001).
  # One verification artifact per requirement, each naming concrete test
  # functions in `fields.steps[].run` — the shape `rivet check
  # verification-evidence` mechanically audits against the Rust sources,
  # so a renamed or deleted test goes red instead of leaving a
  # requirement silently "verified". Source markers (// rivet: verifies)
  # remain the fine-grained per-test map; these artifacts are the
  # graph-level closure the org's requirement-verification rule counts.
  # ─────────────────────────────────────────────────────────────────────

