        (REQ-PERF-001) at HEAD 0297d1a. VERDICT: DISSENT — and it was right on
        both counts. Confirmed by the reviewer: no shell remains anywhere on the
        dispatch path (zero shebangs generated; run_tool is Command::new + exec,
        never re-entering `varve run`); the pre-existing end-to-end test really
        does gate the NEW mechanism (argv[0] = .../shims/probe), and would fail
        if dispatch regressed; argv[0] could NOT be broken after a determined
        attempt (the real boundary is exact string equality against names read
        from the layer's bin/, so the derived name never reaches a Path::join);
        the benchmark numbers reproduced within noise (digest flat at
        36.9/37.2/37.1 us; name_only 73.2 us/647 us/2.49 ms) and the setup
        measures the divergence it claims. The reviewer independently measured
        the shell removal at ~4.7 ms/dispatch — our ~2.4 ms claim was
        CONSERVATIVE, not inflated.
        DISSENT rested on two real defects, both now closed. (1) REGRESSION
        INTRODUCED BY THIS CHANGE: the dispatch path used `to_string_lossy`, so
        a non-UTF-8 argument was SILENTLY corrupted where the old script had
        hard-errored — silent data loss in a tool whose premise is exactness.
        Fixed losslessly: OsString end-to-end on both the dispatch and `varve
        run` paths, with a test asserting byte-for-byte passthrough of
        b"bad\xff\xfename". (2) FALSE CLAIM SHIPPED IN DOCS: "shims do not go
        stale when varve updates itself" is false on Windows (a shim is a copy)
        and has a demonstrated ZERO differential on unix — the reviewer showed
        the old script survived an in-place self-update identically. The claim
        was DELETED rather than scoped, and the Windows consequence documented.
        Two further findings were adopted: the renamed-binary sharp edge (a copy
        called `myvarve` loses the CLI entirely — rustup behaves the same, but
        it was undocumented) is now stated in `varve docs shim`; and a
        PRE-EXISTING seam, `tools = ["/usr/bin/id"]` in a pin resolving outside
        the verified layer via Path::join, contradicting the documented
        no-fallback guarantee, is fixed as REQ-PIN-002. One finding is deferred
        with an issue: `varve env` still interpolates the store root into a live
        shell string (same class, off the dispatch path, needs a hostile
        VARVE_ROOT).
    links:
      - type: verifies
        target: REQ-SHIM-002
      - type: verifies
        target: REQ-PERF-001
      - type: verifies
        target: REQ-PIN-002

