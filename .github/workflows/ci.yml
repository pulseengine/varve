name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # varve's own discipline applied to its dependencies: the verifier version is
  # pinned, fetched by exact release, digest-checked and cosign-verified before
  # it is trusted to gate anything. Bump deliberately, in a reviewed diff.
  RIVET_VERSION: v0.32.0

jobs:
  rust:
    name: fmt · clippy · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  rivet:
    name: rivet validate · release plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: fetch rivet (pinned, digest-checked, cosign-verified)
        run: |
          set -euo pipefail
          gh release download "$RIVET_VERSION" --repo pulseengine/rivet \
            -p "rivet-$RIVET_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            -p SHA256SUMS.txt -p SHA256SUMS.txt.cosign.bundle
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity-regexp '^https://github.com/pulseengine/rivet/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          sha256sum -c <(grep "x86_64-unknown-linux-gnu" SHA256SUMS.txt)
          tar xzf "rivet-$RIVET_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          install -m 0755 rivet /usr/local/bin/rivet
          rivet --version
        env:
          GH_TOKEN: ${{ github.token }}
      - name: rivet validate
        run: rivet validate
      - name: rivet check verification-evidence (anti-rot)
        # A renamed or deleted test named in a verification artifact goes
        # red here instead of leaving a requirement silently "verified"
        # (REQ-VGATE-001).
        run: rivet check verification-evidence
      - name: claim-check
        # Load-bearing doc claims must keep their evidence (REQ-CLAIM-001).
        run: python3 tools/claim-check.py
      - name: review-check (advisory — recorded independent review)
        # REQ-INDEP-001 / DD-019: the review record IS a rivet artifact
        # (`method: review`), so `rivet validate` above already checks its
        # coherence and links. This step adds the advisory COVERAGE query —
        # which released, verified requirements still lack a review — over
        # `rivet … --format json` (no bespoke parser). A missing review only
        # WARNS; advisory at v0.x, so this step is deliberately NOT a required
        # check and does not block merge. The refute-and-block gate lands at
        # v1.0. The self-test proves the coverage logic flags an uncovered
        # release (hermetic — no rivet needed).
        run: |
          python3 tools/review-check.py --self-test
          python3 tools/review-check.py
      - name: coverage report (informational)
        run: rivet coverage || true

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.89 pinned below
        with:
          toolchain: "1.89"
      - run: cargo build --workspace --locked

  coverage:
    name: coverage (advisory evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Measure (advisory — evidence, not a gate)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  deny:
    name: cargo deny (supply-chain audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Audit dependencies (advisories, licenses, sources)
        run: cargo deny check

  corrosion:
    name: corrosion offline build (REQ-CORROSION-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Corrosion builds a varve-vendored crate offline
        # Opt-in gate (VARVE_CORROSION_TEST=1) — a REAL CMake+Corrosion build
        # compiling varve's export_vendor_dir output offline. Fetches Corrosion
        # via FetchContent, so it needs network + cmake; kept out of the
        # hermetic main test run and gated here.
        env:
          VARVE_CORROSION_TEST: "1"
        run: cargo test -p varve-core --test corrosion_offline -- --nocapture

  mutants:
    name: cargo mutants (trust-critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: mutants
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Mutate the trust-critical modules — zero survivors required
        # The org gate (REQ-MUTATE-001, rivet's mutants-cli pattern): the
        # modules that hold the trust decisions must kill every mutant.
        # The nightly workflow covers the full workspace, advisory.
        run: |
          cargo mutants --no-shuffle             -f crates/varve-core/src/rollback.rs             -f crates/varve-core/src/layer.rs             -f crates/varve-core/src/platform.rs             -f crates/varve-core/src/verify.rs             -f crates/varve-core/src/pin.rs             -f crates/varve-core/src/realm.rs
