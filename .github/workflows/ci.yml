name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # The check name must stay `fmt · clippy · test (ubuntu-latest)` — branch
    # protection matches on it, and a renamed required check can never report,
    # which blocks every merge. So the matrix carries the RUNNER separately
    # from the platform name, and the name is written out rather than derived.
    name: fmt · clippy · test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, linux, x64, rust-cpu]
          - os: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: docs coverage (every subcommand documented)
        # REQ-DOCS-001: a subcommand cannot ship undocumented. The unit test
        # enforces the same invariant; this exercises the user-facing CLI gate.
        run: cargo run -q -p varve -- docs check --coverage --strict

  rivet:
    name: rivet validate · release plan
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # rivet comes from THIS PROJECT'S PIN, not from a version number
      # written here (varve#106). It was declared in four places that
      # disagreed — twice in these workflows, once in the layer varve
      # publishes, once on whoever's PATH — and the evidence this job produces
      # never recorded which one made it.
      #
      # The varve that resolves the pin is the build from this tree, on
      # purpose: a release binary would be testing a different varve than the
      # one under review, and the pin has to be readable by the code being
      # changed or it proves nothing about it.
      #
      # This is also the only place varve dogfoods `install` against a REAL
      # published layer on every pull request.
      - name: build the varve under test
        run: cargo build --locked -p varve

      - name: resolve rivet through this project's pin
        run: |
          set -euo pipefail
          ./target/debug/varve install
          ./target/debug/varve shim install --dir "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Say WHICH layer answered, so the evidence below is attributable.
          ./target/debug/varve which rivet
          "$RUNNER_TEMP/bin/rivet" --version

      - name: rivet validate
        run: rivet validate
      - name: rivet check verification-evidence (anti-rot)
        # A renamed or deleted test named in a verification artifact goes
        # red here instead of leaving a requirement silently "verified"
        # (REQ-VGATE-001).
        run: rivet check verification-evidence
      - name: trace-gate (REQ-TRACEGATE-001)
        # `rivet validate` reports a disconnected artifact as a WARNING, among
        # 212 of them, so the one that matters is invisible. A status is a
        # claim; this makes an unsupported one fail the build.
        #
        # Evidence is a source marker OR an incoming `verifies` edge, and both
        # are real: a marker discharges a property of the CODE, an edge
        # discharges a property of the PIPELINE that no unit test can assert —
        # that fuzzing runs, that the matrix covers four platforms. Demanding a
        # marker for those would push someone to write a fake one.
        run: python3 tools/trace-gate.py

      - name: claim-check
        # Load-bearing doc claims must keep their evidence (REQ-CLAIM-001).
        run: python3 tools/claim-check.py
      - name: review-check (advisory — recorded independent review)
        # REQ-INDEP-001 / DD-019: the review record IS a rivet artifact
        # (`method: review`), so `rivet validate` above already checks its
        # coherence and links. This step adds the advisory COVERAGE query —
        # which released, verified requirements still lack a review — over
        # `rivet … --format json` (no bespoke parser). A missing review only
        # WARNS; advisory at v0.x, so this step is deliberately NOT a required
        # check and does not block merge. The refute-and-block gate lands at
        # v1.0. The self-test proves the coverage logic flags an uncovered
        # release (hermetic — no rivet needed).
        run: |
          python3 tools/review-check.py --self-test
          python3 tools/review-check.py
      - name: tracepack-check (release safety-case exports are valid)
        # REQ-TRACEPACK-001: the ReqIF (assessor-importable) + HTML exports the
        # release packs must actually produce valid evidence. Runs the same
        # `rivet export` the release does, so a regression goes red here first.
        run: python3 tools/tracepack-check.py
      - name: coverage report (informational)
        run: rivet coverage || true

  msrv:
    name: MSRV (1.89)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.89 pinned below
        with:
          toolchain: "1.89"
      - run: cargo build --workspace --locked

  coverage:
    name: coverage (advisory evidence)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Measure (advisory — evidence, not a gate)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30
      # `release.yml` collects every platform's archives with
      # download-artifact and uploads whatever lands in that directory. If the
      # action ever returns a different SHAPE — nested a directory deeper, or
      # named differently — the release publishes the wrong file set, and
      # before this nothing on a pull request had ever run it.
      #
      # Round-tripping the artifact just uploaded is a real exercise of the
      # same action at the same pin, and costs one small file.
      - name: Fetch it back — the action release.yml depends on, exercised here
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-lcov
          path: rehearsal
      - name: What came back is what went out
        run: |
          set -euo pipefail
          test -f rehearsal/lcov.info || {
            echo "::error::download-artifact did not place lcov.info where \
                  release.yml expects its archives — same action, same pin"
            ls -R rehearsal || true
            exit 1
          }
          cmp lcov.info rehearsal/lcov.info

  deny:
    name: cargo deny (supply-chain audit)
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Audit dependencies (advisories, licenses, sources)
        run: cargo deny check

  corrosion:
    name: corrosion offline build (REQ-CORROSION-001)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # The real test is 36-97s. Without a bound, a hung apt mirror held a
    # required check open indefinitely and there was nothing to end it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: corrosion
      - name: Install cmake if the runner lacks it
        # ubuntu-latest ships cmake, so the normal path is a no-op. The
        # unconditional `apt-get update` cost 13-78s on a good day and WEDGED
        # FOR OVER AN HOUR on a bad one during the v0.26.0 release, blocking the
        # tag on an external mirror rather than on anything about this code.
        run: command -v cmake >/dev/null || { sudo apt-get update && sudo apt-get install -y cmake; }
      - name: Corrosion builds a varve-vendored crate offline
        # Opt-in gate (VARVE_CORROSION_TEST=1) — a REAL CMake+Corrosion build
        # compiling varve's export_vendor_dir output offline. Fetches Corrosion
        # via FetchContent, so it needs network + cmake; kept out of the
        # hermetic main test run and gated here.
        env:
          VARVE_CORROSION_TEST: "1"
        run: cargo test -p varve-core --test corrosion_offline -- --nocapture

  keydisk:
    name: no signing key on disk (REQ-NOKEYDISK-001)
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `docs ci` names `echo "$SECRET" > key.tmp` as the thing adopters
      # wrongly invent, and `docs root-ceremony` says the key must reach varve
      # through a file descriptor. This repository's own deposit workflow wrote
      # it to a predictable /tmp path on a shared runner for every layer it
      # published, and an assessor found that by reading the repo rather than
      # the docs. A rule the publisher does not follow is not evidence, so the
      # rule is mechanical from here.
      # Prove the gate can go red BEFORE trusting it green -- the controls
      # include the exact line this repository shipped.
      - name: Negative control — the gate must reject what it exists to reject
        run: tools/no-key-on-disk.sh --self-test
      - name: Refuse a workflow that writes key material to a file
        run: tools/no-key-on-disk.sh

  mutants:
    # Named from the shard alone. Without an explicit name GitHub appends every
    # matrix value, so the check was called "cargo mutants (trust-critical
    # gate) (varve-producer, -f crates/varve-producer/src/asset.rs \ -f c…" —
    # a 400-character string. That is not merely ugly: branch protection
    # matches required checks BY NAME, so a check whose name absorbs its inputs
    # stops matching the rule that required it, and the gate quietly becomes
    # optional the next time the file list changes.
    name: cargo mutants (${{ matrix.shard }})
    # MEASURED, then reverted. These five shards moved to the pool with the
    # rest of the gates and it made them worse, because they are the one job
    # shape a shared host cannot absorb: 21-39 minutes each, five wide, and
    # memory-hungry. Serialised two at a time they span 64 minutes at best and
    # HOURS when more than one PR is open — one shard never got a runner at
    # all, sat queued for 3h39m and was cancelled, which the aggregator
    # correctly refused to read as a pass.
    #
    # A hosted runner gives each shard its own VM, so the five run at once and
    # the matrix costs about as long as its slowest member. The fast gates stay
    # on the pool, where they start in seconds instead of queueing 30-70
    # minutes; this is the split the measurements support, not a retreat from
    # it.
    runs-on: ubuntu-latest
    # SHARDED, not shortened. The v0.31.0 run found 705 mutants across 28 files
    # and was cancelled at the 60-minute limit — which is the failure this job's
    # previous comment warned about: a gate that times out is indistinguishable
    # from a gate that fails, and the wrong lesson to draw from a red timeout is
    # "drop a file from the list". A timeout does not report a survivor; it
    # reports nothing, so zero-survivor goes UNVERIFIED while the check looks
    # like it ran.
    #
    # So the list grows and the job splits. Each shard carries one crate's
    # modules and runs the whole workspace's lib tests as its kill criteria, so
    # sharding changes how long the gate takes and not what it proves.
    # 60 minutes was enough while every shard had a hosted VM to itself. It is
    # not enough when they share one host: `varve-producer` (519 mutants) was
    # cancelled at exactly 60:00 on this job's first run against the pool.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # SPLIT AGAIN at v0.33.0. Adding consumer.rs took the single
          # varve-core shard from ~57 minutes to a CANCELLATION at exactly
          # 60:16 — the same failure the comment above describes, arriving the
          # same way: not as a survivor, but as a check that reported nothing
          # while looking like it ran. Splitting is the response the comment
          # prescribes; raising the timeout would buy one release and hide the
          # next one. REQ-MUTATE-003 will grow this list further, so the shape
          # has to be one that keeps splitting.
          - shard: varve-core (trust)
            files: >-
              -f crates/varve-core/src/verify.rs
              -f crates/varve-core/src/pin.rs
              -f crates/varve-core/src/realm.rs
              -f crates/varve-core/src/resolve.rs
              -f crates/varve-core/src/consumer.rs
              -f crates/varve-core/src/mutationscope.rs
              -f crates/varve-core/src/install.rs
              -f crates/varve-core/src/selfverify.rs
              -f crates/varve-core/src/reverify.rs
          # SPLIT AGAIN at v0.35.0, and the third time this job has said the
          # same thing. REQ-LAYERDOCS-001 added four files to `varve-core
          # (trust)` — manifestversions, docsexport, and the viewer's two — and
          # it went to 296 mutants and was KILLED at 23 minutes (exit 143),
          # under a 60-minute cap. So this one was not even the timeout: the
          # shard had grown enough to be terminated on resources, which reports
          # nothing in exactly the same way a cancellation does.
          #
          # The comment above still applies verbatim, including its warning
          # against the tempting fix. Dropping a file would leave it ungated;
          # raising the cap would not have helped, because the cap was not what
          # was reached. Splitting is the only response that keeps what the
          # gate proves unchanged.
          #
          # Grouped so the name means something: the documentation payload,
          # end to end — what varve-core decides about a document, and what the
          # viewer does with one.
          - shard: docs payload
            files: >-
              -f crates/varve-core/src/manifestversions.rs
              -f crates/varve-core/src/docsexport.rs
              -f crates/varve-serve/src/http.rs
              -f crates/varve-serve/src/docs.rs
          # SPLIT AGAIN at v0.34.0, BEFORE it cancelled rather than after.
          # `varve-core (layers)` finished at 54m46s against the 60-minute cap —
          # five minutes of headroom, on the shard that WAS cancelled at 60:16
          # two releases ago. REQ-MUTATE-003 declares 22 files `not-yet`, and
          # every one of them lands in a shard when it is gated, so the next
          # addition here would have re-run that cancellation.
          #
          # Waiting for it would have cost more than splitting: a cancelled
          # shard does not report a survivor, it reports NOTHING, so
          # zero-survivor goes unverified while the check looks like it ran.
          # That is the failure this job has now produced twice.
          #
          # Split by size, which is the only proxy available — mutant count and
          # test time are not knowable before the run. Roughly 2.9k vs 3.1k
          # lines, grouped so each shard's name means something.
          - shard: varve-core (export)
            files: >-
              -f crates/varve-core/src/sdkexport.rs
              -f crates/varve-core/src/exportstamp.rs
              -f crates/varve-core/src/compose.rs
              -f crates/varve-core/src/platform.rs
          - shard: varve-core (lines)
            files: >-
              -f crates/varve-core/src/layerspec.rs
              -f crates/varve-core/src/rollback.rs
              -f crates/varve-core/src/mirror.rs
              -f crates/varve-core/src/support.rs
              -f crates/varve-core/src/layer.rs
          - shard: varve-producer
            files: >-
              -f crates/varve-producer/src/asset.rs
              -f crates/varve-producer/src/scan.rs
              -f crates/varve-producer/src/nextlayer.rs
              -f crates/varve-producer/src/docs.rs
              -f crates/varve-producer/src/cli.rs
              -f crates/varve-producer/src/attestation.rs
              -f crates/varve-producer/src/binfmt.rs
              -f crates/varve-producer/src/carryforward.rs
              -f crates/varve-producer/src/deposit.rs
              -f crates/varve-producer/src/extract.rs
              -f crates/varve-producer/src/forge.rs
              -f crates/varve-producer/src/gh.rs
              -f crates/varve-producer/src/immutable.rs
              -f crates/varve-producer/src/ingest.rs
              -f crates/varve-producer/src/orchestrate.rs
              -f crates/varve-producer/src/plan.rs
              -f crates/varve-producer/src/registry.rs
              -f crates/varve-producer/src/source.rs
              -f crates/varve-producer/src/spec.rs
              -f crates/varve-producer/src/stage.rs
              -f crates/varve-producer/src/sums.rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: mutants-${{ matrix.shard }}
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Mutate the trust-critical modules — zero survivors required
        # The org gate (REQ-MUTATE-001, rivet's mutants-cli pattern): the
        # modules that hold the trust decisions must kill every mutant.
        # The nightly workflow covers the full workspace, advisory.
        #
        # `-j 4` matches a hosted runner's cores, which this job owns for the
        # duration. `--timeout 120` below is what separates a HANG from a slow
        # test, and it can only mean that on a machine that is not thrashing —
        # which is the other reason these shards belong on a dedicated VM.
        env:
          FILES: ${{ matrix.files }}
        run: |
          set -euo pipefail
          # A SURVIVOR and a HANG are opposite facts and the exit code conflates
          # them: cargo-mutants exits 3 for "some mutants timed out" whether or
          # not anything survived. A survivor is a mutant nothing noticed. A
          # hang is a mutant the suite DID notice, by never finishing under it —
          # `pad_end += 1` neutralised to `*=` never grows, so the scan loop runs
          # forever. No timeout budget fixes non-termination, and no test can be
          # written that makes an infinite loop terminate.
          #
          # So: `--timeout 120` first, against a lib suite that runs in about a
          # second. That makes "slow" an implausible explanation for a timeout,
          # which is the only reason to distrust one — a survivor could otherwise
          # hide behind a test that was merely slow.
          #
          # Then the verdict comes from the SUMMARY, not the exit code: any
          # missed mutant fails. A run with no summary line also fails, because
          # a gate that cannot find its own result must not report success.
          set +e
          # A per-process address-space cap is MANDATORY on the `lean-mem`
          # class (org runbook, rivet docs/ci-runners.md) and it is also the
          # answer to this job's own history: shard `varve-core (trust)` was
          # KILLED at 23 minutes with exit 143 under a 60-minute cap — not a
          # timeout, a resource termination, which reports nothing in exactly
          # the way a cancellation does. cargo-mutants can produce a mutant
          # that allocates without bound (neutralise the `+= 1` in a loop that
          # also pushes, and the Vec grows forever), and an OOM kill takes the
          # whole job with no summary, so the gate cannot tell "nothing
          # survived" from "nothing ran".
          #
          # 48 GiB of RLIMIT_AS, matching rivet's `ulimit -v 50331648`: the
          # runaway MUTANT dies on an allocation failure, the run continues,
          # and that mutant is reported. Defence in depth alongside the host
          # cgroup's MemoryMax.
          ulimit -v 50331648
          # shellcheck disable=SC2086 -- FILES is a deliberate flag list
          cargo mutants --no-shuffle -j 4 --timeout 120 $FILES 2>&1 | tee mutants.log
          set -e
          SUMMARY="$(grep -E '[0-9]+ mutants tested' mutants.log | tail -1 || true)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::cargo-mutants produced no summary — the gate did not run"
            exit 1
          fi
          echo "::notice::$SUMMARY"
          MISSED="$(printf '%s' "$SUMMARY" | grep -oE '[0-9]+ missed' | grep -oE '[0-9]+' || echo 0)"
          if [ "$MISSED" -ne 0 ]; then
            echo "::error::$MISSED mutant(s) SURVIVED — a change nothing noticed"
            exit 1
          fi
          if printf '%s' "$SUMMARY" | grep -q 'timeout'; then
            echo "::warning::$SUMMARY — timed-out mutants are ones the suite \
          never finished under, which is detection, not silence. Named above."
            grep 'TIMEOUT' mutants.log || true
          fi

  # The name the branch ruleset requires. It must not move when the gate is
  # resharded, so it lives on a job that does no work and only reports.
  #
  # This is not hypothetical tidiness. Sharding the gate renamed its checks from
  # `cargo mutants (trust-critical gate)` to one name per shard, and the ruleset
  # still required the old name — a check that no longer existed, so it could
  # never report and nothing could merge. That failed closed, which was luck:
  # the same mistake made while REMOVING a shard would leave a required check
  # that passes without testing anything.
  #
  # With an aggregator the required name is stable by construction, and adding
  # or splitting shards is a change to `needs:` rather than to a protection rule
  # nobody remembers to update.
  mutants-gate:
    name: cargo mutants (trust-critical gate)
    needs: [mutants]
    if: always()
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - name: Every shard must have passed
        env:
          RESULT: ${{ needs.mutants.result }}
        run: |
          set -euo pipefail
          echo "shard result: $RESULT"
          # `success` only. A skipped or cancelled matrix is NOT a pass — a
          # cancelled shard is how a 60-minute timeout previously reported
          # nothing at all, and this gate exists to be believed.
          if [ "$RESULT" != "success" ]; then
            echo "::error::the mutation gate did not pass (result: $RESULT)"
            exit 1
          fi

  proofs:
    name: SMT obligations (ordeal, certificate-checked)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install ordeal (the solver varve itself distributes)
        run: cargo install --locked ordeal --version 0.14.0
      - name: Discharge the obligations, and prove the gate can go red
        # REQ-PROOF-001. Every proofs/*.smt2 declares the verdict it expects.
        # unsat = an obligation with no counterexample, returned only after
        # ordeal's checker validated an LRAT certificate. sat = a NEGATIVE
        # CONTROL: the same obligation against a deliberately wrong predicate,
        # which must still be refutable. Without those, "all green" cannot be
        # distinguished from a solver that stopped deciding anything.
        run: python3 tools/proof-check.py
