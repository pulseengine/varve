name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page, build attestations, and
# per-target binary archives in an inconsistent state — better to queue
# than abort. Mirrors the pulseengine/synth release workflow (the
# canonical Track A implementation per release-artifact-pipeline).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose initial run failed partway. The tag
  # must already exist; this does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Version guard (REQ-RELVER-001) ────────────────────────────────────
  # A released binary must report the version it is tagged as. The v0.14.0
  # release shipped binaries reporting 0.13.1 because the Cargo.toml bump was
  # a manual step that got missed. This makes it mechanical: the tag and the
  # workspace version must agree, or nothing builds.
  version-guard:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Assert tag == workspace version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          TAG_VER="${VERSION#v}"
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG_VER  Cargo.toml=$CARGO_VER"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::release tag $VERSION does not match Cargo.toml version $CARGO_VER — bump the workspace version before tagging"
            exit 1
          fi

  # ── Cross-platform binary builds ──────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: version-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # MUSL, beside gnu and not instead of it (maintainer's decision,
          # 2026-09-24, pulseengine/varve#175).
          #
          # Measured 2026-09-22: every Linux binary this organisation ships is
          # dynamically linked with a GLIBC_2.39 floor — the runner image's
          # glibc, not a decision anyone made. That will not start on Ubuntu
          # 22.04, Debian 12, RHEL 9, Amazon Linux 2023, Alpine or
          # distroless-static, which is precisely the air-gapped and
          # enterprise ground varve is aimed at.
          #
          # These are what the `pulseengine` realm's layer will ingest for its
          # Linux platform keys. The gnu archives stay, because they cost one
          # matrix leg each and remain the better choice for anyone taking a
          # binary directly onto a glibc host.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build varve (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p varve

      - name: Build varve (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p varve

      # The assembler ships through this same track (REQ-PRODUCERSHIP-001).
      # A layers repository cannot deposit a layer without it, and an assembler
      # distributed less carefully than the tool it feeds would invert the
      # trust story: its digests go into SHA256SUMS.txt before cosign signs it,
      # and the build attestation covers its archive too.
      - name: Build varve-producer (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p varve-producer

      - name: Build varve-producer (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p varve-producer

      # The viewer ships through the same track, for the same reason. It is a
      # separate binary precisely so a realm can choose to carry it — and a
      # realm cannot carry what the release does not publish.
      - name: Build varve-serve (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p varve-serve

      - name: Build varve-serve (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p varve-serve

      - name: Assert built binary reports the tag version (REQ-RELVER-001)
        # The artifact-level twin of the version-guard job: run the freshly
        # built binary and confirm `--version` == the tag. This is the exact
        # oracle varve#38 asked for — a binary that mis-reports its own version
        # (as v0.14.0 did) fails the release here. Native targets only; a
        # cross-built binary cannot be executed on the runner.
        if: ${{ !matrix.cross }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          REPORTED=$("target/${{ matrix.target }}/release/varve" --version | awk '{print $2}')
          echo "tag=${VERSION#v}  binary --version=$REPORTED"
          if [ "${VERSION#v}" != "$REPORTED" ]; then
            echo "::error::built binary reports '$REPORTED' but the release tag is $VERSION"
            exit 1
          fi

      - name: Assert varve-producer reports the tag version (REQ-PRODUCERSHIP-001)
        # Same oracle as varve's. The two binaries are versioned together, and
        # a producer that mis-reports its version cannot appear in evidence
        # about which assembler built a layer.
        if: ${{ !matrix.cross }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          REPORTED=$("target/${{ matrix.target }}/release/varve-producer" --version | awk '{print $2}')
          NAME=$("target/${{ matrix.target }}/release/varve-producer" --version | awk '{print $1}')
          echo "tag=${VERSION#v}  binary --version=$NAME $REPORTED"
          if [ "$NAME" != "varve-producer" ]; then
            echo "::error::the assembler reports its name as '$NAME', not varve-producer"
            exit 1
          fi
          if [ "${VERSION#v}" != "$REPORTED" ]; then
            echo "::error::varve-producer reports '$REPORTED' but the release tag is $VERSION"
            exit 1
          fi

      - name: Assert varve-serve reports the tag version (REQ-RELVER-001)
        # Same oracle, third binary. Enumerating them here rather than trusting
        # that someone remembers is the same discipline the docs gate applies:
        # a binary that mis-reports its own version cannot appear in evidence.
        if: ${{ !matrix.cross }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          REPORTED=$("target/${{ matrix.target }}/release/varve-serve" --version | awk '{print $2}')
          NAME=$("target/${{ matrix.target }}/release/varve-serve" --version | awk '{print $1}')
          echo "tag=${VERSION#v}  binary --version=$NAME $REPORTED"
          if [ "$NAME" != "varve-serve" ]; then
            echo "::error::the viewer reports its name as '$NAME', not varve-serve"
            exit 1
          fi
          if [ "${VERSION#v}" != "$REPORTED" ]; then
            echo "::error::varve-serve reports '$REPORTED' but the release tag is $VERSION"
            exit 1
          fi

      - name: Strip binary
        if: ${{ !matrix.cross }}
        run: |
          strip "target/${{ matrix.target }}/release/varve" 2>/dev/null || true
          strip "target/${{ matrix.target }}/release/varve-producer" 2>/dev/null || true
          strip "target/${{ matrix.target }}/release/varve-serve" 2>/dev/null || true

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          # Resolve the version once: tag push -> refs/tags/vX.Y.Z;
          # workflow_dispatch -> the user-supplied tag input. Bound via
          # env: and dereferenced as $VERSION below — never expand
          # ${{ ... }} directly inside run: (command-injection vector).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="varve-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/varve" staging/
          cp README.md LICENSE staging/ 2>/dev/null || true
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          # A SEPARATE archive, deliberately. install.sh installs varve's
          # tarball, and putting a binary that fetches over the network inside
          # the archive of the tool whose "contacts no network" claim is
          # load-bearing would hand every varve user an assembler they did not
          # ask for. A layers repository downloads this one by name.
          PRODUCER="varve-producer-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging-producer
          cp "target/${TARGET}/release/varve-producer" staging-producer/
          cp LICENSE staging-producer/ 2>/dev/null || true
          tar -czf "$PRODUCER" -C staging-producer .
          echo "PRODUCER_ARCHIVE=$PRODUCER" >> "$GITHUB_ENV"

          # The viewer, in its own archive for the same reason the assembler is
          # in one: a realm carries it or it does not, and a consumer who wants
          # only the tool should not be made to take a program that listens on
          # a socket.
          VIEWER="varve-serve-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging-serve
          cp "target/${TARGET}/release/varve-serve" staging-serve/
          cp LICENSE staging-serve/ 2>/dev/null || true
          tar -czf "$VIEWER" -C staging-serve .
          echo "VIEWER_ARCHIVE=$VIEWER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: producer-${{ matrix.target }}
          path: ${{ env.PRODUCER_ARCHIVE }}
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: serve-${{ matrix.target }}
          path: ${{ env.VIEWER_ARCHIVE }}
          retention-days: 7

  # ── Create the GitHub Release: checksums, provenance, signing ─────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      # Keyless signing + provenance need an OIDC token; release-asset
      # upload needs contents: write; build provenance attestation
      # needs attestations: write.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/

      # Phase 6: CycloneDX SBOM for varve itself. Generated *before*
      # A release that ships varve without the assembler leaves every layers
      # repository unable to build a layer, and the failure appears in someone
      # else's repo hours later as a missing download (REQ-PRODUCERSHIP-001
      # clause 3). Counted per platform: a matrix leg that silently dropped its
      # producer archive is the shape this is here to catch.
      - name: Assert the assembler ships with the toolchain (REQ-PRODUCERSHIP-001)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # NOT `ls … | wc -l`. Under `set -euo pipefail` a glob that matches
          # nothing makes `ls` fail, the pipeline fail, and the step abort — so
          # the zero-producer branch below was dead code and the release failed
          # with no explanation at all. Found by a clean-room review that
          # replayed this script with synthetic asset directories; my own test
          # ran in zsh without `set -e` and printed the message happily.
          count() {
            local n=0 f
            for f in "$@"; do [ -e "$f" ] && n=$((n + 1)); done
            echo "$n"
          }
          varve_n=$(count release-assets/varve-"${VERSION}"-*.tar.gz)
          prod_n=$(count release-assets/varve-producer-"${VERSION}"-*.tar.gz)
          echo "varve archives=$varve_n  varve-producer archives=$prod_n"
          if [ "$prod_n" -eq 0 ]; then
            echo "::error::this release ships no varve-producer archive; a layers \
          repository has nothing to assemble a layer with"
            exit 1
          fi
          if [ "$prod_n" -ne "$varve_n" ]; then
            echo "::error::$varve_n varve archives but $prod_n varve-producer \
          archives — a build leg dropped its assembler"
            exit 1
          fi
          # Same count, same reasoning, for the viewer. A realm can only carry
          # what the release published, and a matrix leg that quietly dropped
          # one platform's archive would leave the layer unbuildable on that
          # platform with nothing here saying so.
          serve_n=$(count release-assets/varve-serve-"${VERSION}"-*.tar.gz)
          echo "varve-serve archives=$serve_n"
          if [ "$serve_n" -ne "$varve_n" ]; then
            echo "::error::$varve_n varve archives but $serve_n varve-serve \
          archives — a build leg dropped the viewer"
            exit 1
          fi

      # BEFORE the SBOM steps, and that ordering is load-bearing: `cargo
      # cyclonedx` writes crates/<name>/<name>.cdx.json INTO THE WORKING TREE,
      # and `cargo package` then refuses — "1 files in the working directory
      # contain changes that were not yet committed into git". That is exactly
      # the right refusal: a dirty tree would package bytes that are not the
      # tag's, so `--allow-dirty` would buy a green run by giving up the
      # property this asset exists for. v0.36.0's first Release run died here,
      # after crates.io had already published.
      # The crates this release publishes, as release assets (REQ-CRATEPAYLOAD-001
      # clause 4). The pulseengine layer ingests varve-core from HERE, not from
      # crates.io, so a crate is proven by cosign over SHA256SUMS.txt like every
      # other payload instead of acquiring a second trust path. Before the sums,
      # for the same reason as the SBOM.
      #
      # Named crates, never --workspace: that would also package varve-producer
      # and varve-serve, which are publish = false. --no-verify because the
      # publish job verifies the same bytes — `cargo package` is reproducible,
      # which the crate-identity job below re-checks on every tag.
      - name: Package the published crates
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          cargo package --locked --no-verify -p varve-core -p varve
          for c in varve-core varve; do
            f="target/package/${c}-${BARE}.crate"
            if [ ! -f "$f" ]; then
              echo "::error::cargo package produced no $f"
              exit 1
            fi
            cp "$f" release-assets/
          done
          ls -la release-assets/*.crate

      # Each published crate's API documentation, as a `rustdoc` docs payload a
      # layer can carry beside the crate (REQ-LAYERDOCS-001). Before the sums,
      # so the signature covers it.
      #
      # tar.gz, not zip. Measured 2026-09-17: varve and varve-core document to
      # 16 MB in 811 files, 3.7 MB compressed, and decompressing all of it takes
      # about 10 ms — varve-serve does that once at start. Zip's random access
      # pays off for a document of hundreds of megabytes; at this size it would
      # only add a dependency to a verification binary.
      #
      # One archive per crate, each built in its own target directory: target/doc
      # is shared, so a second `cargo doc` would sweep the first crate's pages
      # into its tarball. The entry is checked here because a layer.toml will
      # declare it, and a missing entry is otherwise found by a deposit in
      # someone else's repository.
      # SHA256SUMS so its digest is captured in the checksum manifest;
      # the cosign signature over SHA256SUMS.txt transitively covers it.
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate toolchain SBOM (CycloneDX)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` package-selection
          # flag; use --manifest-path to target the varve CLI crate — the
          # generated SBOM lands next to that Cargo.toml.
          cargo cyclonedx \
            --manifest-path crates/varve/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="crates/varve/varve.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find crates/varve -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "release-assets/varve-${BARE}.cdx.json"
          echo "::notice::Toolchain SBOM written to release-assets/varve-${BARE}.cdx.json"

          # The assembler gets its own SBOM (REQ-PRODUCERGET-001 clause 3).
          # v0.31.0 shipped one SBOM covering pkg:cargo/varve — 172 components,
          # none of them varve-producer — so anyone with an SBOM-ingest
          # requirement got nothing for a binary they were being told to run.
          # It is a different dependency set (it links sha2, hex and clap that
          # varve's CLI crate does not pull the same way), so one SBOM cannot
          # stand for both.
          cargo cyclonedx \
            --manifest-path crates/varve-producer/Cargo.toml \
            --format json \
            --spec-version 1.5
          PROD_SBOM="crates/varve-producer/varve-producer.cdx.json"
          if [ ! -f "$PROD_SBOM" ]; then
            PROD_SBOM=$(find crates/varve-producer -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$PROD_SBOM" && test -f "$PROD_SBOM"
          cp "$PROD_SBOM" "release-assets/varve-producer-${BARE}.cdx.json"
          echo "::notice::Assembler SBOM written to release-assets/varve-producer-${BARE}.cdx.json"
          ls -la release-assets/

      - name: Stage onboarding assets (trust root + canonical realms)
        run: |
          set -euo pipefail
          cp trust-roots/rolling.pub release-assets/rolling.pub
          cp varve-realms.toml release-assets/varve-realms.toml
          ls -la release-assets/

      # ── The bootstrap script (REQ-BOOTSTRAP-001) ───────────────────────
      # Staged BEFORE the checksum step on purpose: install.sh's own sha256
      # must be a line in SHA256SUMS.txt, which cosign then signs. That is
      # what makes "verify the script, then run it" possible at all — a
      # script published outside the signed sums can only ever be trusted
      # on transport, which is the thing varve exists to refuse.
      - name: Stage the install script
        run: |
          set -euo pipefail
          sh -n install.sh   # a syntax error here would ship a bricked bootstrap
          cp install.sh release-assets/install.sh
          chmod 0755 release-assets/install.sh
          ls -la release-assets/install.sh

      # cosign is installed early: the rivet fetch below verifies rivet's
      # release with cosign, and the later SHA256SUMS signing reuses it.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      # Phase 6b: the safety-case travels with the release (REQ-TRACEPACK-001).
      # rivet's own traceability, exported as queryable/assessor-importable
      # evidence — generated *before* SHA256SUMS so the signed sums (and the
      # cosign signature over them) transitively cover the safety case too.
      # rivet comes from THIS PROJECT'S PIN (varve#106). The release used to
      # name a version here and ci.yml named a different one, so the evidence
      # a release shipped and the evidence a pull request checked were produced
      # by two different tools — and neither artifact said which.
      #
      # The varve that resolves it is the one this release is building, which
      # is also the strongest possible statement the release can make: the
      # toolchain that produced the safety case was resolved by the binary
      # being shipped.
      - name: Resolve rivet through this project's pin
        run: |
          set -euo pipefail
          cargo build --locked -p varve
          export VARVE_ROOT="$RUNNER_TEMP/varve"
          echo "VARVE_ROOT=$VARVE_ROOT" >> "$GITHUB_ENV"
          ./target/debug/varve install
          ./target/debug/varve shim install
          echo "$VARVE_ROOT/shims" >> "$GITHUB_PATH"
          ./target/debug/varve which rivet
          "$VARVE_ROOT/shims/rivet" --version

      - name: Export traceability evidence (ReqIF + HTML + source artifacts)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          # ReqIF — the OMG interchange format an assessor imports directly.
          rivet export --format reqif --output "release-assets/varve-${BARE}-traceability.reqif"
          # Browsable HTML report (offline: no external fonts/CDN).
          rivet export --format html --offline --output rivet-html
          tar -czf "release-assets/varve-${BARE}-traceability-html.tar.gz" -C rivet-html .
          # The rivet source artifacts, so consumers query with rivet directly.
          tar -czf "release-assets/varve-${BARE}-rivet-artifacts.tar.gz" \
            artifacts/ claims.yaml rivet.yaml
          echo "::notice::Traceability evidence staged (ReqIF + HTML + rivet artifacts)"
          ls -la release-assets/

      # BEFORE the checksums, deliberately. It used to run after them, so the
      # one asset describing how everything else was built was the one asset
      # with no integrity binding at all — not in SHA256SUMS.txt, not an
      # attestation subject. Found by a clean-room review of v0.31.0. Same
      # ordering rule as the SBOM: anything that must be covered has to exist
      # before the sums are taken.
      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            # `cosign version | head -1` captured the first line of its ASCII
            # art banner, so build-env.txt recorded a row of underscores where
            # the version should be. --json is the machine-readable form.
            echo "cosign: $(cosign version --json 2>/dev/null | jq -r .gitVersion)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      - name: Build the API documentation (rustdoc)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          for c in varve-core varve; do
            cargo doc --no-deps --locked -p "$c" --target-dir "target/rustdoc-$c"
            doc="target/rustdoc-$c/doc"
            entry="${c//-/_}/index.html"
            if [ ! -f "$doc/$entry" ]; then
              echo "::error::rustdoc for $c has no $entry"
              exit 1
            fi
            # `*` and not `.`: rustdoc leaves a `.lock` in the doc directory,
            # and a leading `./` on every member would make the entry
            # `./varve_core/index.html` rather than the path a manifest names.
            ( cd "$doc" && tar -czf "$GITHUB_WORKSPACE/release-assets/${c}-${BARE}-rustdoc.tar.gz" * )
            # Listed to a file, not piped: `grep -q` exits at the first match,
            # tar then dies of SIGPIPE, and pipefail fails a correct archive.
            tar -tzf "release-assets/${c}-${BARE}-rustdoc.tar.gz" > "$RUNNER_TEMP/members-$c"
            if ! grep -qx "$entry" "$RUNNER_TEMP/members-$c"; then
              echo "::error::${c}-${BARE}-rustdoc.tar.gz does not contain $entry"
              exit 1
            fi
          done
          ls -la release-assets/*-rustdoc.tar.gz

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── SLSA build provenance (GitHub-native) ──────────────────────────
      # in-toto SLSA v1 provenance for every binary archive, signed
      # keyless via Sigstore and recorded in Rekor. Consumers verify with
      # `gh attestation verify <file> --repo pulseengine/varve`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "release-assets/*.tar.gz"

      # ── Sigstore keyless signing (cosign) ──────────────────────────────
      # Signs SHA256SUMS.txt so a consumer can verify the checksum file
      # itself was produced by this workflow. Verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp \
      #       'https://github.com/pulseengine/varve/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer \
      #       'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle \
      #     SHA256SUMS.txt
      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
          ls -la ./*

      # ── varve-native release signature (DD-009 / REQ-SELF-001) ─────────
      # A DSSE envelope over SHA256SUMS.txt with the PulseEngine root key,
      # so `varve self-verify` can check a release offline against the same
      # pinned root that verifies layers. Activates when the root ceremony
      # provisions the VARVE_ROOT_KEY secret (the v1.0 gate); until then the
      # step reports loudly that the asset is absent — a missing artifact is
      # visible to consumers, unlike a silently-skipped gate.
      - name: Sign SHA256SUMS with the varve root (DSSE)
        env:
          VARVE_ROOT_KEY: ${{ secrets.VARVE_ROOT_KEY }}
          VARVE_ROLLING_KEY: ${{ secrets.VARVE_ROLLING_KEY }}
        # Explicit, because the key reaches varve by process substitution and
        # that is a bash feature, not a POSIX one.
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VARVE_ROOT_KEY:-}" ]; then
            SIGNING_KEY="$VARVE_ROOT_KEY"; KEY_ID=varve-root-1
          elif [ -n "${VARVE_ROLLING_KEY:-}" ]; then
            # PROVISIONAL (REQ-UPDATE-001): the rolling root signs varve's own
            # releases until the ceremony provisions VARVE_ROOT_KEY. The
            # ceremony release will be dual-signed so old-verifies-new
            # migrates without a flag day.
            SIGNING_KEY="$VARVE_ROLLING_KEY"; KEY_ID=varve-rolling-1
            echo "::notice::release sums signed with the PROVISIONAL rolling root (ceremony pending)"
          else
            echo "::warning::no signing key provisioned — release ships without \
          SHA256SUMS.txt.dsse.json; varve self-update/self-verify will fail closed on it."
            exit 0
          fi
          cargo build --release -p varve
          # File descriptor, never a file (REQ-NOKEYDISK-001) -- see the same
          # correction in deposit-layer.yml.
          cd release-assets
          # The signing code is the same sign_release_sums the verifier
          # tests against — producer and consumer cannot drift.
          ../target/release/varve sign-sums \
            --sums SHA256SUMS.txt \
            --key <(printf '%s' "$SIGNING_KEY") \
            --key-id "$KEY_ID" \
            --out SHA256SUMS.txt.dsse.json
          ls -la SHA256SUMS.txt.dsse.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # Idempotent: re-running the workflow for an existing release
          # uploads/overwrites assets rather than failing.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading assets"
            gh release upload "$VERSION" --clobber release-assets/*
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "varve $VERSION" \
              --generate-notes \
              release-assets/*
          fi

          # The release note the TRACE produces, not the one a human
          # remembered to write. `rivet release notes` states what was
          # committed to this version, what was delivered, what was withheld,
          # and the verification evidence behind each — and it names the
          # ASPICE 11-03 elements it does NOT compute rather than leaving
          # their absence to be discovered.
          #
          # Generated here because rivet is already fetched and
          # cosign-verified above for the tracepack export, and because a note
          # pasted by hand is a note that drifts from the graph it claims to
          # summarise. GitHub's `--generate-notes` list of merged PRs stays
          # below it: one says what changed, the other says what was promised.
          if rivet release notes "$VERSION" > /tmp/rivet-notes.md 2>/dev/null; then
            BODY=$(gh release view "$VERSION" --json body -q .body)
            {
              cat /tmp/rivet-notes.md
              printf '\n---\n\n'
              printf '%s\n' "$BODY"
            } > /tmp/notes.md
            gh release edit "$VERSION" --notes-file /tmp/notes.md
          else
            echo "::warning::rivet release notes produced nothing for $VERSION — \
                  the release body carries only the commit list"
          fi

          # Surface the recorded independent-review verdict (REQ-INDEP-001,
          # DD-019) at the top of the notes, when the release carries a
          # `method: review` rivet artifact for this version. The verdict lives
          # in the rivet graph (VER-REVIEW-<version>); this is a fixed-string
          # presence check, not a parse.
          if grep -qF "id: VER-REVIEW-${VERSION}" artifacts/verification.yaml; then
            BODY=$(gh release view "$VERSION" --json body -q .body)
            {
              printf '## Independent review\n\n'
              printf 'This release'\''s scope was independently reviewed by a fresh-context clean-room reviewer (DD-019). The recorded verdict, reviewer, and findings live in the rivet graph as `VER-REVIEW-%s` (`method: review`).\n\n---\n\n' "$VERSION"
              printf '%s\n' "$BODY"
            } > /tmp/notes.md
            gh release edit "$VERSION" --notes-file /tmp/notes.md
          fi

  # ── The released crate IS the registry's crate (REQ-CRATEPAYLOAD-001) ──
  # A layer that ingests varve-core from this release is only offering the
  # crate crates.io serves if the bytes are identical. Measured identical for
  # v0.35.0 before this job existed; it is re-checked here because it rests on
  # `cargo package` staying reproducible, which a toolchain change could end.
  #
  # Compared against the index `cksum` — what cargo itself checks a download
  # against — and against the SIGNED sums, so a mismatch in either direction
  # fails. The publish runs in a separate workflow, so the index is polled.
  # Skipped when publishing is disabled: there is no registry crate to match.
  crate-identity:
    name: The released crates are the crates.io crates
    needs: [create-release]
    if: vars.CRATES_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Compare the signed release sums with the crates.io index
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            -p SHA256SUMS.txt -p SHA256SUMS.txt.cosign.bundle
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          index_path() { # sparse-index path for a crate name of 4+ chars
            echo "$(printf %s "$1" | cut -c1-2)/$(printf %s "$1" | cut -c3-4)/$1"
          }
          for c in varve-core varve; do
            signed=$(awk -v f="./${c}-${BARE}.crate" '$2 == f {print $1}' SHA256SUMS.txt)
            if [ -z "$signed" ]; then
              echo "::error::${c}-${BARE}.crate is not in the signed sums"
              exit 1
            fi
            cksum=""
            for _ in $(seq 1 40); do
              cksum=$(curl -fsS -H 'User-Agent: pulseengine-varve-release' \
                        "https://index.crates.io/$(index_path "$c")" 2>/dev/null \
                      | jq -r --arg v "$BARE" 'select(.vers == $v) | .cksum' || true)
              [ -n "$cksum" ] && break
              sleep 45
            done
            if [ -z "$cksum" ]; then
              echo "::error::$c $BARE never appeared in the crates.io index"
              exit 1
            fi
            echo "$c signed=$signed index=$cksum"
            if [ "$signed" != "$cksum" ]; then
              echo "::error::the released ${c}-${BARE}.crate is not the crate crates.io serves"
              exit 1
            fi
          done

  # ── The bootstrap actually bootstraps (REQ-BOOTSTRAP-001) ─────────────
  # `install.sh` is the one release artifact whose correctness cannot be
  # checked by a unit test: it is a shell script talking to a real release
  # over the network. So it is exercised against the release that was just
  # published, on both published OS families — happy path plus two negative
  # controls, because a verifier that cannot be made to refuse is not a
  # verifier. Runs after the release exists; a failure here does not unpublish
  # anything, it tells you the bootstrap is broken before users find out.
  verify-install-script:
    name: install.sh bootstraps on ${{ matrix.os }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Present on purpose: the happy path must exercise the cosign branch,
      # not only the sha256 one.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Happy path — the script installs the tagged binary
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VARVE_INSTALL_DIR="$RUNNER_TEMP/varve-bin" sh ./install.sh --version "$VERSION"
          REPORTED=$("$RUNNER_TEMP/varve-bin/varve" --version | awk '{print $2}')
          echo "tag=${VERSION#v}  installed --version=$REPORTED"
          if [ "${VERSION#v}" != "$REPORTED" ]; then
            echo "::error::install.sh installed $REPORTED but the release tag is $VERSION"
            exit 1
          fi
          # The docs promise `varve docs bootstrap` works on the installed binary.
          "$RUNNER_TEMP/varve-bin/varve" docs bootstrap >/dev/null

      - name: Negative control — a checksum mismatch must refuse and write nothing
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          SHIM="$RUNNER_TEMP/shim-sum"; mkdir -p "$SHIM"
          printf '#!/bin/sh\necho "deadbeef  $1"\n' > "$SHIM/sha256sum"
          printf '#!/bin/sh\nshift 2\necho "deadbeef  $1"\n' > "$SHIM/shasum"
          chmod +x "$SHIM/sha256sum" "$SHIM/shasum"
          if PATH="$SHIM:$PATH" VARVE_INSTALL_DIR="$RUNNER_TEMP/varve-neg" \
               sh ./install.sh --version "$VERSION"; then
            echo "::error::install.sh installed despite a checksum mismatch"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/varve-neg/varve" ]; then
            echo "::error::a binary was written despite a checksum mismatch"
            exit 1
          fi
          echo "refused, and wrote nothing — correct"

      - name: Negative control — an unsupported platform must refuse, not guess
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          SHIM="$RUNNER_TEMP/shim-uname"; mkdir -p "$SHIM"
          printf '#!/bin/sh\ncase "$1" in -s) echo OpenBSD;; -m) echo riscv64;; esac\n' > "$SHIM/uname"
          chmod +x "$SHIM/uname"
          if PATH="$SHIM:$PATH" VARVE_INSTALL_DIR="$RUNNER_TEMP/varve-neg2" \
               sh ./install.sh --version "$VERSION"; then
            echo "::error::install.sh guessed a triple for an unsupported platform"
            exit 1
          fi
          echo "refused an unsupported platform — correct"
