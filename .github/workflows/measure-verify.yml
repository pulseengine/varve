name: measure-verify

# One-off measurement for REQ-VERIFYPAR-001 clause 1: `varve verify --timing`
# on a runner with a COLD page cache, so the read/hash split is a measurement
# and not a guess. Runs on pushes to measure/** branches and on demand; it is
# never a PR gate and holds no required check.
#
# Deliberately a GitHub-hosted runner: the self-hosted rust-cpu pool has an
# unknown cache, disk and CPU, and drop_caches needs passwordless sudo.

on:
  push:
    branches: ['measure/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: verify cold-cache attribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build
        run: cargo build --release -p varve -p varve-producer
      - name: measure
        env:
          VARVE_BIN: ${{ github.workspace }}/target/release/varve
          VARVE_PRODUCER_BIN: ${{ github.workspace }}/target/release/varve-producer
          SUMMARY: ${{ runner.temp }}/verify-summary.txt
          WORK_DIR: ${{ runner.temp }}/verify-work
        run: bash tools/measure/verify-cold.sh
      - name: step summary
        if: always()
        env:
          SUMMARY: ${{ runner.temp }}/verify-summary.txt
        run: |
          if [ -f "$SUMMARY" ]; then
            { echo '```'; cat "$SUMMARY"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no summary was produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verify-cold-summary
          path: ${{ runner.temp }}/verify-summary.txt
          if-no-files-found: warn
