# Publish the workspace's crates on a v* tag, using crates.io **Trusted
# Publishing** (OIDC) rather than a long-lived API token — the same shape as
# pulseengine/sigil's publish-to-crates-io.yml.
#
# Why not a token: v0.26.0's first publish attempt failed with
# "CARGO_REGISTRY_TOKEN is not provisioned", and the local fallback then failed
# 403 on a stale stored credential. A token is a secret that expires silently,
# has to exist in every repo, and is exactly the long-lived credential varve's
# own threat model argues against elsewhere. OIDC mints a short-lived one per
# run and there is nothing to leak or rotate.
name: "Publish to crates.io"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  # Publish or backfill against a chosen ref without cutting a new tag.
  workflow_dispatch:

jobs:
  publish:
    # Gated by the repo variable CRATES_PUBLISH_ENABLED. When it is unset the
    # job SKIPS (neutral) instead of failing red — sigil's lesson, and one this
    # repo has now learned the hard way: a perpetually-red publish job is a
    # dead signal, not a gate. Re-running is safe: each crate is skipped when
    # that exact name@version is already on crates.io.
    if: github.repository == 'pulseengine/varve' && vars.CRATES_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # The guards that made the v0.26.0 failure legible. Keep them BEFORE the
      # auth exchange: a version disagreement should stop the run without ever
      # minting a token.
      - name: The tag, the workspace and the internal dep must agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          WS=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          DEP=$(grep -m1 'varve-core = { path' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "tag=$TAG workspace=$WS internal-dep=$DEP"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$TAG" != "$WS" ]; then
            echo "::error::tag $TAG does not match workspace version $WS"; exit 1
          fi
          if [ "$DEP" != "$WS" ]; then
            echo "::error::varve depends on varve-core $DEP but the workspace is $WS; cargo package embeds the dep version, so these must agree"; exit 1
          fi

      # Exchanges the GitHub OIDC token for a short-lived crates.io token.
      # No secret is stored anywhere.
      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish varve-core, then varve
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          publish() { # crate
            if curl -fsS -o /dev/null -H 'User-Agent: pulseengine-varve-release' \
                 "https://crates.io/api/v1/crates/$1/${VERSION}"; then
              echo "::notice::$1 ${VERSION} is already on crates.io; skipping"
            else
              cargo publish -p "$1" --locked
            fi
          }
          # Order is load-bearing: varve depends on varve-core by version, so
          # the dependency must exist in the index first.
          publish varve-core
          publish varve

      - name: Prove it installs
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cargo install varve --version "$VERSION" --locked --root "$RUNNER_TEMP/ci"
          "$RUNNER_TEMP/ci/bin/varve" --version | grep -q "$VERSION"
