name: Publish to crates.io

# The third bootstrap route (REQ-BOOTSTRAP-001): `cargo install varve` on any
# target Rust supports, including the ones with no release archive. It is a
# SOURCE build and therefore carries none of the release signature — the docs
# say so plainly (`varve docs bootstrap`); this workflow exists so the route
# exists at all, not so it can be recommended over the signed one.
#
# Serialized per tag and never cancelled: a run cancelled between the two
# publishes leaves `varve` on crates.io depending on a `varve-core` that is
# not there, which cannot be undone (crates.io versions are immutable).
concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose publish failed partway. Idempotent: a
  # version already on crates.io is skipped, not re-pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.26.0)"
        required: true
        type: string
      dry_run:
        description: "Package and verify only; publish nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish varve-core, then varve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # ── Guards, before anything irreversible ─────────────────────────────
      # crates.io versions cannot be yanked back into non-existence. Every
      # check that can be made before the first `publish` is made here.
      - name: Assert tag, workspace version, and the internal dep all agree
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          TAG_VER="${VERSION#v}"
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # `varve` depends on `varve-core` by version, not only by path —
          # a path-only dep cannot be published at all. That version is a
          # SECOND place the number lives, so it is asserted, not trusted.
          DEP_VER=$(sed -n 's/^varve-core = { path = "crates\/varve-core", version = "\(.*\)" }$/\1/p' Cargo.toml | head -1)
          echo "tag=$TAG_VER  workspace=$CARGO_VER  varve-core dep=$DEP_VER"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::tag $VERSION does not match the workspace version $CARGO_VER"
            exit 1
          fi
          if [ "$DEP_VER" != "$CARGO_VER" ]; then
            echo "::error::[workspace.dependencies] varve-core = \"$DEP_VER\" but the workspace version is $CARGO_VER — publishing would point varve at the wrong varve-core"
            exit 1
          fi
          echo "VERSION=$CARGO_VER" >> "$GITHUB_ENV"

      - name: Assert the crates carry the metadata crates.io requires
        run: |
          set -euo pipefail
          # A missing `description` or `license` is rejected by crates.io at
          # upload — i.e. AFTER varve-core is already published, leaving the
          # pair half-shipped. Fail here instead.
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/meta.json"
          python3 - "$RUNNER_TEMP/meta.json" <<'PY'
          import json, sys
          meta = json.load(open(sys.argv[1]))
          want = ["description", "license", "repository", "readme",
                  "keywords", "categories"]
          bad = []
          for name in ("varve", "varve-core"):
              pkgs = [p for p in meta["packages"] if p["name"] == name]
              if not pkgs:
                  bad.append(f"{name}: not in the workspace")
                  continue
              for field in want:
                  if not pkgs[0].get(field):
                      bad.append(f"{name}: package.{field} is missing or empty")
          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("both crates carry: " + ", ".join(want))
          PY

      - name: Package both crates (full verify build)
        run: |
          set -euo pipefail
          # varve-core stands alone, so it can be fully verified here.
          cargo package -p varve-core --locked
          # `cargo package -p varve` cannot resolve until varve-core is on the
          # index, so its verification happens in the publish step below.
          ls -la target/package/

      # ── Publish, in dependency order ─────────────────────────────────────
      - name: Publish varve-core
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not provisioned; cannot publish"
            exit 1
          fi
          if curl -fsS -o /dev/null \
               -H 'User-Agent: pulseengine-varve-release' \
               "https://crates.io/api/v1/crates/varve-core/${VERSION}"; then
            echo "::notice::varve-core ${VERSION} is already on crates.io; skipping"
          else
            cargo publish -p varve-core --locked
          fi

      - name: Wait for varve-core to be resolvable
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # `cargo publish` already blocks on index availability, but the belt
          # is cheap and the brace is unrecoverable: publishing `varve` against
          # an unresolvable `varve-core` fails the build AND burns the version.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null \
                 -H 'User-Agent: pulseengine-varve-release' \
                 "https://crates.io/api/v1/crates/varve-core/${VERSION}"; then
              echo "varve-core ${VERSION} is on the index (attempt $i)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::varve-core ${VERSION} did not appear on crates.io within 10 minutes"
          exit 1

      - name: Publish varve
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if curl -fsS -o /dev/null \
               -H 'User-Agent: pulseengine-varve-release' \
               "https://crates.io/api/v1/crates/varve/${VERSION}"; then
            echo "::notice::varve ${VERSION} is already on crates.io; skipping"
          else
            cargo publish -p varve --locked
          fi

      # ── The route the docs promise must actually work ────────────────────
      - name: Assert `cargo install varve` installs the tagged version
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # README and `varve docs bootstrap` both tell users to run this. A
          # published crate that does not install is a documented lie, and the
          # only place to catch it is here.
          cargo install varve --version "${VERSION}" --locked --root "$RUNNER_TEMP/cargo-install"
          REPORTED=$("$RUNNER_TEMP/cargo-install/bin/varve" --version | awk '{print $2}')
          echo "published=${VERSION}  cargo-installed --version=$REPORTED"
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "::error::cargo install varve produced $REPORTED, expected $VERSION"
            exit 1
          fi
          "$RUNNER_TEMP/cargo-install/bin/varve" docs bootstrap >/dev/null
