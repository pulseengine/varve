# Fuzzing (REQ-FUZZ-001) — the untrusted-input parsers. A short smoke on
# every PR (fast, catches regressions) + a longer nightly campaign.
# Adapted from pulseengine/sigil's fuzz.yml.

name: Fuzz

on:
  # NO `paths:` filter, deliberately. These five checks are REQUIRED to merge
  # (all 14 CI contexts were made required in v0.20.0), and GitHub treats a
  # required check that never reports as permanently pending — so a
  # path-filtered required workflow deadlocks any PR outside its filter. That
  # happened: the first PR that touched only crates/varve/ could not be merged
  # at all. Requiring a check and conditioning it on paths are incompatible;
  # this keeps the requirement and drops the condition (~60s per target, run in
  # parallel).
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [layer_id, manifest, dsse_verify, pin, realms]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly is required for -Z sanitizer; toolchain action pins the channel below
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz duration
        id: dur
        run: echo "secs=${{ github.event_name == 'schedule' && 600 || 60 }}" >> "$GITHUB_OUTPUT"
      - name: Run ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ steps.dur.outputs.secs }} -rss_limit_mb=4096
      - name: Upload any crash corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
