name: Deposit layer

# The bundle assembler (REQ-DEPOSIT-001, the produce half of the #157
# architecture): download the pinned per-tool releases, VERIFY each one
# against its own repo's cosign identity, deposit them as one signed layer,
# and publish — registry (GHCR) + the oci-layout as the artifact of record.
#
# Rolling channel only until the root ceremony: signs with the PROVISIONAL
# rolling root (trust-roots/rolling.pub / secret VARVE_ROLLING_KEY).

# Two runs dispatched for the SAME layer id would both ask the registry, both
# be told the id is unpublished, and both push — the immutability check is a
# read, and `oras manifest push` has no if-not-exists. One id would end up
# naming two digests, which is the very thing this workflow now checks for.
# Serialising per layer closes the window; it does not need to be clever,
# because a second deposit of the same id has nothing useful to do anyway.
concurrency:
  group: deposit-layer-${{ inputs.layer }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer identifier (YYYY.MM.P), e.g. 2026.08.0"
        required: true
        type: string
      counter:
        description: "Monotonic per-line release counter"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # The layer's contents: bump deliberately, in a reviewed diff.
  # <tool>:<version> triples; all follow <tool>-<ver>-<triple>.tar.gz with
  # a cosign-signed SHA256SUMS.txt except wsc (raw per-platform binaries).
  # ordeal is EXCLUDED until its releases carry cosign-signed sums
  # ordeal rejoined at v0.18.0 — its first cosign-signed release (ordeal#116).
  # Entry shape: repo_tool:version[:binary] — binary defaults to the tool
  # name; kiln ships its CLI as `kilnd`.
  # varve-producer rides in the layer like any other tool, so a layers
  # repository gets a PINNED, signature-verified assembler instead of fetching
  # one ad hoc. Its asset is not `<tool>-<version>-<triple>` — the repo is
  # `varve` and the binary is `varve-producer` — so the entry spells the binary
  # and the template out. `v%V` reconstructs the tag from the bare version
  # rather than repeating it, so a bump is one edit and cannot drift.
  #
  # Bootstrapping is not circular: the deposit downloads the released archive
  # exactly as it does for every other tool. The first assembler comes from the
  # release; after that a layers repo can pin the one varve signed.
  #
  # jess is a HUB: its v0.7.1 release ships `with-device` 0.2.1, so the release
  # tag and the payload version are different numbers. The fifth field records
  # the payload's own version, because deriving it from the tag would put
  # `version = "0.7.1"` in the signed manifest for a binary that answers
  # `with-device 0.2.1` — the layer stating something untrue about its own
  # contents, which is the one thing it exists not to do.
  TARBALL_TOOLS: "rivet:v0.35.0 spar:v0.40.0 synth:v0.61.0 witness:v0.43.0 ordeal:v0.19.0 loom:v1.4.1 meld:v0.53.0 kiln:v0.4.4:kilnd pulseengine/varve:v0.32.0:varve-producer:varve-producer-v%V-%T.tar.gz pulseengine/jess:v0.7.1:with-device:with-device-%V-%T.tar.gz:0.2.1"
  WSC_VERSION: v0.11.0
  # VS Code extensions carried as kind="vsix" payloads (REQ-VSIX-001).
  # Entry shape: repo:version:extension-name:asset-template, where the
  # template spells the release asset with %V for the bare version and, when
  # the extension is per-platform, %P for the VSIX platform tag. An entry
  # WITHOUT %P is one platform-independent package.
  #
  # rivet ships a single portable .vsix; spar ships one per platform, so its
  # payloads carry varve `platform` values and a consumer resolves only their
  # own — the same rule the tool payloads follow.
  VSIX_PACKAGES: "rivet:v0.35.0:rivet-sdlc:rivet-sdlc-%V.vsix spar:v0.40.0:spar-aadl:spar-aadl-%P-%V.vsix"

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-07
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 as of 2026-08-07
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3 as of 2026-08-07
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1 as of 2026-08-07

      - name: Build varve
        run: cargo build --release -p varve -p varve-producer

      - name: Fetch and verify the tools, build the deposit spec
        # The logic is NOT inline any more. It lives in tools/build-deposit-spec.sh
        # so the REQ-SYSTEST-002 gate (tools/systest/deposit-layer.sh, run by
        # systest.yml on every PR) can execute THIS code rather than a copy of
        # it. The 2026.08.3 deposit failed here on a bug that only a real
        # execution could find; a workflow whose only test is dispatching it is
        # a workflow with no test.
        env:
          GH_TOKEN: ${{ github.token }}
          LAYER: ${{ inputs.layer }}
          COUNTER: ${{ inputs.counter }}
        run: tools/build-deposit-spec.sh "$GITHUB_WORKSPACE/deposit-stage"

      - name: Deposit the layer
        env:
          VARVE_ROLLING_KEY: ${{ secrets.VARVE_ROLLING_KEY }}
          LAYER: ${{ inputs.layer }}
          COUNTER: ${{ inputs.counter }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VARVE_ROLLING_KEY" || { echo "::error::VARVE_ROLLING_KEY not provisioned"; exit 1; }
          # The key reaches varve through a FILE DESCRIPTOR, never a file
          # (REQ-NOKEYDISK-001). `docs ci` documents this form and names
          # `echo "$SECRET" > key.tmp` as the thing adopters wrongly invent --
          # and this workflow did exactly that, to a predictable path, on a
          # shared runner, for every deposit. An assessor found it by reading
          # the repository rather than the documentation, which is the way
          # this class of finding is always found.
          ISSUED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The spec and the payload bytes it points at live together under
          # deposit-stage/ — a payload `path` resolves relative to the SPEC
          # FILE's directory, so the staging area moves as one tree.
          ./target/release/varve deposit \
            --spec deposit-stage/deposit-spec.toml \
            --issued-at "$ISSUED_AT" \
            --key <(printf '%s' "$VARVE_ROLLING_KEY") --key-id varve-rolling-1 \
            --out layer-layout
          # Sign and attach a BASELINE line-status (REQ-STATUS-DIST-001) so
          # `varve status` works after an offline OR registry install with no
          # --from-file. Line derived from the layer; the baseline's monotonic
          # counter tracks the deposit counter (advisories issued later carry
          # higher counters). Empty problems/yanked — a clean starting record.
          LINE="${LAYER%.*}"
          # REQ-SUPPORTUNTIL-001: derived from the channel's policy, never
          # typed here. `support-until` has existed and been signed since
          # v0.5.0 and this workflow never set it, so every layer varve has
          # published says "no stated support window" while the docs promise
          # one. `varve sign-status` now refuses a document without it.
          SUPPORT_UNTIL="$(./target/release/varve support-horizon \
            --channel rolling --issued-at "$ISSUED_AT")"
          echo "::notice::layer $LAYER supported until $SUPPORT_UNTIL (rolling policy)"
          printf '{"line":"%s","counter":%s,"issued-at":"%s","support-until":"%s"}\n' \
            "$LINE" "$COUNTER" "$ISSUED_AT" "$SUPPORT_UNTIL" > baseline-status.json
          ./target/release/varve sign-status \
            --file baseline-status.json \
            --key <(printf '%s' "$VARVE_ROLLING_KEY") --key-id varve-rolling-1 \
            --out baseline-status.dsse.json
          ./target/release/varve attach-status \
            --layout layer-layout --status baseline-status.dsse.json
          # Sanity: the deposit installs and verifies on THIS runner before
          # anything is published.
          mkdir -p sanity-project
          printf 'manifest-version = 1\n[toolchain]\nchannel = "rolling"\nlayer = "%s"\n' "$LAYER" > sanity-project/varve.toml
          ( cd sanity-project && \
            VARVE_ROOT="$RUNNER_TEMP/sanity-root" \
            VARVE_TRUST_ROOT="$GITHUB_WORKSPACE/trust-roots/rolling.pub" \
            "$GITHUB_WORKSPACE/target/release/varve" install --from "$GITHUB_WORKSPACE/layer-layout" && \
            VARVE_ROOT="$RUNNER_TEMP/sanity-root" \
            VARVE_TRUST_ROOT="$GITHUB_WORKSPACE/trust-roots/rolling.pub" \
            "$GITHUB_WORKSPACE/target/release/varve" verify )

      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          LAYER: ${{ inputs.layer }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          # Explicit publish: stream every blob with `oras blob push` (no
          # metadata size limits), then push a hand-built artifact manifest —
          # the exact shape RegistrySource consumes (envelope/payload role
          # annotations on layers[]).
          REPO="ghcr.io/pulseengine/varve/layers"
          SIG_TYPE='application/vnd.pulseengine.varve.signature.v1+json'
          STATUS_TYPE='application/vnd.pulseengine.varve.line-status.v1+json'
          mkdir -p push && cd push
          PAYLOAD_DIGEST=$(jq -r --arg t "$SIG_TYPE" --arg s "$STATUS_TYPE" \
            '[.manifests[] | select(.artifactType != $t and .artifactType != $s)][0].digest' ../layer-layout/index.json)
          ENVELOPE_DIGEST=$(jq -r --arg t "$SIG_TYPE" \
            '[.manifests[] | select(.artifactType == $t)][0].digest' ../layer-layout/index.json)
          # The baseline line-status referrer (REQ-STATUS-DIST-001).
          STATUS_DIGEST=$(jq -r --arg s "$STATUS_TYPE" \
            '[.manifests[] | select(.artifactType == $s)][0].digest // empty' ../layer-layout/index.json)
          PAYLOAD_FILE="../layer-layout/blobs/sha256/${PAYLOAD_DIGEST#sha256:}"
          ENVELOPE_FILE="../layer-layout/blobs/sha256/${ENVELOPE_DIGEST#sha256:}"
          STATUS_FILE="../layer-layout/blobs/sha256/${STATUS_DIGEST#sha256:}"

          # 1. Build the artifact manifest — envelope + payload + tools, plus
          #    the baseline line-status as a role-annotated layer so
          #    RegistrySource.fetch_line_status finds it.
          jq -n \
            --arg env_digest "$ENVELOPE_DIGEST" \
            --argjson env_size "$(stat -c%s "$ENVELOPE_FILE")" \
            --arg payload_digest "$PAYLOAD_DIGEST" \
            --argjson payload_size "$(stat -c%s "$PAYLOAD_FILE")" \
            --arg status_digest "$STATUS_DIGEST" \
            --argjson status_size "$(stat -c%s "$STATUS_FILE")" \
            --slurpfile payload "$PAYLOAD_FILE" \
            '{
              schemaVersion: 2,
              mediaType: "application/vnd.oci.image.manifest.v1+json",
              artifactType: "application/vnd.pulseengine.varve.layer.v1+json",
              config: {
                mediaType: "application/vnd.oci.empty.v1+json",
                digest: "sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a",
                size: 2
              },
              layers: ([
                {
                  mediaType: "application/json",
                  digest: $env_digest,
                  size: $env_size,
                  annotations: {"eu.pulseengine.varve.role": "envelope"}
                },
                {
                  mediaType: "application/vnd.oci.image.index.v1+json",
                  digest: $payload_digest,
                  size: $payload_size,
                  annotations: {"eu.pulseengine.varve.role": "payload"}
                },
                {
                  mediaType: "application/json",
                  digest: $status_digest,
                  size: $status_size,
                  annotations: {"eu.pulseengine.varve.role": "line-status"}
                }
              ] + [ $payload[0].manifests[] |
                    { mediaType: "application/octet-stream",
                      digest: .digest,
                      size: .size } ])
            }' > artifact-manifest.json
          head -c 1500 artifact-manifest.json; echo

          # 2. REQ-IMMUTABLE-001 — a layer id names one set of bytes, forever.
          #
          # Ask the registry what it already carries under this tag before
          # ANYTHING is written to it. This runs ahead of the blob pushes,
          # not merely ahead of the manifest push: a refused publish should
          # not leave blobs behind in the destination. (They are
          # content-addressed, so they overwrite nothing — but "the check
          # runs before we touch the registry" should be true rather than
          # nearly true.)
          # rolling republished 2026.08.4 overnight (varve#115) and
          # every name-only pin on it stopped resolving: two digests under one
          # name means the name identifies nothing, and no amount of
          # consumer-side care repairs it afterwards.
          #
          # This cannot live in `varve deposit`, which contacts no network by
          # design. varve-producer is the binary that talks to registries, so
          # it is the one that asks.
          #
          # A registry that cannot ANSWER stops the push. "Unreachable" is not
          # "empty": reading an outage as an empty registry is how you
          # republish over a layer that exists while believing you are
          # publishing a new one.
          # An OCI manifest's digest IS the sha256 of its bytes — verified
          # against the live registry before relying on it: the descriptor
          # ghcr.io returns for 2026.09.0 equals sha256sum of the manifest it
          # serves. (`oras manifest push` has no --dry-run to ask with.)
          INCOMING="sha256:$(sha256sum artifact-manifest.json | cut -d' ' -f1)"
          # NOT piped into tee. `cmd | tee` reports tee's exit status, and
          # `set -euo pipefail` above is the only thing that would save it —
          # a setting a hundred lines away is a thin thread to hang a refusal
          # on. Written to a file, exit status checked on its own line.
          # $GITHUB_WORKSPACE, not ./ — this step runs from `push/` (see the
          # `cd push` above and the `../layer-layout` paths beside it), so a
          # workspace-relative ./target resolved to push/target and the binary
          # was simply not there. Cost a dispatched deposit to find.
          PRODUCER="$GITHUB_WORKSPACE/target/release/varve-producer"
          test -x "$PRODUCER" || {
            echo "::error::$PRODUCER is missing or not executable — the deposit \
          cannot check whether this layer id is already published, and \
          publishing without that check is how one id comes to name two sets \
          of bytes"
            exit 1
          }
          set +e
          "$PRODUCER" publish-check \
            --repo "$REPO" --layer "$LAYER" --digest "$INCOMING" \
            --format json > publish-check.json
          CHECK_RC=$?
          set -e
          cat publish-check.json
          # 127 is "could not run", not "said no". Both stop the push, and
          # must: a check that did not run is not a check that passed. But
          # reporting them identically sends an operator hunting for a
          # republish that never happened — the same conflation this whole
          # check exists to prevent, reproduced one level up in its own error
          # handling.
          if [ "$CHECK_RC" -eq 127 ]; then
            echo "::error::publish-check could not run (exit 127) — this is not \
          a refusal; nothing was checked and nothing was pushed"
            exit "$CHECK_RC"
          fi
          if [ "$CHECK_RC" -ne 0 ]; then
            echo "::error::publish-check REFUSED this push (exit $CHECK_RC) — \
          see the output above for which digests disagree"
            exit "$CHECK_RC"
          fi
          VERDICT="$(jq -r .verdict publish-check.json)"
          # 3. Push every blob: config, envelope, payload, tools, line-status.
          printf '{}' > empty-config.json
          oras blob push "$REPO" empty-config.json
          oras blob push "$REPO" "$ENVELOPE_FILE"
          oras blob push "$REPO" "$PAYLOAD_FILE"
          for digest in $(jq -r '.manifests[].digest' "$PAYLOAD_FILE"); do
            oras blob push "$REPO" "../layer-layout/blobs/sha256/${digest#sha256:}"
          done
          test -n "$STATUS_DIGEST" || { echo "::error::baseline line-status missing from layout"; exit 1; }
          oras blob push "$REPO" "$STATUS_FILE"

          if [ "$VERDICT" = "already-published" ]; then
            echo "::notice::$LAYER is already published at $INCOMING — skipping the push"
          else
            # 4. Push the manifest under the layer tag.
            oras manifest push "$REPO:$LAYER" artifact-manifest.json
          fi

      - name: Upload the oci-layout (artifact of record)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer-${{ inputs.layer }}-oci-layout
          path: layer-layout
          retention-days: 90
