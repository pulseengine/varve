[package]
name = "varve-producer"
description = "Assemble, sign and publish a varve layer — the producer half of the pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "0.9.8", features = ["serde"] }
varve-core.workspace = true
