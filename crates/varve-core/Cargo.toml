[package]
name = "varve-core"
description = "Layer manifests, resolution, the core store, and verification wiring for varve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
homepage = "https://github.com/pulseengine/varve"
documentation = "https://docs.rs/varve-core"
rust-version = "1.89"
keywords = ["toolchain", "supply-chain", "signing", "verification", "oci"]
categories = ["development-tools", "development-tools::build-utils", "cryptography"]

[dependencies]
flate2 = "1.1.9"
hex = "0.4.3"
# Pure-Rust xz. The Zephyr SDK and every wasmtime archive are .tar.xz, and a
# C-linked decoder (xz2/liblzma) would put a C build dependency in the crate
# every consumer links, which cross-compilation and the air-gap story both pay
# for. The bytes are digest-verified before they reach a decoder, so decoder
# maturity buys less here than the pure-Rust property does.
lzma-rs = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.4"
ureq = "3"
# Reading a binary WIT package (DD-036). The `wit` payload form is the one
# `wkg`'s local backend reads, so the closure must be derived by DECODING that
# form — and hand-rolling a component-model reader to avoid a dependency would
# put the trickiest parser in the workspace in the trusted base. Only the
# `decoding` feature is taken: no `wat` text parser, no serde surface, and no
# encoder at all — nothing in varve writes a WIT package.
wit-parser = { version = "0.261.0", default-features = false, features = ["decoding"] }
wsc = "0.11.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
tempfile = "3.27.0"
# The reference ENCODER for binary WIT packages, used only to build fixtures so
# the closure tests read the same bytes `wkg` writes rather than a shape we
# invented. Deliberately a dev-dependency: varve decodes WIT packages, it never
# produces them, and an encoder in the production path would be an export
# adapter wearing a parser's name.
wit-component = "0.261.0"

[[bench]]
name = "resolve"
harness = false
