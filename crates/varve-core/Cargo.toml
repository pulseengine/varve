[package]
name = "varve-core"
description = "Layer manifests, resolution, the core store, and verification wiring for varve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1.1.9"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.4"
ureq = "3"
wsc = "0.10.0"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "resolve"
harness = false
