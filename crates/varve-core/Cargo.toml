[package]
name = "varve-core"
description = "Layer manifests, resolution, the core store, and verification wiring for varve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
homepage = "https://github.com/pulseengine/varve"
documentation = "https://docs.rs/varve-core"
rust-version = "1.89"
keywords = ["toolchain", "supply-chain", "signing", "verification", "oci"]
categories = ["development-tools", "development-tools::build-utils", "cryptography"]

[dependencies]
flate2 = "1.1.9"
hex = "0.4.3"
# Pure-Rust xz. The Zephyr SDK and every wasmtime archive are .tar.xz, and a
# C-linked decoder (xz2/liblzma) would put a C build dependency in the crate
# every consumer links, which cross-compilation and the air-gap story both pay
# for. The bytes are digest-verified before they reach a decoder, so decoder
# maturity buys less here than the pure-Rust property does.
lzma-rs = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
# Pinned EXACTLY to 2.0.0 (2026-10-13), the established release. 2.1.0 was
# published hours before this was written (2026-11-03), and a crate that new
# does not belong in the path that reads untrusted module.yml files. Lift the
# pin deliberately, after the release has aged.
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.4"
# Below 3.5, for wsc's sake, not ours. ureq 3.5.0 (2026-10-21) changed
# `unversioned::transport::TransportAdapter::new` (a module ureq exempts from
# semver), and wsc 0.11.0 calls it with the old arity, so wsc stops compiling.
# One 3.x is chosen for the whole graph, so this cap is what keeps wsc on a
# version it builds against wherever no lockfile decides: the fuzz workspace
# (all five fuzz jobs went red on #279) and `cargo install varve` without
# --locked. Lift it when sigil ships a wsc that builds against 3.5.
# `platform-verifier`: TLS trust comes from the OS store (REQ-OSTRUST-001),
# selected per agent with `RootCerts::PlatformVerifier` in src/tls.rs. The
# default features stay on — they carry ureq's ring provider, and wsc enables
# them anyway (it pulls `webpki-roots` itself), so dropping them here would
# remove nothing from the graph.
ureq = { version = ">=3, <3.5", features = ["platform-verifier"] }
# Reading a binary WIT package (DD-036). The `wit` payload form is the one
# `wkg`'s local backend reads, so the closure must be derived by DECODING that
# form — and hand-rolling a component-model reader to avoid a dependency would
# put the trickiest parser in the workspace in the trusted base. Only the
# `decoding` feature is taken: no `wat` text parser, no serde surface, and no
# encoder at all — nothing in varve writes a WIT package.
wit-parser = { version = "0.263.0", default-features = false, features = ["decoding"] }
wsc = "0.11.0"

# `run --with` opens a private shim directory's lock with the platform's
# O_NONBLOCK | O_NOFOLLOW (they differ between architectures). Already in the
# graph via tempfile; only its `fs` feature is used.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
tempfile = "3.27.0"
# REQ-OSTRUST-001's negative and positive controls: an in-process HTTPS server
# whose certificate chains to a CA generated per run. Both are already in the
# graph (rcgen via wsc, rustls via ureq), on ring, so no new crate is built.
rcgen = "0.13.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# The reference ENCODER for binary WIT packages, used only to build fixtures so
# the closure tests read the same bytes `wkg` writes rather than a shape we
# invented. Deliberately a dev-dependency: varve decodes WIT packages, it never
# produces them, and an encoder in the production path would be an export
# adapter wearing a parser's name.
wit-component = "0.263.0"

[[bench]]
name = "resolve"
harness = false
