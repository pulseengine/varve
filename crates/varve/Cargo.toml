[package]
name = "varve"
description = "The PulseEngine toolchain layer manager — pinned, signed, dated toolchain bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
homepage = "https://github.com/pulseengine/varve"
documentation = "https://docs.rs/varve"
rust-version = "1.89"
keywords = ["toolchain", "supply-chain", "signing", "reproducible", "oci"]
categories = ["command-line-utilities", "development-tools", "development-tools::build-utils", "cryptography"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
serde_json = "1.0.151"
varve-core.workspace = true
# `varve run --with` (REQ-RUNWITH-001): the private shim directory a spawned
# command gets first on PATH. mkdtemp semantics (0700, unpredictable name);
# already in the graph as a dev-dependency.
tempfile = "3.27.0"

# `varve run --with` spawns its command through a gate instead of exec'ing it,
# catches SIGHUP/SIGINT/SIGQUIT/SIGTERM to outlive them and remove the shim
# directory, forwards SIGTERM, and dies of the signal its child died of. This
# crate forbids unsafe code, so the handling is signal-hook's safe iterator
# and `emulate_default_handler`, and rustix supplies `kill_process`, `waitid`
# and the fd flag that lets the gate's pipe end survive exec (already in the
# graph via tempfile; only its `process` feature is added).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
flate2 = "1.1.9"
tar = "0.4.46"
assert_cmd = "2.2.2"
hex = "0.4.3"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
wsc-attestation = "0.12.0"
# Fixture-only: encode a real binary WIT package for the export-wit negative
# controls (REQ-EXPORTDECL-001). Both are already in the lockfile via varve-core.
wit-component = "0.263.0"
wit-parser = { version = "0.263.0", default-features = false }
