[package]
name = "varve"
description = "The PulseEngine toolchain layer manager — pinned, signed, dated toolchain bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
homepage = "https://github.com/pulseengine/varve"
documentation = "https://docs.rs/varve"
rust-version = "1.89"
keywords = ["toolchain", "supply-chain", "signing", "reproducible", "oci"]
categories = ["command-line-utilities", "development-tools", "development-tools::build-utils", "cryptography"]

[dependencies]
anyhow = "1.0.104"
# `wrap_help`: --help wraps to the terminal width (COLUMNS when there is no
# terminal), capped at 100 columns by `help::MAX_WIDTH`.
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
# The width `varve --help` lays its grouped command list out for, read the
# way clap reads it; the same crate and version `wrap_help` brings in.
terminal_size = "0.4.4"
clap_complete = "4.6.9"
serde_json = "1.0.151"
varve-core.workspace = true
# `varve run --with` (REQ-RUNWITH-001): the private shim directory a spawned
# command gets first on PATH. mkdtemp semantics (0700, unpredictable name);
# already in the graph as a dev-dependency.
tempfile = "3.27.0"

# `varve run --with` starts its command through a gate (this binary, run
# again) instead of exec'ing it, catches SIGHUP/SIGINT/SIGQUIT/SIGTERM (and
# SIGCHLD) to outlive them and remove the shim directory, forwards SIGTERM,
# and dies of the signal its child died of where that is not a core dump.
# This crate forbids unsafe code, so the handling is signal-hook's safe
# iterator, flag and `emulate_default_handler`, and rustix supplies
# `kill_process`, `waitid`, the parent pid for the gate and the lock-open
# flags (already in the graph via tempfile; its `fs` and `process` features).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"
rustix = { version = "1.1.6", features = ["fs", "process"] }

[dev-dependencies]
flate2 = "1.1.9"
tar = "0.4.46"
assert_cmd = "2.2.2"
hex = "0.4.3"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
wsc-attestation = "0.12.0"
# Fixture-only: encode a real binary WIT package for the export-wit negative
# controls (REQ-EXPORTDECL-001). Both are already in the lockfile via varve-core.
wit-component = "0.263.0"
wit-parser = { version = "0.263.0", default-features = false }
